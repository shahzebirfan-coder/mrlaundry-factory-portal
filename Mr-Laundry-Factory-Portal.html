/* ============================================================
   MR LAUNDRY FACTORY PORTAL — STYLESHEET
   Light + Dark theme · Sidebar shell · Cards · Tables · Modals
   ============================================================ */

:root {
  --brand: #4f7cff;
  --brand-2: #7c5cff;
  --brand-soft: #eef3ff;
  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-3: #eff2f9;
  --border: #e4e8f1;
  --border-strong: #d3d9e6;
  --text: #101828;
  --text-2: #5a6577;
  --text-3: #8b95a7;
  --ok: #16a34a;
  --ok-soft: #e8f8ee;
  --warn: #d97706;
  --warn-soft: #fef4e6;
  --danger: #dc2626;
  --danger-soft: #fdeded;
  --info: #0891b2;
  --info-soft: #e6f7fb;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 8px 24px rgba(16, 24, 40, .06);
  --shadow-lg: 0 18px 50px rgba(16, 24, 40, .16);
  --r: 14px;
  --r-sm: 10px;
  --sidebar-w: 262px;
}

html[data-theme="dark"] {
  --brand: #6b93ff;
  --brand-2: #9b7cff;
  --brand-soft: #1b2440;
  --bg: #0b1220;
  --surface: #121a2b;
  --surface-2: #172033;
  --surface-3: #1d2740;
  --border: #253048;
  --border-strong: #33405d;
  --text: #eaf0ff;
  --text-2: #9aa7c2;
  --text-3: #6f7d99;
  --ok: #34d399; --ok-soft: #0f2f24;
  --warn: #fbbf24; --warn-soft: #33270f;
  --danger: #f87171; --danger-soft: #35191b;
  --info: #38bdf8; --info-soft: #0e2a3a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4 { margin: 0; }
::selection { background: rgba(79, 124, 255, .25); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 20px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ SHELL ============ */
.shell { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; z-index: 60;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 16px 16px 14px; border-bottom: 1px solid var(--border); }
.brand-logo { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; background: #000; box-shadow: var(--shadow); }
.brand-txt { display: flex; flex-direction: column; line-height: 1.25; overflow: hidden; }
.brand-txt b { font-size: 14.5px; font-weight: 800; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-txt span { font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }

.nav { flex: 1; overflow-y: auto; padding: 10px 10px 4px; }
.nav-sec { font-size: 10.5px; font-weight: 800; letter-spacing: .9px; text-transform: uppercase; color: var(--text-3); padding: 14px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
  font-weight: 600; color: var(--text-2); cursor: pointer; margin-bottom: 2px;
  transition: background .16s ease, color .16s ease, transform .16s ease; position: relative;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); transform: translateX(2px); }
.nav-item.on { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: 0 8px 20px rgba(79, 124, 255, .28); }
.nav-item.on .nav-ico { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .3)); }
.nav-ico { width: 20px; text-align: center; font-size: 15px; }
.nav-lbl { flex: 1; font-size: 13.2px; }
.nav-badge { background: var(--brand-soft); color: var(--brand); font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 20px; }
.nav-item.on .nav-badge { background: rgba(255, 255, 255, .25); color: #fff; }
.nav-badge.warn { background: var(--warn-soft); color: var(--warn); }

.side-foot { border-top: 1px solid var(--border); padding: 12px; }
.sf-user { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 36px;
  background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; font-weight: 800; font-size: 12.5px;
}
.sf-txt { display: flex; flex-direction: column; line-height: 1.25; overflow: hidden; }
.sf-txt b { font-size: 13px; }
.sf-txt span { font-size: 11px; color: var(--text-3); font-weight: 600; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 12px;
  padding: 12px 18px; background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
}
.menu-btn { display: none !important; }
.tb-title { flex: 1; min-width: 0; }
.tb-title h1 { font-size: 18px; font-weight: 800; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-title p { margin: 1px 0 0; font-size: 12.2px; color: var(--text-3); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-actions { display: flex; align-items: center; gap: 8px; }
.page { padding: 18px; flex: 1; }
.foot { padding: 14px 18px 22px; color: var(--text-3); font-size: 11.5px; text-align: center; }
.side-overlay { display: none; }

/* ============ GLOBAL SEARCH ============ */
.gs-wrap { position: relative; }
.gs { width: 230px; }
.gs-drop {
  position: absolute; top: calc(100% + 6px); left: 0; width: 340px; max-height: 380px; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  box-shadow: var(--shadow-lg); padding: 6px; display: none; z-index: 80;
}
.gs-drop.show { display: block; animation: pop .16s ease; }
.gs-sec { font-size: 10.5px; font-weight: 800; color: var(--text-3); text-transform: uppercase; letter-spacing: .6px; padding: 8px 8px 4px; }
.gs-item { display: flex; gap: 10px; padding: 8px; border-radius: 9px; cursor: pointer; align-items: flex-start; }
.gs-item:hover { background: var(--surface-2); }
.gs-item b { font-size: 13px; display: block; }
.gs-item i { font-size: 11.5px; color: var(--text-3); font-style: normal; }
.gs-empty { padding: 14px; text-align: center; color: var(--text-3); font-size: 12.5px; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 15px; border-radius: 11px; border: 1px solid transparent;
  font-family: inherit; font-size: 13.2px; font-weight: 700; cursor: pointer;
  transition: transform .14s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
  white-space: nowrap; background: var(--surface-3); color: var(--text);
}
.btn:active { transform: scale(.97); }
.btn:hover { box-shadow: var(--shadow); }
.btn-primary { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: 0 8px 20px rgba(79, 124, 255, .3); }
.btn-ghost { background: var(--surface); border-color: var(--border); color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; box-shadow: 0 8px 20px rgba(22, 163, 74, .3); }
.btn-warn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
.btn-sm { padding: 7px 11px; font-size: 12.3px; border-radius: 9px; }
.btn-xs { padding: 5px 9px; font-size: 11.4px; border-radius: 8px; }
.btn-lg { padding: 14px 22px; font-size: 15px; border-radius: 13px; }
.btn-block { width: 100%; }
.icon-btn {
  width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
  cursor: pointer; font-size: 15px; transition: all .16s ease;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); box-shadow: var(--shadow); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ============ INPUTS ============ */
.inp, select.inp, textarea.inp {
  width: 100%; padding: 10px 12px; border-radius: 11px; border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text); font-family: inherit; font-size: 13.6px; font-weight: 600;
  transition: border .16s ease, box-shadow .16s ease; outline: none;
}
.inp:focus { border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 16%, transparent); }
.inp-sm { padding: 7px 10px; font-size: 12.6px; border-radius: 9px; }
.inp-xs { padding: 5px 8px; font-size: 12px; border-radius: 8px; }
textarea.inp { min-height: 74px; resize: vertical; font-weight: 500; }
label.fld { display: block; margin-bottom: 12px; }
label.fld > span { display: block; font-size: 11.6px; font-weight: 700; color: var(--text-2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .3px; }
.fld-hint { font-size: 11.2px; color: var(--text-3); margin-top: 4px; font-weight: 500; }
.req { color: var(--danger); }
.inp-money { font-variant-numeric: tabular-nums; }

/* ============ CARDS ============ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); }
.card + .card { margin-top: 14px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card-head h3 { font-size: 14.5px; font-weight: 800; }
.card-head .sp { flex: 1; }
.card-head p { margin: 2px 0 0; font-size: 11.8px; color: var(--text-3); }
.card-body { padding: 16px; }
.card-body.tight { padding: 10px; }
.card-flat { box-shadow: none; }

/* ============ STAT CARDS ============ */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 13px; margin-bottom: 14px; }
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  padding: 14px 15px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  transition: transform .18s ease, box-shadow .18s ease;
}
.stat::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--brand); opacity: .85; }
.stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.stat-click { cursor: pointer; }
.stat-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.stat-ic { font-size: 15px; }
.stat-lbl { font-size: 11.4px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .35px; }
.stat-val { font-size: 24px; font-weight: 850; letter-spacing: -.7px; font-variant-numeric: tabular-nums; }
.stat-foot { font-size: 11.4px; color: var(--text-3); margin-top: 5px; font-weight: 600; }
.stat.good::after { background: var(--ok); }
.stat.good .stat-val { color: var(--ok); }
.stat.bad::after { background: var(--danger); }
.stat.bad .stat-val { color: var(--danger); }
.stat.warn::after { background: var(--warn); }
.stat.warn .stat-val { color: var(--warn); }
.stat.info::after { background: var(--info); }
.stat.info .stat-val { color: var(--info); }
.stat.purple::after { background: var(--brand-2); }

/* ============ PERIOD BAR ============ */
.period-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  padding: 10px 12px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.seg { display: flex; gap: 4px; background: var(--surface-3); padding: 4px; border-radius: 11px; }
.seg-btn {
  border: 0; background: transparent; padding: 7px 13px; border-radius: 8px; cursor: pointer;
  font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--text-2); transition: all .16s ease; white-space: nowrap;
}
.seg-btn:hover { color: var(--text); }
.seg-btn.on { background: var(--surface); color: var(--brand); box-shadow: var(--shadow); }
.pb-lbl { font-size: 12px; font-weight: 700; color: var(--text-2); }

/* ============ TABS ============ */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 2px; }
.tab {
  padding: 9px 14px; border-radius: 10px 10px 0 0; border: 0; background: transparent; cursor: pointer;
  font-family: inherit; font-size: 13px; font-weight: 700; color: var(--text-2); position: relative; transition: all .16s;
}
.tab:hover { color: var(--text); background: var(--surface-2); }
.tab.on { color: var(--brand); }
.tab.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -3px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); }

/* ============ TABLES ============ */
.tbl-wrap { overflow-x: auto; border-radius: var(--r); }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 620px; }
table.tbl th {
  text-align: left; font-size: 10.9px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3);
  font-weight: 800; padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap;
  position: sticky; top: 0; z-index: 2;
}
table.tbl th.sortable { cursor: pointer; user-select: none; }
table.tbl th.sortable:hover { color: var(--brand); }
table.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.tbl tbody tr { transition: background .14s ease; }
table.tbl tbody tr:hover { background: var(--surface-2); }
table.tbl tbody tr.row-click { cursor: pointer; }
table.tbl tfoot td { padding: 10px 12px; font-weight: 800; background: var(--surface-2); border-top: 2px solid var(--border-strong); }
.t-right { text-align: right; font-variant-numeric: tabular-nums; }
.t-center { text-align: center; }
.t-mono { font-variant-numeric: tabular-nums; }
.t-strong { font-weight: 800; }
.t-muted { color: var(--text-3); }
.t-ok { color: var(--ok); font-weight: 700; }
.t-bad { color: var(--danger); font-weight: 700; }
.t-warn { color: var(--warn); font-weight: 700; }
.t-nowrap { white-space: nowrap; }

/* ============ PILLS & BADGES ============ */
.pill { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-due { background: var(--danger-soft); color: var(--danger); }
.pill-muted { background: var(--surface-3); color: var(--text-3); }
.pill-info { background: var(--info-soft); color: var(--info); }
.pill-brand { background: var(--brand-soft); color: var(--brand); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 7px; font-size: 11px; font-weight: 800; background: var(--surface-3); color: var(--text-2); }

.empty { padding: 38px 16px; text-align: center; color: var(--text-3); font-weight: 600; font-size: 13px; }
.empty-ico { font-size: 34px; margin-bottom: 8px; opacity: .8; }

/* ============ LAYOUT HELPERS ============ */
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-2-1 { grid-template-columns: 2fr 1fr; }
.g-1-2 { grid-template-columns: 1fr 2fr; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.mt0 { margin-top: 0 } .mt6 { margin-top: 6px } .mt10 { margin-top: 10px } .mt14 { margin-top: 14px } .mt20 { margin-top: 20px }
.mb0 { margin-bottom: 0 } .mb6 { margin-bottom: 6px } .mb10 { margin-bottom: 10px } .mb14 { margin-bottom: 14px }
.muted { color: var(--text-3) } .dim { color: var(--text-2) }
.small { font-size: 12px } .tiny { font-size: 11px }
.big { font-size: 20px; font-weight: 850; letter-spacing: -.4px }
.center { text-align: center } .right { text-align: right }
.flex1 { flex: 1 } .grow { flex: 1 1 220px }
.hide { display: none !important }
.nowrap { white-space: nowrap }
.divider { height: 1px; background: var(--border); margin: 12px 0 }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
.kv:last-child { border-bottom: 0; }
.kv span { color: var(--text-2); font-weight: 600; }
.kv b { font-weight: 800; font-variant-numeric: tabular-nums; }
.kv.total { border-top: 2px solid var(--border-strong); border-bottom: 0; margin-top: 6px; padding-top: 10px; font-size: 15px; }
.kv.total b { font-size: 17px; }
.note-box { background: var(--warn-soft); border: 1px dashed color-mix(in srgb, var(--warn) 45%, transparent); color: var(--text); border-radius: var(--r-sm); padding: 10px 12px; font-size: 12.4px; line-height: 1.6; }
.note-box.info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 40%, transparent); }
.note-box.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.note-box.bad { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }

/* ============ CHART ============ */
.chart-wrap { width: 100%; }
.bar-chart { width: 100%; display: block; color: var(--text-3); }
.chart-legend { display: flex; gap: 14px; justify-content: center; font-size: 11.6px; color: var(--text-2); font-weight: 700; margin-top: 6px; }
.dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 5px; }
.dot.inc { background: linear-gradient(135deg, #4f7cff, #7c5cff); }
.dot.exp { background: linear-gradient(135deg, #f87171, #ef4444); }

/* progress rows */
.prow { margin-bottom: 11px; }
.prow-top { display: flex; justify-content: space-between; font-size: 12.4px; font-weight: 700; margin-bottom: 5px; color: var(--text-2); }
.prow-top b { color: var(--text); }
.pbar { height: 9px; background: var(--surface-3); border-radius: 20px; overflow: hidden; }
.pbar i { display: block; height: 100%; border-radius: 20px; transition: width .5s cubic-bezier(.4, 0, .2, 1); }

/* donut */
.donut-wrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.donut { width: 138px; height: 138px; border-radius: 50%; position: relative; flex: 0 0 138px; }
.donut-hole {
  position: absolute; inset: 16px; background: var(--surface); border-radius: 50%;
  display: grid; place-items: center; align-content: center; text-align: center;
}
.donut-hole b { font-size: 20px; font-weight: 850; letter-spacing: -.5px; }
.donut-hole span { font-size: 10.5px; color: var(--text-3); font-weight: 700; letter-spacing: .8px; }
.donut-legend { flex: 1; min-width: 200px; }
.dl-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12.6px; border-bottom: 1px dashed var(--border); }
.dl-row:last-child { border-bottom: 0; }
.dl-row i { width: 10px; height: 10px; border-radius: 3px; }
.dl-lbl { flex: 1; font-weight: 700; color: var(--text-2); }
.dl-row b { font-weight: 800; font-variant-numeric: tabular-nums; }
.dl-row em { font-style: normal; font-size: 11px; color: var(--text-3); background: var(--surface-3); padding: 1px 6px; border-radius: 6px; font-weight: 700; }

/* ============ QUICK MENU ============ */
.quick-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qm-item {
  text-align: left; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface-2); font-family: inherit; font-size: 12.8px; font-weight: 700; color: var(--text); cursor: pointer;
}
.qm-item:hover { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

/* ============ MODAL ============ */
#modal-root { position: relative; z-index: 200; }
.modal-wrap { position: fixed; inset: 0; display: grid; place-items: center; padding: 18px; z-index: 200; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(9, 14, 26, .55); backdrop-filter: blur(3px); opacity: 0; transition: opacity .2s ease; }
.modal-wrap.show .modal-backdrop { opacity: 1; }
.modal {
  position: relative; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg);
  width: 100%; max-width: 640px; max-height: 92vh; display: flex; flex-direction: column;
  transform: translateY(16px) scale(.98); opacity: 0; transition: all .24s cubic-bezier(.4, 0, .2, 1);
  border: 1px solid var(--border);
}
.modal-wrap.show .modal { transform: none; opacity: 1; }
.modal-sm { max-width: 430px; }
.modal-lg { max-width: 880px; }
.modal-xl { max-width: 1120px; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
.modal-head h3 { flex: 1; font-size: 15.5px; font-weight: 800; }
.modal-body { padding: 18px; overflow-y: auto; }
.modal-foot { padding: 13px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; background: var(--surface-2); border-radius: 0 0 18px 18px; }

/* ============ TOAST ============ */
#toast-container { position: fixed; top: 16px; right: 16px; z-index: 400; display: flex; flex-direction: column; gap: 9px; pointer-events: none; }
.toast {
  display: flex; gap: 10px; align-items: center; min-width: 250px; max-width: 400px;
  background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--brand);
  border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 650;
  animation: toastIn .28s cubic-bezier(.4, 0, .2, 1); pointer-events: auto;
}
.toast.out { animation: toastOut .3s forwards ease; }
.toast-success { border-left-color: var(--ok); }
.toast-error { border-left-color: var(--danger); }
.toast-warn { border-left-color: var(--warn); }
.t-ico { font-size: 15px; }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px) } to { opacity: 1; transform: none } }
@keyframes toastOut { to { opacity: 0; transform: translateX(40px) } }

/* ============ PICKER ============ */
.picker { display: flex; gap: 8px; }
.picker select { flex: 1; }
.picker .btn { flex: 0 0 auto; }

/* ============ CATEGORY INPUT GRID (New Sales) ============ */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.cat-card { border: 1.6px solid var(--border); border-radius: var(--r); padding: 13px; background: var(--surface-2); transition: all .18s ease; }
.cat-card.on { border-color: var(--cat-color, var(--brand)); background: color-mix(in srgb, var(--cat-color, var(--brand)) 8%, var(--surface)); box-shadow: 0 8px 22px color-mix(in srgb, var(--cat-color, var(--brand)) 18%, transparent); }
.cat-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cat-dot { width: 12px; height: 12px; border-radius: 4px; background: var(--cat-color, var(--brand)); }
.cat-name { font-weight: 800; font-size: 13.6px; flex: 1; }
.cat-kg-input { display: flex; align-items: center; gap: 8px; }
.cat-kg-input .inp { font-size: 20px; font-weight: 850; padding: 9px 11px; text-align: center; }
.cat-unit { font-weight: 800; color: var(--text-3); font-size: 12.5px; }
.cat-items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.item-chip {
  border: 1.4px solid var(--border); background: var(--surface); border-radius: 9px; padding: 6px 10px;
  font-size: 12.2px; font-weight: 700; cursor: pointer; color: var(--text-2); transition: all .15s ease; font-family: inherit;
}
.item-chip:hover { border-color: var(--brand); color: var(--brand); transform: translateY(-1px); }
.item-chip.on { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 6px 16px rgba(79, 124, 255, .3); }
.item-chip small { opacity: .75; font-weight: 700; }

.kg-total-bar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff;
  border-radius: var(--r); padding: 14px 18px; box-shadow: 0 14px 34px rgba(79, 124, 255, .28);
}
.kg-total-bar .kt-lbl { font-size: 11.6px; font-weight: 700; opacity: .9; text-transform: uppercase; letter-spacing: .5px; }
.kg-total-bar .kt-val { font-size: 26px; font-weight: 850; letter-spacing: -.8px; }
.kg-total-bar .kt-sep { width: 1px; align-self: stretch; background: rgba(255, 255, 255, .3); }
.kg-total-bar .kt-item { min-width: 108px; }

/* summary sticky panel */
.sum-panel { position: sticky; top: 84px; }
.bill-lines { border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
.bill-line { display: flex; justify-content: space-between; gap: 10px; padding: 9px 11px; font-size: 12.8px; border-bottom: 1px solid var(--border); background: var(--surface); }
.bill-line:last-child { border-bottom: 0; }
.bill-line b { font-variant-numeric: tabular-nums; }

/* ============ TIMELINE (sale detail) ============ */
.timeline { display: flex; gap: 0; align-items: flex-start; margin: 6px 0 16px; }
.tl-step { flex: 1; text-align: center; position: relative; }
.tl-step::before { content: ''; position: absolute; top: 17px; left: 0; right: 0; height: 3px; background: var(--surface-3); }
.tl-step:first-child::before { left: 50%; }
.tl-step:last-child::before { right: 50%; }
.tl-step.done::before, .tl-step.cur::before { background: var(--ok); }
.tl-dot {
  position: relative; width: 36px; height: 36px; margin: 0 auto 7px; border-radius: 50%;
  display: grid; place-items: center; background: var(--surface-3); color: var(--text-3); font-size: 15px;
  border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border); z-index: 2;
}
.tl-step.done .tl-dot { background: var(--ok); color: #fff; box-shadow: 0 0 0 3px var(--ok-soft); }
.tl-step.cur .tl-dot { background: var(--brand); color: #fff; box-shadow: 0 0 0 3px var(--brand-soft); animation: pulse 1.8s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 3px var(--brand-soft) } 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--brand) 12%, transparent) } }
.tl-lbl { font-size: 11.4px; font-weight: 800; color: var(--text-2); }
.tl-sub { font-size: 10.6px; color: var(--text-3); }

/* ============ LOGIN ============ */
.login-wrap {
  min-height: 100vh; display: grid; place-items: center; padding: 20px;
  background:
    radial-gradient(1100px 520px at 12% -5%, rgba(124, 92, 255, .30), transparent 60%),
    radial-gradient(900px 500px at 90% 105%, rgba(79, 124, 255, .32), transparent 60%),
    linear-gradient(140deg, #0e1530 0%, #131c3c 45%, #1b2450 100%);
}
.login-card {
  width: 100%; max-width: 410px; background: var(--surface); border-radius: 22px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .45); padding: 30px 26px; text-align: center;
  animation: cardIn .5s cubic-bezier(.4, 0, .2, 1);
}
@keyframes cardIn { from { opacity: 0; transform: translateY(24px) } to { opacity: 1; transform: none } }
.login-card img { width: 82px; height: 82px; object-fit: cover; border-radius: 20px; background: #000; box-shadow: 0 12px 30px rgba(0, 0, 0, .28); }
.login-card h1 { font-size: 21px; font-weight: 850; margin-top: 14px; letter-spacing: -.4px; }
.login-card p.tag { font-size: 12.6px; color: var(--text-3); margin: 4px 0 20px; font-weight: 600; }
.login-card .inp { text-align: left; }
.login-hint { margin-top: 16px; font-size: 11.4px; color: var(--text-3); background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: var(--r-sm); padding: 9px; line-height: 1.6; }

/* ============ PRINT HELPERS (screen preview) ============ */
#print-frame { position: fixed; right: 0; bottom: 0; width: 0; height: 0; border: 0; visibility: hidden; }

/* ============ RESPONSIVE ============ */
@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-2-1, .g-1-2 { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .sidebar {
    position: fixed; left: 0; top: 0; transform: translateX(-104%); transition: transform .26s cubic-bezier(.4, 0, .2, 1);
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: none; }
  .side-overlay { display: block; position: fixed; inset: 0; background: rgba(9, 14, 26, .5); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 55; }
  .side-overlay.show { opacity: 1; pointer-events: auto; }
  .menu-btn { display: grid !important; }
  .gs { width: 150px; }
  .page { padding: 14px; }
  .g3, .g2 { grid-template-columns: 1fr; }
}
@media (max-width: 620px) {
  .stats { grid-template-columns: 1fr; }
  .tb-title p { display: none; }
  .tb-title h1 { font-size: 15.5px; }
  .gs { display: none; }
  .g4 { grid-template-columns: 1fr; }
  .stat-val { font-size: 21px; }
  .quick-menu { grid-template-columns: 1fr; }
  .modal { max-height: 96vh; }
}

/* ============ PRINT (main window) ============ */
@media print {
  .sidebar, .topbar, .foot, .period-bar, .btn, .tabs { display: none !important; }
  body { background: #fff; }
}

/* ============ QUICK ACTION GRID (dashboard) ============ */
.qgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.qa {
  display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: pointer;
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px;
  background: var(--surface-2); font-family: inherit; color: var(--text);
  transition: transform .16s ease, box-shadow .18s ease, border-color .18s ease;
}
.qa:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--brand); }
.qa span { font-size: 19px; }
.qa b { font-size: 12.9px; font-weight: 800; }
.qa i { font-size: 11px; color: var(--text-3); font-style: normal; font-weight: 600; }
.qa-brand { border-left: 4px solid var(--brand); }
.qa-ok { border-left: 4px solid var(--ok); }
.qa-warn { border-left: 4px solid var(--warn); }
.qa-info { border-left: 4px solid var(--info); }
.qa-purple { border-left: 4px solid var(--brand-2); }
.qa-dark { border-left: 4px solid var(--text-2); }

/* code snippet + mono */
.codesnip {
  background: var(--surface-3); border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.4px; line-height: 1.6; overflow-x: auto; white-space: pre; color: var(--text-2); margin: 6px 0;
}
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }

</style>

<script>
/* ============================================================
   MR LAUNDRY FACTORY PORTAL — UTILITIES
   Helpers: DOM, formatting, date ranges, modal, toast, print, export

/* ---------------- DOM ----------------
   Scoped lookup: agar root diya gaya ho aur selector sirf "#id" ho to
   apne aap descendants mein dhoondein — is tarah ek jaisi id wale do
   modals (ya band hone wala modal) aapas mein conflict nahi karte. */
function $(sel, root) {
  root = root || document;
  if (root !== document && typeof sel === 'string' && /^#[A-Za-z][\w:.-]*$/.test(sel)) {
    const id = sel.slice(1);
    const all = root.getElementsByTagName('*');
    for (let i = 0; i < all.length; i++) { if (all[i].id === id) return all[i]; }
    return null;
  }
  return root.querySelector(sel);
}
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }

/* ---------------- SAFE STORAGE ----------------
   Sandboxed iframe / private mode mein localStorage block ho sakta hai —
   is liye har access safe wrapper se hota hai (warna woh jagah chal nahi pati). */
const SafeStore = {
  mem: {},
  ok: (function () {
    try { localStorage.setItem('__mlfTest', '1'); localStorage.removeItem('__mlfTest'); return true; }
    catch (e) { return false; }
  })(),
  get(k) {
    try { return this.ok ? localStorage.getItem(k) : (Object.prototype.hasOwnProperty.call(this.mem, k) ? this.mem[k] : null); }
    catch (e) { return Object.prototype.hasOwnProperty.call(this.mem, k) ? this.mem[k] : null; }
  },
  set(k, v) {
    try { if (this.ok) { localStorage.setItem(k, v); return true; } } catch (e) { /* fall through */ }
    this.mem[k] = String(v);
    return false;
  },
  del(k) {
    try { if (this.ok) localStorage.removeItem(k); } catch (e) {}
    delete this.mem[k];
  }
};

/* ---------------- IDS ---------------- */
function uid(prefix) {
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* ---------------- NUMBERS ---------------- */
function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function round1(v) { return Math.round((num(v) + Number.EPSILON) * 10) / 10; }
function round2(v) { return Math.round((num(v) + Number.EPSILON) * 100) / 100; }
function fmtNum(v, dp) {
  const n = num(v);
  const d = (dp === undefined) ? (Math.abs(n % 1) > 0.001 ? 2 : 0) : dp;
  return n.toLocaleString('en-PK', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtKg(v) { return fmtNum(round1(v), Math.abs(num(v) % 1) > 0.001 ? 1 : 0) + ' kg'; }
function fmtPcs(v) { return fmtNum(v, 0) + ' pcs'; }
function fmtMoney(v, noSym) {
  const n = round2(v);
  const s = Math.abs(n).toLocaleString('en-PK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n < 0 ? '-' : '') + (noSym ? '' : 'Rs. ') + s;
}
function fmtMoneyShort(v) {
  const n = num(v);
  if (Math.abs(n) >= 10000000) return 'Rs. ' + (n / 10000000).toFixed(2) + ' Cr';
  if (Math.abs(n) >= 100000) return 'Rs. ' + (n / 100000).toFixed(2) + ' Lac';
  return fmtMoney(n);
}

/* ---------------- DATES ---------------- */
function todayISO() { return isoDay(new Date()); }
function isoDay(d) {
  const x = (d instanceof Date) ? d : new Date(d);
  if (isNaN(x)) return '';
  const m = String(x.getMonth() + 1).padStart(2, '0');
  const day = String(x.getDate()).padStart(2, '0');
  return x.getFullYear() + '-' + m + '-' + day;
}
function monthKey(d) { const s = (typeof d === 'string' ? d : isoDay(d)); return (s || '').slice(0, 7); }
function monthStart(ym) { return (ym || monthKey(todayISO())) + '-01'; }
function monthEnd(ym) {
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7);
  return isoDay(new Date(y, m, 0));
}
function monthLabel(ym) {
  const L = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  if (!ym) return '';
  return (L[+ym.slice(5, 7)] || '') + ' ' + ym.slice(0, 4);
}
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function fmtDate(iso) {
  if (!iso) return '—';
  const s = String(iso).slice(0, 10).split('-');
  if (s.length !== 3) return iso;
  return s[2] + '-' + (MONTH_NAMES[+s[1] - 1] || s[1]).slice(0, 3) + '-' + s[0];
}
function fmtDateLong(iso) {
  if (!iso) return '—';
  const s = String(iso).slice(0, 10).split('-');
  if (s.length !== 3) return iso;
  return (+s[2]) + ' ' + (MONTH_NAMES[+s[1] - 1] || s[1]) + ' ' + s[0];
}
function addDays(iso, n) {
  const d = new Date(String(iso).slice(0, 10) + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return isoDay(d);
}
function daysBetween(a, b) {
  const d1 = new Date(String(a).slice(0, 10) + 'T00:00:00');
  const d2 = new Date(String(b).slice(0, 10) + 'T00:00:00');
  return Math.round((d2 - d1) / 86400000);
}
function lastMonths(n) {
  const out = [], d = new Date();
  d.setDate(1);
  for (let i = 0; i < n; i++) { out.push(monthKey(isoDay(d))); d.setMonth(d.getMonth() - 1); }
  return out;
}

/* ---------------- STRINGS ---------------- */
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function initials(name) {
  return String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
}
function titleCase(s) { return String(s || '').replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.slice(1).toLowerCase()); }
function debounce(fn, ms) {
  let t; return function () { const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms || 250); };
}

/* Amount in words — Pakistani invoice style */
function amountInWords(amount) {
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  function two(n) { return n < 20 ? ones[n] : (tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : '')); }
  function three(n) { return (n >= 100 ? ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + two(n % 100) : '') : two(n)); }
  let n = Math.floor(Math.abs(num(amount)));
  const paisa = Math.round((Math.abs(num(amount)) - n) * 100);
  if (n === 0 && !paisa) return 'Rupees Zero Only';
  let out = '';
  const crore = Math.floor(n / 10000000); n %= 10000000;
  const lac = Math.floor(n / 100000); n %= 100000;
  const thou = Math.floor(n / 1000); n %= 1000;
  if (crore) out += three(crore) + ' Crore ';
  if (lac) out += three(lac) + ' Lac ';
  if (thou) out += three(thou) + ' Thousand ';
  if (n) out += three(n);
  out = out.trim();
  if (paisa) out += ' and ' + two(paisa) + ' Paisa';
  return 'Rupees ' + out + ' Only';
}

/* ---------------- TOAST ---------------- */
function toast(msg, type, ms) {
  let box = $('#toast-container');
  if (!box) { box = document.createElement('div'); box.id = 'toast-container'; document.body.appendChild(box); }
  const icons = { success: '✅', error: '⛔', warn: '⚠️', info: 'ℹ️' };
  const t = document.createElement('div');
  t.className = 'toast toast-' + (type || 'info');
  t.innerHTML = '<span class="t-ico">' + (icons[type] || icons.info) + '</span><span>' + esc(msg) + '</span>';
  box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, ms || 2800);
}

/* ---------------- MODAL ---------------- */
function openModal(opts) {
  const o = opts || {};
  let root = $('#modal-root');
  if (!root) { root = document.createElement('div'); root.id = 'modal-root'; document.body.appendChild(root); }
  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap';
  wrap.innerHTML = `
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal ${o.size ? 'modal-' + o.size : ''}">
      <div class="modal-head">
        <h3>${esc(o.title || '')}</h3>
        <button class="icon-btn" data-close="1" title="Close">✕</button>
      </div>
      <div class="modal-body">${o.body || ''}</div>
      ${o.footer === null ? '' : `<div class="modal-foot">${o.footer !== undefined ? o.footer : '<button class="btn btn-ghost" data-close="1">Close</button>'}</div>`}
    </div>`;
  root.appendChild(wrap);
  requestAnimationFrame(() => wrap.classList.add('show'));
  wrap.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(wrap); });
  if (o.onMount) o.onMount(wrap);
  return wrap;
}
function closeModal(w) {
  const wrap = w || $('#modal-root .modal-wrap:last-child');
  if (!wrap) return;
  wrap.classList.remove('show');
  setTimeout(() => wrap.remove(), 200);
}
function closeAllModals() { $$('#modal-root .modal-wrap').forEach(w => w.remove()); }
function confirmDialog(message, opts) {
  const o = opts || {};
  return new Promise(resolve => {
    const w = openModal({
      title: o.title || 'Confirm',
      size: 'sm',
      body: `<p style="margin:6px 0 0;line-height:1.6">${esc(message)}</p>`,
      footer: `<button class="btn btn-ghost" data-close="1">Cancel</button>
               <button class="btn ${o.danger ? 'btn-danger' : 'btn-primary'}" id="cfmYes">${esc(o.yes || 'Yes, continue')}</button>`
    });
    $('#cfmYes', w).onclick = () => { closeModal(w); resolve(true); };
    w.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => setTimeout(() => resolve(false), 10)));
  });
}

/* ---------------- PERIOD (Today / Month / Custom) ---------------- */
const Period = {
  range: 'month',          // today | month | custom | all
  month: monthKey(todayISO()),
  from: monthStart(monthKey(todayISO())),
  to: todayISO(),
  match(dateStr) {
    const d = String(dateStr || '').slice(0, 10);
    if (!d) return false;
    if (this.range === 'all') return true;
    if (this.range === 'today') return d === todayISO();
    if (this.range === 'custom') return d >= (this.from || '0000-01-01') && d <= (this.to || '9999-12-31');
    return d.slice(0, 7) === this.month;
  },
  label() {
    if (this.range === 'today') return 'Today (' + fmtDate(todayISO()) + ')';
    if (this.range === 'all') return 'All Time';
    if (this.range === 'custom') return fmtDate(this.from) + ' → ' + fmtDate(this.to);
    return monthLabel(this.month);
  },
  shortLabel() {
    if (this.range === 'today') return 'Today';
    if (this.range === 'all') return 'All Time';
    if (this.range === 'custom') return 'Custom';
    return monthLabel(this.month);
  },
  bar(idPrefix) {
    const p = idPrefix || 'period';
    const months = lastMonths(18);
    return `<div class="period-bar">
      <div class="seg">
        <button class="seg-btn ${this.range === 'today' ? 'on' : ''}" data-prange="today">📆 Today</button>
        <button class="seg-btn ${this.range === 'month' ? 'on' : ''}" data-prange="month">🗓️ This Month</button>
        <button class="seg-btn ${this.range === 'custom' ? 'on' : ''}" data-prange="custom">🎯 Custom Date</button>
        <button class="seg-btn ${this.range === 'all' ? 'on' : ''}" data-prange="all">♾️ All Time</button>
      </div>
      ${this.range === 'month' ? `<select class="inp inp-sm" data-pmonth>
          ${months.map(m => `<option value="${m}" ${this.month === m ? 'selected' : ''}>${monthLabel(m)}</option>`).join('')}
        </select>` : ''}
      ${this.range === 'custom' ? `<span class="pb-lbl">From</span>
          <input type="date" class="inp inp-sm" data-pfrom value="${this.from || ''}"/>
          <span class="pb-lbl">To</span>
          <input type="date" class="inp inp-sm" data-pto value="${this.to || ''}"/>` : ''}
      <span class="pb-lbl" style="margin-left:auto">${esc(this.label())}</span>
    </div>`;
  },
  bind(container, onChange) {
    const root = container || document;
    $$('[data-prange]', root).forEach(b => b.onclick = () => {
      this.range = b.dataset.prange;
      if (this.range === 'custom') {
        if (!this.from) this.from = monthStart(this.month);
        if (!this.to) this.to = todayISO();
      }
      onChange && onChange();
    });
    const ms = $('[data-pmonth]', root); if (ms) ms.onchange = e => { this.month = e.target.value; this.range = 'month'; onChange && onChange(); };
    const ff = $('[data-pfrom]', root); if (ff) ff.onchange = e => { this.from = e.target.value; this.range = 'custom'; onChange && onChange(); };
    const ft = $('[data-pto]', root); if (ft) ft.onchange = e => { this.to = e.target.value; this.range = 'custom'; onChange && onChange(); };
  }
};

/* ---------------- TABLE HELPERS ---------------- */
function sortRows(rows, keyFn, dir) {
  const d = dir === 'asc' ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const x = keyFn(a), y = keyFn(b);
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * d;
    return String(x).localeCompare(String(y)) * d;
  });
}
function emptyRow(colspan, msg, icon) {
  return `<tr><td colspan="${colspan}"><div class="empty"><div class="empty-ico">${icon || '📭'}</div><div>${esc(msg || 'No records found')}</div></div></td></tr>`;
}

/* ---------------- EXPORT / BACKUP ---------------- */
function downloadFile(filename, content, mime) {
  const blob = (content instanceof Blob) ? content : new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function toCSV(headers, rows) {
  const q = v => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"';
  return [headers.map(q).join(',')].concat(rows.map(r => r.map(q).join(','))).join('\r\n');
}
function exportCSV(filename, headers, rows) {
  downloadFile(filename, '\uFEFF' + toCSV(headers, rows), 'text/csv;charset=utf-8');
  toast('CSV exported: ' + filename, 'success');
}

  const s = (typeof DB !== 'undefined' && DB.settings) ? DB.settings() : {};

    paper: s.slipPaper || 'thermal80',
    logoOnSlip: s.slipLogo !== false,
    logoH: Math.max(20, Math.min(64, num(s.slipLogoHeight) || 40)),
    showPhone: s.slipPhone !== false,
    showAddress: s.slipAddress !== false
  };
}

/* Thermal par lambe titles chhote karein (paper bachta hai) */
function shortDocTitle(t, size) {
  const s = String(t || '');
  if (size !== 'thermal' && size !== 'thermal80' && size !== 'thermal58') return s;
  return s.replace('WASH RECEIVING SLIP (SALE SLIP)', 'SALE SLIP')
    .replace('WASH INVOICE (PER KG)', 'WASH BILL')
    .replace('CONSOLIDATED WASH INVOICE (PER KG)', 'WEEKLY WASH BILL')
    .replace('DELIVERY / GATE PASS', 'DELIVERY SLIP')
    .replace('ACCOUNT STATEMENT', 'STATEMENT');
}

/** Hidden iframe mein print document likhta hai aur print dialog kholta hai. */
function printHTML(title, bodyHtml, opts) {
  const o = opts || {};
  const prev = $('#print-frame');
  if (prev) prev.remove();
  const frame = document.createElement('iframe');
  frame.id = 'print-frame';
  frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(frame);
  const doc = frame.contentWindow.document;
  const baseHref = (function () {
    try { return new URL('.', location.href).href; } catch (e) { return ''; }
  })();
  doc.open();
  doc.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(title || 'Print') + '</title>' +
    (baseHref ? '<base href="' + esc(baseHref) + '"/>' : '') +
    printStyles(o.size, o.extraCss) + '</head><body>' + (o.wrap === false ? bodyHtml : '<div class="pr-page">' + bodyHtml + '</div>') +
    '<scr' + 'ipt>setTimeout(function(){try{window.focus();window.print();}catch(e){}},250);<\/scr' + 'ipt></body></html>');
  doc.close();
  return frame;
}

function absUrl(p) {
  const v = String(p || '');
  if (!v) return '';
  if (/^(data:|https?:|\/\/)/i.test(v)) return v;
  try { return new URL(v, location.href).href; } catch (e) { return v; }
}

/** A4 / invoice header (tables aur statements ke liye) */
function printHeader(settings, docKind, extraLeft) {
  const s = settings || {};
  const logo = absUrl(logoPath(false));
  return '<div class="pr-head">' +
    '<div class="pr-logo-block">' +
      '<img src="' + esc(logo) + '" alt="logo"/>' +
      (docKind ? '<div class="badge-pr">' + esc(docKind) + '</div>' : '') +
    '</div>' +
    '<div>' +
      '<div class="pr-shop">' + esc(s.shopName || 'Mr Laundry Factory') + '</div>' +
      '<div class="pr-sub">' + esc(s.tagline || '') +
        (s.phone ? '<br>Tel: ' + esc(s.phone) : '') +
        (s.address ? '<br>' + esc(s.address) : '') +
        (s.ntn ? '<br>NTN: ' + esc(s.ntn) : '') +
        (extraLeft || '') +
      '</div>' +
    '</div>' +
  '</div>';
}

/** Thermal slip / receipt / delivery slip ke liye compact header */
function printSlipHeader(settings, docKind) {
  const s = settings || {};
  const p = paperProfile();
  const logo = absUrl(logoPath(true));
  return '<div class="pr-head">' +
    (p.logoOnSlip
      ? '<div class="pr-logo-block"><img src="' + esc(logo) + '" alt="logo" style="max-height:' + p.logoH + 'px"/></div>'
      : '') +
    '<div>' +
      '<div class="pr-shop">' + esc(s.shopName || 'Mr Laundry Factory') + '</div>' +
      (s.tagline ? '<div class="pr-sub">' + esc(s.tagline) + '</div>' : '') +
      (p.showPhone && s.phone ? '<div class="pr-sub">Tel: ' + esc(s.phone) + '</div>' : '') +
      (p.showAddress && s.address ? '<div class="pr-sub">' + esc(s.address) + '</div>' : '') +
      (docKind ? '<div style="margin-top:1mm"><span class="badge-pr">' + esc(docKind) + '</span></div>' : '') +
    '</div>' +
  '</div>';
}

/** Slip/receipt/delivery ke liye kaun sa paper profile use karna hai */
function printSizeFor(kind, fallback) {

    const p = paperProfile();
    return p.paper || fallback || 'thermal80';

/* ============================================================
   PER KG RATE — quick edit form (Products / New Sales / Dashboard
   / Settings — sab jagah se yahi form khulta hai)
   ============================================================ */
function openRateForm(opts) {
  const s = DB.settings();
  const cur = num(s.ratePerKg);
  const quick = [100, 120, 150, 175, 200, 225, 250, 300, 350, 400];

  const body = `
    <div class="note-box info tiny mb10">
      Yeh rate <b>sab categories (A / B / C)</b> aur sab customers par lagta hai.
      Naye entries isi rate se banenge — <b>purane bill apne purane rate par hi rahenge</b>.
    </div>
    <label class="fld"><span>Rate per KG (Rs) <b class="req">*</b></span>
      <input type="number" step="1" min="1" class="inp" id="rtRate" value="${cur}" style="font-size:22px;font-weight:850;text-align:center"/>
    </label>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:-4px">
      ${quick.map(v => `<button class="btn btn-ghost btn-xs" data-rq="${v}">Rs. ${v}</button>`).join('')}
    </div>
    <div class="grid g2 mt14" style="gap:10px">
      <div class="note-box tiny"><b>Abhi ka rate</b><div class="big">${fmtMoney(cur)} / KG</div></div>
      <div class="note-box ok tiny"><b>Naya rate</b><div class="big" id="rtNew">${fmtMoney(cur)} / KG</div>
        <span class="tiny" id="rtEg">100 KG = ${fmtMoney(round2(cur * 100))}</span></div>
    </div>`;

  const w = openModal({
    title: '⚖️ Per KG Rate Edit', size: 'sm', body,
    footer: `<button class="btn btn-ghost" data-close="1">Cancel</button>
             <button class="btn btn-primary" id="rtSave">💾 Save Rate</button>`
  });

  const inp = $('#rtRate', w);
  if (!inp) return w;   // safety: kuch ghalat ho to crash na ho
  const upd = () => {
    const v = num(inp.value);
    $('#rtNew', w).textContent = fmtMoney(v) + ' / KG';
    $('#rtEg', w).textContent = '100 KG = ' + fmtMoney(round2(v * 100)) + ' · 240 KG = ' + fmtMoney(round2(v * 240));
  };
  inp.oninput = upd;
  $$('[data-rq]', w).forEach(b => b.onclick = () => { inp.value = b.dataset.rq; upd(); });
  setTimeout(() => { inp.focus(); inp.select(); }, 120);

  $('#rtSave', w).onclick = () => {
    const v = num(inp.value);
    if (v <= 0) return toast('Rate 0 se bara likhein', 'error');
    DB.saveSettings({ ratePerKg: v });
    DB.audit('settings', 'Per KG rate change: ' + fmtMoney(cur) + ' to ' + fmtMoney(v));
    toast('Rate update ho gaya - ab naye entries ' + fmtMoney(v) + ' / KG par banenge', 'success', 4200);
    closeModal(w);
    refreshCurrent();
  };
  return w;
}

</script>

<script>
/* ============================================================
   MR LAUNDRY FACTORY PORTAL — DATA LAYER
   ------------------------------------------------------------
   Storage  : localStorage (offline-first, always works)
   Cloud    : optional Firebase Realtime Database sync (Settings
              mein apna config paste karein → "Cloud Sync ON")
   ------------------------------------------------------------
   Tables:
     users[]       staff logins + permissions
     branches[]    factory / shop / unit branches
     customers[]   B2B clients (vendors) jin ko per-kg wash dete hain
     products[]    wash items (Wash & Fold, Iron, Dry Clean...) — category wise
     sales[]       wash slips  { invoiceNo, branchId, customerId, entryDate,
                                 deliveryDate(null until delivered), status,
                                 lines:[{productId, category, qtyKg, pcs, note}],
                                 kgTotal, piecesTotal, rate, amount, paymentMode,
                                 amountPaidAtEntry }
     payments[]    ledger payments { customerId, date, amount, kgCovered,
                                     allocated:[{saleId, amount}], saleItems[], note }
     expenses[]    factory expenses
     purchases[]   items bought from outside vendors
     vendors[]     vendors (jin se purchase karte hain)
     employees[]   factory staff + monthly salary
     salaries[]    salary payments
     drawings[]    owner drawings / nikaal
     settings{}    shop profile, rate per kg, category labels, cloud config
     auditLog[]    har action ka record
   ============================================================ */

const DB_KEY = 'mlfFactoryDB';
const SESSION_KEY = 'mlfSession';

const SHOP_DEFAULTS = {
  shopName: 'Mr Laundry Factory',
  tagline: 'Wash · Dry · Iron · Fold (Per KG Basis)',

const DB = {
  _data: null,

  /* ---------------- LOAD / SAVE ---------------- */

    let raw = null;

    if (raw) {
      try { this._data = JSON.parse(raw); } catch (e) { this._data = null; }
    }
    if (!this._data) this._data = this._seed();
    this._migrate();
    this.save();
    return this._data;
  },

  _seed() {
    const now = new Date().toISOString();
    return {
      users: [
        { id: 'u_owner', name: 'Owner', username: 'owner', password: 'owner123', role: 'owner', active: true, createdAt: now },

        { id: 'u_cashier', name: 'Cashier', username: 'cashier', password: 'cashier123', role: 'cashier', active: true, permissions: ['dashboard', 'newsales', 'sales', 'customers', 'ledger'], createdAt: now }
      ],
      branches: [
        { id: 'b_factory', name: 'Main Factory', type: 'factory', phone: '', address: '', color: '#4f7cff', isActive: true, createdAt: now }

  _migrate() {
    const d = this._data;
    const seed = this._seed();
    const tables = ['users', 'branches', 'customers', 'products', 'sales', 'payments',
      'expenses', 'purchases', 'vendors', 'vendorRequests', 'employees', 'salaries', 'drawings',
      'deliveries', 'auditLog'];
    tables.forEach(t => { if (!Array.isArray(d[t])) d[t] = seed[t]; });
    d.settings = Object.assign({}, seed.settings, d.settings || {});
    /* ⚠️ Cloud config (URL / Shop ID / ON-OFF) DEVICE-LEVEL hai — synced
       data se kabhi overwrite na ho (yehi "firebase remove ho gaya" ka fix hai) */
    if (typeof Cloud !== 'undefined' && Cloud.cfg && Cloud.cfg.url) {
      d.settings.cloudEnabled = !!Cloud.cfg.enabled;
      d.settings.firebaseConfig = Cloud.cfg.url;
      d.settings.shopId = Cloud.cfg.shopId;
    }
    // Sirf khali/undefined fields ko default se bharein — user ki edited
    // values (shop name, phone, address) kabhi overwrite na hon.
    Object.keys(SHOP_DEFAULTS).forEach(k => {
      if (d.settings[k] === undefined || d.settings[k] === null || d.settings[k] === '') {
        d.settings[k] = seed.settings[k] || SHOP_DEFAULTS[k];
      }
    });
    if (!Array.isArray(d.settings.categories) || !d.settings.categories.length) d.settings.categories = DEFAULT_CATEGORIES;
    if (!d._counters) d._counters = { invoice: 1000 };
    if (d._counters.invoice == null) d._counters.invoice = 1000;
    // ensure built-in users still exist (passwords editable in Users page)
    (seed.users || []).forEach(su => {
      const exists = d.users.some(u => u && (u.id === su.id || (u.username || '').toLowerCase() === su.username));
      if (!exists) d.users.push(Object.assign({}, su));
    });
    if (!d.branches.length) d.branches = seed.branches;
    // counters repair — invoice number never goes backwards
    const maxInv = (d.sales || []).reduce((m, s) => Math.max(m, num(String(s.invoiceNo || '').replace(/\D/g, ''))), 0);
    if (maxInv >= d._counters.invoice) d._counters.invoice = maxInv;
  },

  save() {
    try {
      this._data._updatedAt = new Date().toISOString();
      SafeStore.set(DB_KEY, JSON.stringify(this._data));
      if (typeof Cloud !== 'undefined' && Cloud.push) Cloud.pushDebounced();
      return true;
    } catch (e) {
      toast('Storage full — Settings se backup lekar purana data clear karein.', 'error', 6000);
      return false;
    }
  },

  /* ---------------- GENERIC TABLE API ---------------- */
  all(tbl, includeDeleted) {
    const rows = (this._data[tbl] || []);
    return includeDeleted ? rows.slice() : rows.filter(r => r && !r._deleted);
  },
  get(tbl, id) { return (this._data[tbl] || []).find(r => r && r.id === id) || null; },
  upsert(tbl, row, opts) {
    const o = opts || {};
    row.updatedAt = new Date().toISOString();
    const arr = this._data[tbl] = this._data[tbl] || [];
    const i = arr.findIndex(r => r && r.id === row.id);
    if (i >= 0) arr[i] = Object.assign({}, arr[i], row);
    else { row.createdAt = row.createdAt || row.updatedAt; arr.push(row); }
    if (!o.silent) this.save();
    return row;
  },
  remove(tbl, id, hard) {
    const arr = this._data[tbl] || [];
    const i = arr.findIndex(r => r && r.id === id);
    if (i < 0) return false;
    if (hard) arr.splice(i, 1);
    else { arr[i]._deleted = true; arr[i].deletedAt = new Date().toISOString(); }
    this.save();
    return true;
  },
  settings() { return this._data.settings; },
  /** cloud config ka mirror (sirf is device par; cloud par push NAHI hota) */
  setCloudMirror(c) {
    if (!this._data) return;
    const s = this._data.settings = this._data.settings || {};
    s.cloudEnabled = !!(c && c.enabled);
    s.firebaseConfig = (c && c.url) || '';
    s.shopId = (c && c.shopId) || '';
    try { SafeStore.set(DB_KEY, JSON.stringify(this._data)); } catch (e) {}
  },
  saveSettings(patch) {
    this._data.settings = Object.assign({}, this._data.settings, patch || {});
    this.save();
    return this._data.settings;
  },
  nextNumber(kind) {
    this._data._counters = this._data._counters || {};
    const c = this._data._counters;
    const prefixMap = { invoice: 'INV', slip: 'SLP', payment: 'RCP', expense: 'EXP', purchase: 'PUR', salary: 'SAL', drawing: 'DRW', customer: 'CUS', vendor: 'VEN', employee: 'EMP', branch: 'BR' };
    c[kind] = num(c[kind]) + 1;
    if (kind === 'invoice') c[kind] = Math.max(c[kind], num(c.invoice));
    const pre = prefixMap[kind] || String(kind).toUpperCase().slice(0, 3);
    return pre + '-' + String(c[kind]).padStart(4, '0');
  },
  countersPreview(kind) {
    const c = (this._data._counters || {})[kind] || 0;
    const prefixMap = { invoice: 'INV', slip: 'SLP', payment: 'RCP' };
    return (prefixMap[kind] || 'GEN') + '-' + String(num(c) + 1).padStart(4, '0');
  },

  /* ---------------- AUTH ---------------- */
  findByUsername(u) {
    const k = String(u || '').trim().toLowerCase();
    return this.all('users').find(x => String(x.username || '').toLowerCase() === k) || null;
  },
  login(username, password) {
    const u = this.findByUsername(username);
    if (!u) return { ok: false, msg: 'User nahi mila' };
    if (u.password !== password) return { ok: false, msg: 'Password ghalat hai' };
    if (u.active === false) return { ok: false, msg: 'Yeh account band hai' };
    SafeStore.set(SESSION_KEY, JSON.stringify({ id: u.id, at: new Date().toISOString() }));
    this.audit('login', u.name + ' login hua');
    return { ok: true, user: u };
  },
  logout() { const u = this.currentUser(); if (u) this.audit('logout', u.name + ' logout hua'); SafeStore.del(SESSION_KEY); },
  currentUser() {
    try {
      const s = JSON.parse(SafeStore.get(SESSION_KEY) || 'null');
      if (!s) return null;
      const u = this.get('users', s.id);
      return (u && u.active !== false) ? u : null;
    } catch (e) { return null; }
  },
  isOwner(u) { u = u || this.currentUser(); return !!u && (u.role === 'owner' || u.role === 'admin'); },
  can(page) {
    const u = this.currentUser();
    if (!u) return false;
    if (this.isOwner(u)) return true;
    const perms = Array.isArray(u.permissions) ? u.permissions : [];
    return perms.indexOf(page) >= 0;
  },

  /* ---------------- AUDIT ---------------- */
  audit(action, detail, extra) {
    const u = this.currentUser();
    this._data.auditLog = this._data.auditLog || [];

  },
  restoreJSON(text) {

  },

    this._data = this._seed();
    this.save();

<script>
/* ============================================================
   CLOUD SYNC — Firebase Realtime Database (REST) — v2 (PAKKA)
   ------------------------------------------------------------
   ⚠️ PURANA MASLA (fix ho gaya):
      Database URL / Shop ID pehle BUSINESS DATA ke andar
      (settings.firebaseConfig) save hote the — jo cloud se sync
      hota hai. Is liye jab kisi doosre system se data pull hota
      tha to us ke khali config ne aap ka config mita diya →
      "Firebase baar baar remove ho jata hai".

   ✅ AB KA TAREeqA:
      • URL + Shop ID + ON/OFF sirf IS DEVICE par save hote hain
        (localStorage key: mlfCloudCfg) — cloud par nahi jate.
      • Cloud par sirf business data jata hai (sales, customers…).
      • Pull ke baad config wapis apne aap lag jati hai (kabhi
        delete nahi hoti).
      • Naye system par portal kholte hi data khud aa jata hai —
        default URL + auto shop-detect ki madad se.
      • Push sirf pehla pull hone ke BAAD hota hai, taake naye
        device ka khali/demo data cloud ka asli data na mita de.
   ============================================================ */

const CLOUD_CFG_KEY = 'mlfCloudCfg';
const CLOUD_DEFAULT_URL = 'https://mrlaundryfactory-default-rtdb.firebaseio.com';
const CLOUD_DEFAULT_SHOP = 'main';
const CLOUD_POLL_MS = 25000;                       // har 25 sec check
const CLOUD_DEVICE_KEYS = ['cloudEnabled', 'firebaseConfig', 'shopId'];   // device-level → cloud par kabhi nahi

const Cloud = {
  /* is device ka config (cloud par nahi jata) */
  cfg: { url: '', shopId: CLOUD_DEFAULT_SHOP, enabled: true },

  /* runtime */
  enabled: false, url: '', shopId: '', ready: false,
  _pushTimer: null, _pollTimer: null,
  _applying: false, _busy: false,
  _lastPushedAt: '', _lastPulledAt: '', _lastError: '', _lastErrorAt: '',
  _pendingPush: false, _didInitialPull: false, _pulling: null, _bound: false, _forceNextPush: false,
  _shops: [],

  /* ============================================================
     CONFIG — is device par mehfooz (cloud par NAHI)
     ============================================================ */
  parseConfig(text) {
    const t = String(text || '').trim();
    if (!t) return null;
    if (/^https?:\/\//i.test(t)) return { url: t.replace(/\/+$/, '') };
    try {
      const j = JSON.parse(t);
      const u = j.databaseURL || j.databaseUrl || j.url;
      if (u) return { url: String(u).replace(/\/+$/, '') };
    } catch (e) { /* ignore */ }
    const m = t.match(/databaseURL\s*:\s*["']([^"']+)["']/i);
    if (m) return { url: m[1].replace(/\/+$/, '') };
    return null;
  },

  /** config load — alag key se; pehli dafa purane (settings wale) config ko migrate karta hai */
  loadCfg() {
    let c = null;
    try { c = JSON.parse(SafeStore.get(CLOUD_CFG_KEY) || 'null'); } catch (e) { c = null; }
    const s = (DB.settings && DB.settings()) || {};
    const legacy = this.parseConfig(s.firebaseConfig);
    if (!c || typeof c !== 'object') c = {};
    if (!c.url) c.url = (legacy && legacy.url) || CLOUD_DEFAULT_URL;
    if (!c.shopId) c.shopId = String(s.shopId || '').trim() || CLOUD_DEFAULT_SHOP;
    if (c.enabled === undefined || c.enabled === null) c.enabled = (s.cloudEnabled === undefined ? true : !!s.cloudEnabled);
    this.setCfg(c, { quiet: true });
    return this.cfg;
  },

  /** config save (hamesha is device par; mirror sirf UI ke liye) */
  setCfg(patch, opts) {
    const o = opts || {};
    const merged = Object.assign({}, this.cfg, patch || {});
    const parsed = this.parseConfig(merged.url);
    this.cfg = {
      url: parsed ? parsed.url : '',
      shopId: String(merged.shopId || CLOUD_DEFAULT_SHOP).replace(/[^a-zA-Z0-9_-]/g, '') || CLOUD_DEFAULT_SHOP,
      enabled: !!merged.enabled,
      savedAt: new Date().toISOString()
    };
    SafeStore.set(CLOUD_CFG_KEY, JSON.stringify(this.cfg));
    if (DB.setCloudMirror) DB.setCloudMirror(this.cfg);   // settings mein sirf dikhane ke liye
    if (!o.quiet) this.refresh();
    return this.cfg;
  },

  cfgSaved() { return !!(this.cfg && this.cfg.url); },

  /* URL se config: index.html?cloud=<db-url>&shop=<shop-id>
     Isse naye system par sirf link kholna kaafi hota hai — data khud sync ho jata hai. */
  applyUrlCfg() {
    try {
      const qp = new URLSearchParams(location.search || '');
      const qUrl = qp.get('cloud') || qp.get('firebase') || qp.get('db');
      const qShop = qp.get('shop') || qp.get('shopId');
      if (qUrl) this.setCfg({ url: qUrl, shopId: qShop || this.cfg.shopId, enabled: true }, { quiet: true });
      else if (qShop) this.setCfg({ shopId: qShop }, { quiet: true });
    } catch (e) { /* ignore */ }
  },

  /* ============================================================
     INIT / STARTUP
     ============================================================ */
  refresh() {
    this.enabled = !!this.cfg.enabled;
    this.url = this.cfg.url;
    this.shopId = this.cfg.shopId;
    this.ready = !!(this.enabled && this.url);
    this.updateDot();
    if (this.ready) { this.startPolling(); this.bindAutoSync(); }
    else this.stopPolling();
    return this.ready;
  },

  /** boot par — config load + pehla sync (promise return karta hai) */
  init() {
    this.loadCfg();
    this.applyUrlCfg();     // ?cloud=URL&shop=ID — ek link se naya device set ho jata hai
    this.refresh();
    if (!this.ready) { this._didInitialPull = true; return null; }
    if (!this._pulling) {
      this._pulling = this.firstSync().catch(e => { this._lastError = e.message; this.updateDot(); });
    }
    return this._pulling;
  },

  async firstSync() {
    await this.autoPickShop();                 // galat shop id ho to sahi wali khud pakar le.
    await this.pull({ silent: true, startup: true });
    this._didInitialPull = true;
    if (this._pendingPush && !this.localIsEmpty()) { this._pendingPush = false; await this.push(true); }
    this.startPolling();
    this.updateDot();
    return true;
  },

  /** database mein jitne shop ids (datasets) hain */
  async listShops() {
    if (!this.url) return [];
    try {
      const o = await this._fetchJSON(this.url + '/factories.json?shallow=true');
      this._shops = o ? Object.keys(o) : [];
    } catch (e) { this._shops = []; }
    return this._shops;
  },

  /** naya system: agar default shop khali hai aur sirf ek hi shop mein data hai → wohi le lein */
  async autoPickShop() {
    try {
      const shops = await this.listShops();
      if (!shops.length) return null;
      if (shops.indexOf(this.shopId) >= 0) return this.shopId;
      if (shops.length === 1) {
        const pick = shops[0];
        this.setCfg({ shopId: pick }, { quiet: true });
        this.refresh();
        if (!SafeStore.get('mlfShopAutoPickShown')) {
          SafeStore.set('mlfShopAutoPickShown', pick);
          toast('Cloud par data "' + pick + '" ke andar mila — usi se sync ho raha hai', 'info', 5000);
        }
        return pick;
      }
      return null;   // ek se ziyada → Settings → Cloud Sync se choose karein
    } catch (e) { return null; }
  },

  /** login hone par foran sync */
  onLogin() { if (this.ready) this.pull({ silent: true }); },

  /** window focus / online hone par sync */
  bindAutoSync() {
    if (this._bound) return;
    this._bound = true;
    const kick = () => { if (this.ready && !document.hidden) this.tick(); };
    window.addEventListener('focus', kick);
    window.addEventListener('online', () => { kick(); if (this._pendingPush) this.push(true); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });
  },

  /* ============================================================
     NETWORK HELPERS
     ============================================================ */
  path(suffix) { return this.url + '/factories/' + (this.shopId || 'main') + '/' + suffix + '.json'; },

  async _fetchJSON(url, opts) {
    const r = await fetch(url, Object.assign({ cache: 'no-store' }, opts || {}));
    if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 401 || r.status === 403 ? ' (rules / permission)' : ''));
    const txt = await r.text();
    if (!txt || txt === 'null') return null;
    try { return JSON.parse(txt); } catch (e) { return null; }
  },

  /* ============================================================
     PUSH — is device ka data cloud par
     ============================================================ */
  pushDebounced() {
    if (!this.ready || this._applying) return;
    clearTimeout(this._pushTimer);
    this._pushTimer = setTimeout(() => this.push(true), 1500);
  },

  async push(silent) {
    if (!this.ready || this._busy) return false;
    if (!this._didInitialPull) { this._pendingPush = true; return false; }
    /* SAFETY: khali naya device apna khali data cloud par na bheje (cloud ka asli data bach jaye) */
    if (this.localIsEmpty() && !this._forceNextPush) { this._pendingPush = false; this.updateDot(); return false; }
    this._forceNextPush = false;   // pehle pull — naye device ka khali data cloud na mita de
    this._busy = true;
    const stamp = new Date().toISOString();
    try {
      const payload = JSON.parse(JSON.stringify(DB._data));
      /* device-level config hamesha strip: cloud par sirf business data */
      payload.settings = payload.settings || {};
      CLOUD_DEVICE_KEYS.forEach(k => { delete payload.settings[k]; });
      payload._updatedAt = stamp;
      payload._updatedBy = (DB.currentUser() || {}).name || 'device';
      await this._fetchJSON(this.path('data'), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      await this._fetchJSON(this.path('meta'), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ updatedAt: stamp, by: payload._updatedBy, app: 'Mr Laundry Factory Portal' })
      });
      this._lastPushedAt = stamp;
      this._lastError = '';
      this._pendingPush = false;
      DB._data._updatedAt = stamp;
      SafeStore.set('mlfLastCloudPush', stamp);
      if (!silent) toast('Cloud par save ho gaya ✔', 'success');
      return true;
    } catch (e) {
      this._lastError = e.message; this._lastErrorAt = new Date().toISOString();
      this._pendingPush = true;                                   // offline → auto retry
      if (!silent) toast('Cloud push fail: ' + e.message + ' — internet / Firebase rules check karein', 'error', 6000);
      return false;
    } finally {
      this._busy = false;
      this.updateDot();
    }
  },

  /* ============================================================
     PULL — cloud se data (config kabhi overwrite nahi hoti)
     ============================================================ */
  localIsEmpty() {
    const d = DB._data || {};
    const n = ['sales', 'payments', 'expenses', 'purchases', 'employees', 'salaries', 'drawings', 'deliveries']
      .reduce((a, t) => a + ((d[t] || []).length), 0);
    return n === 0 && (d.customers || []).length === 0;
  },

  applyRemote(remote) {
    this._applying = true;
    const keepCfg = Object.assign({}, this.cfg);        // ⚠️ config mehfooz
    const keepUser = DB.currentUser();
    remote.settings = Object.assign({}, remote.settings || {});
    DB._data = remote;
    DB._migrate();                                     // tables/defaults
    DB.setCloudMirror(keepCfg);                        // config wapis
    if (keepUser) {                                    // login session barqarar
      const still = (DB._data.users || []).find(u => u && u.id === keepUser.id);
      if (!still) DB._data.users.push(keepUser);
    }
    DB.save();                                         // (_applying = true → push nahi hoga)
    this._applying = false;
    this._lastPulledAt = new Date().toISOString();
    this._lastError = '';
    this._pendingPush = false;
    SafeStore.set('mlfLastCloudPull', this._lastPulledAt);
  },

  async pull(opts) {
    const o = opts || {};
    if (!this.ready) { if (!o.silent) toast('Pehle Cloud Sync ON karein (Settings → Cloud Sync)', 'warn'); return false; }
    if (this._busy) return false;
    this._busy = true;
    this.updateDot();
    try {
      const remote = await this._fetchJSON(this.path('data'));
      this._busy = false;
      if (!remote) {
        this._lastError = ''; this.updateDot();
        if (!o.silent) toast('Cloud khali hai — "Cloud par bhejein" dabayein taake yeh data upload ho jaye', 'info', 5000);
        return false;
      }
      const rTime = Date.parse(remote._updatedAt || 0) || 0;
      const lTime = Date.parse(DB._data._updatedAt || 0) || 0;
      const fresh = this.localIsEmpty();
      if (!fresh && rTime <= lTime && !o.force) {
        this._lastError = ''; this.updateDot();
        if (!o.silent) toast('Is device ka data already latest hai ✔', 'success');
        return false;
      }
      if (o.ask) {
        const yes = await confirmDialog(
          'Cloud par data hai (' + new Date(rTime || Date.now()).toLocaleString() + ').\nCloud ka data le lein? Is device ke local changes overwrite ho jayenge.',
          { title: 'Cloud se data laayein', yes: 'Haan, cloud ka data le lo' });
        if (!yes) { this.updateDot(); return false; }
      }
      this.applyRemote(remote);
      toast('Cloud se data sync ho gaya ✔ (' + fmtKg(Biz.sales().length ? Biz.sales().length : 0) + ' bills)', 'success', 3000);
      if (DB.currentUser()) app.go(app.current || 'dashboard');
      this.updateDot();
      return true;
    } catch (e) {
      this._busy = false;
      this._lastError = e.message; this._lastErrorAt = new Date().toISOString();
      this.updateDot();
      if (!o.silent) toast('Cloud pull fail: ' + e.message + ' — Firebase rules check karein', 'error', 6000);
      return false;
    }
  },

  /* ============================================================
     POLLING + retry
     ============================================================ */
  startPolling() {
    if (this._pollTimer) return;
    this._pollTimer = setInterval(() => this.tick(), CLOUD_POLL_MS);
  },
  stopPolling() { clearInterval(this._pollTimer); this._pollTimer = null; },

  async tick() {
    if (!this.ready || this._busy || document.hidden) return;
    if (this._pendingPush) { await this.push(true); return; }      // offline changes bhej dein
    try {
      const meta = await this._fetchJSON(this.path('meta'));
      const rTime = meta && meta.updatedAt ? (Date.parse(meta.updatedAt) || 0) : 0;
      const lTime = Date.parse(DB._data._updatedAt || 0) || 0;
      if (!meta) { await this.pull({ silent: true }); return; }
      if (rTime > lTime + 4000) {
        toast('Doosre device se naya data aaya — sync ho raha hai…', 'info');
        await this.pull({ silent: true });
      } else if (this._lastError) { this._lastError = ''; this.updateDot(); }
    } catch (e) {
      this._lastError = e.message; this.updateDot();
    }
  },

  /* ============================================================
     TEST / ENABLE / MANUAL
     ============================================================ */
  async test() {
    if (!this.cfg.url) { toast('databaseURL khali hai', 'error'); return false; }
    this.refresh();
    try {
      await this._fetchJSON(this.path('meta'), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ping: new Date().toISOString(), by: 'setup-test' })
      });
      this._lastError = '';
      const shops = await this.listShops();
      toast('Connection OK ✔ Firebase chal rahi hai' + (shops.length ? ' · Shops: ' + shops.join(', ') : ''), 'success', 5000);
      this.updateDot();
      return true;
    } catch (e) {
      this._lastError = e.message; this._lastErrorAt = new Date().toISOString();
      toast('Connect nahi hua: ' + e.message + ' — URL ya Firebase rules check karein', 'error', 7000);
      this.updateDot();
      return false;
    }
  },

  /** Settings → Save & Connect */
  async saveAndConnect(url, shopId, enabled) {
    this.setCfg({ url: url, shopId: shopId, enabled: enabled !== false });
    this.refresh();
    if (!this.ready) { toast('Config save ho gaya (cloud OFF)', 'warn'); return false; }
    const ok = await this.test();
    if (ok) { this._didInitialPull = true; await this.pull({ silent: true, startup: true }); }
    return ok;
  },

  setEnabled(on) {
    this.setCfg({ enabled: !!on });
    this.refresh();
    if (on) { this._didInitialPull = true; this.pull({ silent: true }); this.push(true); }
    toast(on ? 'Cloud Sync ON ✔ (config is device par mehfooz hai)' : 'Cloud Sync OFF — ab sirf local storage', on ? 'success' : 'warn');
  },

  async forcePush() { this._didInitialPull = true; this._forceNextPush = true; return this.push(false); },
  async forcePull() { return this.pull({ ask: true, force: true }); },

  /* ============================================================
     STATUS
     ============================================================ */
  statusShort() {
    if (!this.cfg.enabled) return 'OFF';
    if (!this.cfg.url) return 'no URL';
    if (this._busy) return 'syncing…';
    if (this._lastError) return 'error';
    if (this._pendingPush) return 'pending…';
    const last = this._lastPulledAt || this._lastPushedAt;
    return last ? 'ON · ' + new Date(last).toLocaleTimeString() : 'ON';
  },

  statusLabel() {
    if (!this.cfg.enabled) return 'Cloud sync: OFF (data sirf is device par)';
    if (!this.cfg.url) return 'Cloud sync: ON — lekin databaseURL khali ⚠️';
    if (this._busy) return 'Cloud: sync ho raha hai…';
    if (this._lastError) return 'Cloud: ERROR — ' + this._lastError;
    if (this._lastPulledAt || this._lastPushedAt) {
      return 'Cloud: ' + this.shopId + ' · last sync ' + new Date(this._lastPulledAt || this._lastPushedAt).toLocaleTimeString();
    }
    return 'Cloud: ' + this.shopId + ' · connected';
  },

  dotColor() {
    if (!this.cfg.enabled || !this.cfg.url) return '#94a3b8';
    if (this._lastError) return '#dc2626';
    if (this._busy || this._pendingPush) return '#f59e0b';
    return '#16a34a';
  },

  updateDot() {
    const d = document.getElementById('cloudDot');
    if (d) { d.textContent = this.statusLabel(); d.style.color = this.dotColor(); }
    const chip = document.getElementById('cloudChip');
    if (chip) {
      chip.textContent = '☁️ ' + this.statusShort();
      chip.style.color = this.dotColor();
      chip.title = this.statusLabel() + ' — click: abhi sync karein';
    }
  },

  async syncNow() {
    if (!this.ready) { toast('Cloud ON nahi hai — Settings → Cloud Sync', 'warn'); return; }
    toast('Sync ho raha hai…', 'info', 1500);
    await this.pull({ silent: true });
    if (this._pendingPush) await this.push(true);
    this.updateDot();
  }
};

</script>
