<script>
/* ============================================================
   OWNER DRAWINGS — owner ka nikaal (personal use)
   Yeh expense nahi hai, isliye profit par asar nahi karta —
   sirf cash nikalne ka record hai.
   ============================================================ */

function renderDrawings() {
  UI.renderLayout('drawings', `<div id="drwBody"></div>`);
  drawingsPaint();
}

function drawingsPaint() {
  const el = $('#drwBody');
  if (!el) return;
  const rows = Biz.drawingsIn(Period).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const total = round2(rows.reduce((a, d) => a + num(d.amount), 0));
  const mk = monthKey(todayISO());
  const monthTotal = round2(DB.all('drawings').filter(d => monthKey(d.date) === mk).reduce((a, d) => a + num(d.amount), 0));
  const allTotal = round2(DB.all('drawings').reduce((a, d) => a + num(d.amount), 0));
  const m = Biz.metrics(Period);
  const byReason = {};
  rows.forEach(d => { byReason[d.reason || 'Other'] = round2((byReason[d.reason || 'Other'] || 0) + num(d.amount)); });

  el.innerHTML = `
    ${Period.bar()}
    <div class="stats">
      ${UI.statCard({ icon: '🏧', label: 'Drawings — ' + Period.shortLabel(), value: fmtMoney(total), foot: rows.length + ' entries', tone: 'bad' })}
      ${UI.statCard({ icon: '📅', label: 'Is mahine', value: fmtMoney(monthTotal), tone: 'warn' })}
      ${UI.statCard({ icon: '💰', label: 'Total (all time)', value: fmtMoney(allTotal), tone: 'purple' })}
      ${UI.statCard({ icon: '📈', label: 'Profit — ' + Period.shortLabel(), value: fmtMoney(m.profit),
    foot: 'Drawings profit se kam nahi hoti', tone: m.profit >= 0 ? 'good' : 'bad' })}
    </div>

    <div class="grid g-2-1">
      <div class="card">
        <div class="card-head"><h3>🏧 Owner Drawings</h3><div class="sp"></div>
          <button class="btn btn-ghost btn-sm" id="drExport">⬇️ CSV</button>
          <button class="btn btn-primary btn-sm" id="drNew">➕ New Drawing</button></div>
        <div class="tbl-wrap">
          <table class="tbl" style="min-width:720px">
            <thead><tr><th>Date</th><th>Voucher</th><th>Reason / Kis liye</th><th>Method</th><th>Note</th>
              <th class="t-right">Amount</th><th class="t-center">Actions</th></tr></thead>
            <tbody>${rows.length ? rows.map(d => `<tr>
              <td class="t-nowrap">${fmtDate(d.date)}</td>
              <td class="tiny">${esc(d.no || '')}</td>
              <td><span class="tag">${esc(d.reason || 'Other')}</span></td>
              <td class="tiny">${esc(d.method || 'Cash')}</td>
              <td class="tiny">${esc(d.note || '')}</td>
              <td class="t-right t-bad"><b>${fmtMoney(d.amount)}</b></td>
              <td class="t-center t-nowrap">
                <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-dedit="${d.id}">✏️</button>
                <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-ddel="${d.id}">🗑️</button></td>
            </tr>`).join('') : emptyRow(7, 'Is period mein koi drawing nahi', '💤')}</tbody>
            ${rows.length ? `<tfoot><tr><td colspan="5">TOTAL</td><td class="t-right">${fmtMoney(total)}</td><td></td></tr></tfoot>` : ''}
          </table>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="card-head"><h3>📊 Reason-wise</h3></div>
          <div class="card-body">${Object.keys(byReason).length ? UI.progressRows(Object.keys(byReason).sort((a, b) => byReason[b] - byReason[a]).map(r => ({
    label: r, value: byReason[r], color: '#7c5cff', note: fmtMoney(byReason[r])
  }))) : '<div class="empty"><div class="empty-ico">🏧</div><div>Koi data nahi</div></div>'}</div>
        </div>
        <div class="card"><div class="card-body">
          <div class="note-box warn tiny">
            <b>Note:</b> Owner drawings ko <b>expense nahi</b> gina jata — yeh malik ka apna paisa nikalna hai.
            Profit/loss report mein sirf business expenses count hote hain.
          </div>
        </div></div>
      </div>
    </div>`;

  Period.bind(el, drawingsPaint);
  $('#drNew').onclick = () => drawingForm();
  $('#drExport').onclick = () => exportCSV('owner-drawings-' + Period.shortLabel().replace(/\s/g, '') + '.csv',
    ['Date', 'Voucher', 'Reason', 'Method', 'Note', 'Amount'],
    rows.map(d => [d.date, d.no, d.reason, d.method, d.note, d.amount]));
  $$('[data-dedit]', el).forEach(b => b.onclick = () => drawingForm(b.dataset.dedit));
  $$('[data-ddel]', el).forEach(b => b.onclick = async () => {
    const d = DB.get('drawings', b.dataset.ddel);
    const yes = await confirmDialog('Drawing ' + fmtMoney(d.amount) + ' delete karein?', { danger: true, yes: 'Delete' });
    if (!yes) return;
    DB.remove('drawings', d.id);
    DB.audit('drawing-delete', 'Drawing delete: ' + fmtMoney(d.amount));
    drawingsPaint();
  });
}

const DRAW_REASONS = ['Personal Use', 'Ghar ka Kharcha', 'Bachon ki Fees', 'Medical', 'Family Function', 'Shop ki Zaroorat', 'Other'];

function drawingForm(id) {
  const d = id ? DB.get('drawings', id) : null;
  const body = `
    <div class="grid g2">
      <label class="fld"><span>Date <b class="req">*</b></span><input type="date" class="inp" id="dfDate" value="${esc(d ? d.date : todayISO())}"/></label>
      <label class="fld"><span>Amount (Rs) <b class="req">*</b></span><input type="number" step="1" class="inp" id="dfAmt" value="${d ? d.amount : ''}"/></label>
    </div>
    <div class="grid g2">
      <label class="fld"><span>Reason</span>
        <select class="inp" id="dfReason">${DRAW_REASONS.map(r => `<option ${d && d.reason === r ? 'selected' : ''}>${r}</option>`).join('')}</select></label>
      <label class="fld"><span>Method</span>
        <select class="inp" id="dfMethod">${['Cash', 'Bank Transfer', 'Cheque', 'JazzCash', 'EasyPaisa'].map(x => `<option ${d && d.method === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
    </div>
    <label class="fld"><span>Note</span><textarea class="inp" id="dfNote">${esc(d ? d.note : '')}</textarea></label>`;
  const w = openModal({
    title: d ? '✏️ Edit Drawing' : '🏧 New Owner Drawing', size: 'sm', body,
    footer: `<button class="btn btn-ghost" data-close="1">Cancel</button><button class="btn btn-primary" id="dfSave">💾 Save</button>`
  });
  $('#dfSave', w).onclick = () => {
    const amt = round2($('#dfAmt', w).value);
    if (amt <= 0) return toast('Amount likhein', 'error');
    const rec = {
      id: d ? d.id : uid('drw'), no: d ? d.no : DB.nextNumber('drawing'),
      date: $('#dfDate', w).value || todayISO(), amount: amt,
      reason: $('#dfReason', w).value, method: $('#dfMethod', w).value, note: $('#dfNote', w).value,
      createdBy: (DB.currentUser() || {}).name || '',
      createdAt: d ? d.createdAt : new Date().toISOString()
    };
    DB.upsert('drawings', rec);
    DB.audit(d ? 'drawing-edit' : 'drawing', (d ? 'Drawing edit: ' : 'Owner drawing: ') + fmtMoney(amt) + ' — ' + rec.reason, { ref: rec.no });
    toast('✔ Drawing save ho gayi', 'success');
    closeModal(w);
    drawingsPaint();
  };
}

</script>

<!-- assets/js/pages/branches.js -->
<script>
/* ============================================================
   BRANCHES — factory / shop / unit
   ============================================================ */

function renderBranches() {
  UI.renderLayout('branches', `<div id="brBody"></div>`);
  branchesPaint();
}

function branchesPaint() {
  const el = $('#brBody');
  if (!el) return;
  const rows = DB.all('branches').sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const stats = rows.map(b => {
    const sales = Biz.sales().filter(s => s.branchId === b.id);
    const exp = DB.all('expenses').filter(e => e.branchId === b.id);
    return {
      b, count: sales.length,
      kg: round1(sales.reduce((a, s) => a + Biz.saleKg(s), 0)),
      income: round2(sales.reduce((a, s) => a + Biz.saleAmount(s), 0)),
      inFactory: round1(sales.reduce((a, s) => a + Biz.pendingKg(s), 0)),
      expenses: round2(exp.reduce((a, e) => a + num(e.amount), 0))
    };
  });

  el.innerHTML = `
    <div class="stats">
      ${UI.statCard({ icon: '🏢', label: 'Total Branches', value: fmtNum(rows.length), tone: 'info' })}
      ${UI.statCard({ icon: '✅', label: 'Active', value: fmtNum(rows.filter(b => b.isActive !== false).length), tone: 'good' })}
      ${UI.statCard({ icon: '⚖️', label: 'Total KG (all branches)', value: fmtKg(round1(stats.reduce((a, s) => a + s.kg, 0))), tone: 'purple' })}
      ${UI.statCard({ icon: '💰', label: 'Total Income', value: fmtMoney(round2(stats.reduce((a, s) => a + s.income, 0))), tone: 'good' })}
    </div>

    <div class="grid g3">
      ${stats.length ? stats.map(s => `
        <div class="card">
          <div class="card-head">
            <span class="cat-dot" style="background:${esc(s.b.color || '#4f7cff')}"></span>
            <h3>${esc(s.b.name)}</h3><div class="sp"></div>
            <span class="pill ${s.b.isActive === false ? 'pill-muted' : 'pill-ok'}">${s.b.isActive === false ? 'Inactive' : 'Active'}</span>
          </div>
          <div class="card-body">
            <div class="tiny muted mb10">${esc(titleCase(s.b.type || 'factory'))} · ${esc(s.b.phone || 'no phone')}<br>${esc(s.b.address || '')}</div>
            <div class="kv"><span>Entries</span><b>${fmtNum(s.count)}</b></div>
            <div class="kv"><span>Total KG received</span><b>${fmtKg(s.kg)}</b></div>
            <div class="kv"><span>In factory now</span><b class="t-warn">${fmtKg(s.inFactory)}</b></div>
            <div class="kv"><span>Income (billed)</span><b class="t-ok">${fmtMoney(s.income)}</b></div>
            <div class="kv"><span>Expenses</span><b class="t-bad">${fmtMoney(s.expenses)}</b></div>
            <div class="row mt10" style="gap:8px">
              <button class="btn btn-ghost btn-sm" data-bedit="${s.b.id}">✏️ Edit</button>
              <button class="btn btn-ghost btn-sm" data-bsales="${s.b.id}">🧾 Sales</button>
              <button class="btn btn-ghost btn-sm" data-bdel="${s.b.id}">🗑️</button>
            </div>
          </div>
        </div>`).join('') : `<div class="card"><div class="card-body"><div class="empty"><div class="empty-ico">🏢</div><div>Koi branch nahi</div></div></div></div>`}
    </div>

    <div class="card mt14"><div class="card-body row" style="justify-content:space-between">
      <div class="small dim">Factory ke sath shop ya doosri unit barh rahi ho to nayi branch add karein — sales aur expenses branch-wise track honge.</div>
      <button class="btn btn-primary btn-sm" id="bNew">➕ New Branch</button>
    </div></div>`;

  $('#bNew').onclick = () => branchForm();
  $$('[data-bedit]', el).forEach(b => b.onclick = () => branchForm(b.dataset.bedit));
  $$('[data-bsales]', el).forEach(b => b.onclick = () => { SalesUI.branch = b.dataset.bsales; app.go('sales'); });
  $$('[data-bdel]', el).forEach(b => b.onclick = async () => {
    const br = DB.get('branches', b.dataset.bdel);
    const used = Biz.sales().filter(s => s.branchId === br.id).length + DB.all('expenses').filter(e => e.branchId === br.id).length;
    if (used) return toast('Yeh branch ' + used + ' records mein use ho rahi hai — delete nahi ho sakti. Inactive kar dein.', 'error', 4500);
    const yes = await confirmDialog('Branch “' + br.name + '” delete karein?', { danger: true, yes: 'Delete' });
    if (!yes) return;
    DB.remove('branches', br.id);
    branchesPaint();
  });
}

function branchForm(id) {
  const b = id ? DB.get('branches', id) : null;
  const body = `
    <div class="grid g2">
      <label class="fld"><span>Branch Name <b class="req">*</b></span><input class="inp" id="bfName" value="${esc(b ? b.name : '')}" placeholder="e.g. Main Factory"/></label>
      <label class="fld"><span>Type</span>
        <select class="inp" id="bfType">${['factory', 'shop', 'unit', 'warehouse', 'office'].map(t => `<option ${b && b.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    </div>
    <div class="grid g2">
      <label class="fld"><span>Phone</span><input class="inp" id="bfPhone" value="${esc(b ? b.phone : '')}"/></label>
      <label class="fld"><span>Colour</span><input type="color" class="inp" id="bfColor" value="${esc(b && b.color ? b.color : '#4f7cff')}" style="height:42px;padding:4px"/></label>
    </div>
    <label class="fld"><span>Address</span><input class="inp" id="bfAddr" value="${esc(b ? b.address : '')}"/></label>
    <label class="fld"><span>Status</span>
      <select class="inp" id="bfActive"><option value="1" ${!b || b.isActive !== false ? 'selected' : ''}>Active</option>
        <option value="0" ${b && b.isActive === false ? 'selected' : ''}>Inactive</option></select></label>`;
  const w = openModal({
    title: b ? '✏️ Edit Branch' : '➕ New Branch', size: 'sm', body,
    footer: `<button class="btn btn-ghost" data-close="1">Cancel</button><button class="btn btn-primary" id="bfSave">💾 Save</button>`
  });
  $('#bfSave', w).onclick = () => {
    const name = $('#bfName', w).value.trim();
    if (!name) return toast('Branch ka naam likhein', 'error');
    const rec = {
      id: b ? b.id : uid('br'), name, type: $('#bfType', w).value, phone: $('#bfPhone', w).value,
      color: $('#bfColor', w).value, address: $('#bfAddr', w).value,
      isActive: $('#bfActive', w).value === '1', createdAt: b ? b.createdAt : new Date().toISOString()
    };
    DB.upsert('branches', rec);
    DB.audit(b ? 'branch-edit' : 'branch', (b ? 'Branch edit: ' : 'Nayi branch: ') + name);
    toast('✔ Branch save ho gayi', 'success');
    closeModal(w);
    branchesPaint();
  };
}

</script>

<script>
/* ============================================================

   Period: Today / Month / Custom / All  ·  Print + CSV export
   ============================================================ */

let RepUI = { tab: 'pl', customerId: '' };

function renderReports() {
  UI.renderLayout('reports', `<div id="repBody"></div>`);
  reportsPaint();
}

function reportsPaint() {
  const el = $('#repBody');
  if (!el) return;
  const m = Biz.metrics(Period);
  const tabs = [
    ['pl', '🧮 Profit &amp; Loss'],
    ['kg', '⚖️ KG / Item'],
    ['cust', '👥 Customer-wise'],
    ['exp', '💸 Expenses'],
    ['del', '🚚 Delivery & Pending'],
    ['pay', '💵 Collections']
  ];
  el.innerHTML = `
    ${Period.bar()}
    <div class="tabs" id="repTabs">
      ${tabs.map(t => `<button class="tab ${RepUI.tab === t[0] ? 'on' : ''}" data-rtab="${t[0]}">${t[1]}</button>`).join('')}
    </div>
    <div id="repPane"></div>`;

      ${UI.statCard({ icon: '📦', label: 'Delivered KG', value: fmtKg(m.deliveredKg), foot: m.deliveredCount + ' orders', tone: 'good' })}
      ${UI.statCard({ icon: '💰', label: 'Income', value: fmtMoney(m.income), tone: 'good' })}
      ${UI.statCard({ icon: '💸', label: 'Total Expenses', value: fmtMoney(m.totalExpenses), tone: 'bad' })}
      ${UI.statCard({ icon: m.profit >= 0 ? '📈' : '📉', label: 'Profit / Loss', value: fmtMoney(m.profit), tone: m.profit >= 0 ? 'good' : 'bad' })}

    </div>`;

  if (RepUI.tab === 'pl') {
    const series = Biz.dailySeries(Period);
    pane.innerHTML = `${sumCards}
      <div class="grid g-2-1">
        <div class="card">
          <div class="card-head"><h3>🧮 Profit &amp; Loss — ${esc(Period.label())}</h3><div class="sp"></div>
            <button class="btn btn-ghost btn-sm" id="plPrint">🖨️ Print</button>
            <button class="btn btn-ghost btn-sm" id="plCsv">⬇️ CSV</button></div>
          <div class="card-body">
            <div class="kv"><span>Wash Income (billed KG × rate)</span><b class="t-ok">${fmtMoney(m.income)}</b></div>
            <div class="kv"><span>Avg rate realised</span><b>${fmtMoney(m.avgRate)} / kg</b></div>
            <div class="kv"><span>− Factory Expenses</span><b class="t-bad">${fmtMoney(m.expenses)}</b></div>
            <div class="kv"><span>− Purchases</span><b class="t-bad">${fmtMoney(m.purchases)}</b></div>
            <div class="kv"><span>− Salaries</span><b class="t-bad">${fmtMoney(m.salaries)}</b></div>
            <div class="kv total"><span>Net ${m.profit >= 0 ? 'Profit' : 'Loss'}</span><b class="${m.profit >= 0 ? 't-ok' : 't-bad'}">${fmtMoney(m.profit)}</b></div>
            <div class="kv"><span>Profit per KG</span><b>${fmtMoney(m.receivedKg ? round2(m.profit / m.receivedKg) : 0)}</b></div>
            <div class="kv"><span>Owner Drawings (cash out, not expense)</span><b>${fmtMoney(m.drawings)}</b></div>
            <div class="kv"><span>Cash in hand (period movement)</span><b class="${m.cashInHand >= 0 ? 't-ok' : 't-bad'}">${fmtMoney(m.cashInHand)}</b></div>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>📈 Last 6 months</h3></div>
          <div class="card-body">${UI.barChart(Biz.monthlySeries(6), { height: 150 })}
            <div class="divider"></div>
            ${UI.progressRows(Biz.monthlySeries(6).slice().reverse().map(r => ({
      label: r.label, value: r.kg, color: '#4f7cff', note: fmtKg(r.kg) + ' · ' + fmtMoneyShort(r.profit)
    })))}
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>📅 Daily Breakdown — ${esc(Period.label())}</h3></div>
        <div class="tbl-wrap">
          <table class="tbl" style="min-width:640px">
            <thead><tr><th>Date</th><th class="t-right">KG Received</th><th class="t-right">Income</th>
              <th class="t-right">Expenses</th><th class="t-right">Net</th></tr></thead>
            <tbody>${series.length ? series.map(d => `<tr>
              <td class="t-nowrap">${fmtDate(d.date)}</td>
              <td class="t-right">${fmtKg(d.kg)}</td>
              <td class="t-right t-ok">${fmtMoney(d.income)}</td>
              <td class="t-right t-bad">${fmtMoney(d.expenses)}</td>
              <td class="t-right ${d.income - d.expenses >= 0 ? 't-ok' : 't-bad'}">${fmtMoney(round2(d.income - d.expenses))}</td>
            </tr>`).join('') : emptyRow(5, 'Is period mein koi activity nahi', '📭')}</tbody>
            ${series.length ? `<tfoot><tr><td>TOTAL</td><td class="t-right">${fmtKg(series.reduce((a, d) => a + d.kg, 0))}</td>
              <td class="t-right">${fmtMoney(round2(series.reduce((a, d) => a + d.income, 0)))}</td>
              <td class="t-right">${fmtMoney(round2(series.reduce((a, d) => a + d.expenses, 0)))}</td>
              <td class="t-right">${fmtMoney(round2(series.reduce((a, d) => a + d.income - d.expenses, 0)))}</td></tr></tfoot>` : ''}
          </table>
        </div>
      </div>`;
    $('#plPrint').onclick = () => printMonthReport();
    $('#plCsv').onclick = () => exportCSV('profit-loss-' + Period.shortLabel().replace(/\s/g, '') + '.csv',
      ['Date', 'KG', 'Income', 'Expenses', 'Net'], series.map(d => [d.date, d.kg, d.income, d.expenses, round2(d.income - d.expenses)]));
  }

  if (RepUI.tab === 'kg') {
    const sales = Biz.salesIn(Period);
    const byProduct = {};
    sales.forEach(s => (s.lines || []).forEach(l => {
      const key = Biz.lineName(l);   // "SHOES — Junior Shoes" (type ho to)
      byProduct[key] = byProduct[key] || { kg: 0, amount: 0, count: 0 };
      byProduct[key].kg = round1(byProduct[key].kg + num(l.qtyKg));
      byProduct[key].amount = round2(byProduct[key].amount + num(l.qtyKg) * Biz.saleRate(s));
      byProduct[key].count++;
    }));
    const keys = Object.keys(byProduct).sort((a, b) => byProduct[b].kg - byProduct[a].kg);
    pane.innerHTML = `${sumCards}
      <div class="grid g-2-1">
        <div class="card">
          <div class="card-head"><h3>⚖️ Item-wise KG Report</h3><div class="sp"></div>
            <button class="btn btn-ghost btn-sm" id="kgCsv">⬇️ CSV</button></div>
          <div class="tbl-wrap">
            <table class="tbl" style="min-width:640px">
              <thead><tr><th>Item</th><th class="t-right">KG</th><th class="t-center">Times</th><th class="t-right">Amount</th></tr></thead>
              <tbody>${keys.length ? keys.map(k => `<tr><td class="t-strong">${esc(k)}</td><td class="t-right">${fmtKg(byProduct[k].kg)}</td>
                <td class="t-center">${fmtNum(byProduct[k].count)}</td>
                <td class="t-right">${fmtMoney(byProduct[k].amount)}</td></tr>`).join('') : emptyRow(4, 'Koi data nahi', '📭')}</tbody>
              <tfoot><tr><td>TOTAL</td><td class="t-right">${fmtKg(m.receivedKg)}</td>
                <td></td><td class="t-right">${fmtMoney(m.income)}</td></tr></tfoot>
            </table>
          </div>
        </div>
      </div>`;
    $('#kgCsv').onclick = () => exportCSV('kg-report-' + Period.shortLabel().replace(/\s/g, '') + '.csv',
      ['Item', 'KG', 'Times', 'Amount'], keys.map(k => [k, byProduct[k].kg, byProduct[k].count, byProduct[k].amount]));
  }

  if (RepUI.tab === 'cust') {
    const rows = DB.all('customers').map(c => {
      const a = Biz.customerAccount(c.id);
      const period = Biz.salesIn(Period).filter(s => s.customerId === c.id);
      return {
        c, a, pKg: round1(period.reduce((x, s) => x + Biz.saleKg(s), 0)),
        pAmt: round2(period.reduce((x, s) => x + Biz.saleAmount(s), 0)),
        pPaid: round2(Biz.paymentsIn(Period).filter(p => p.customerId === c.id).reduce((x, p) => x + num(p.amount), 0))
      };
    }).sort((a, b) => b.pKg - a.pKg);
    const withActivity = rows.filter(r => r.pKg > 0 || r.pPaid > 0 || r.a.balance > 0);
    pane.innerHTML = `${sumCards}
      <div class="card">
        <div class="card-head"><h3>👥 Customer-wise Report — ${esc(Period.label())}</h3><div class="sp"></div>
          <button class="btn btn-ghost btn-sm" id="cuCsv">⬇️ CSV</button></div>
        <div class="tbl-wrap">
          <table class="tbl" style="min-width:960px">
            <thead><tr><th>Customer</th><th class="t-right">KG (period)</th><th class="t-right">Billed (period)</th><th class="t-right">Paid (period)</th>

              <th class="t-right">Balance</th><th class="t-right">Bal KG</th><th class="t-center">Actions</th></tr></thead>

              <td class="t-right">${fmtMoney(r.pAmt)}</td>
              <td class="t-right t-ok">${fmtMoney(r.pPaid)}</td>
              <td class="t-right">${fmtKg(r.a.kgTotal)}</td>
              <td class="t-right">${fmtMoney(r.a.amount)}</td>
              <td class="t-right">${fmtMoney(r.a.paid)}</td>
              <td class="t-right ${r.a.balance > 0.009 ? 't-bad' : 't-ok'}"><b>${fmtMoney(r.a.balance)}</b></td>
              <td class="t-right">${fmtKg(r.a.kgBalance)}</td>
              <td class="t-center"><button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-rled="${r.c.id}">📒</button></td>

          </table>
        </div>
      </div>`;
    $('#cuCsv').onclick = () => exportCSV('customer-report-' + Period.shortLabel().replace(/\s/g, '') + '.csv',

    const total = round2(exps.reduce((a, e) => a + num(e.amount), 0));
    pane.innerHTML = `${sumCards}
      <div class="card">
        <div class="card-head"><h3>💸 Combined Expense Report (Expenses + Salary + Purchases)</h3><div class="sp"></div>
          <button class="btn btn-ghost btn-sm" id="exCsv">⬇️ CSV</button></div>
        <div class="tbl-wrap">
          <table class="tbl" style="min-width:760px">
            <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Paid To</th><th>Mode</th><th>Note</th><th class="t-right">Amount</th></tr></thead>
            <tbody>${exps.length ? exps.map(e => `<tr>
              <td class="t-nowrap">${fmtDate(e.date)}</td>
              <td><span class="tag">${e._t ? titleCase(e._t) : 'Expense'}</span></td>
              <td>${esc(e.category || '')}</td><td class="tiny">${esc(e.paidTo || '—')}</td>
              <td class="tiny">${esc(e.mode || '')}</td><td class="tiny">${esc(e.note || '')}</td>
              <td class="t-right t-bad">${fmtMoney(e.amount)}</td></tr>`).join('') : emptyRow(7, 'Koi kharcha nahi', '💤')}</tbody>
            <tfoot><tr><td colspan="6">TOTAL</td><td class="t-right">${fmtMoney(total)}</td></tr></tfoot>

  if (RepUI.tab === 'del') {
    const pend = Biz.pendingWithAge();
    const del = Biz.deliveredIn(Period);
    pane.innerHTML = `${sumCards}
      <div class="grid g-2-1">
        <div class="card">
          <div class="card-head"><h3>🚚 Deliveries in ${esc(Period.shortLabel())}</h3><div class="sp"></div>
            <button class="btn btn-ghost btn-sm" id="dlCsv">⬇️ CSV</button></div>
          <div class="tbl-wrap">
            <table class="tbl" style="min-width:620px">
              <thead><tr><th>Invoice</th><th>Customer</th><th>Received</th><th>Delivered</th><th class="t-right">KG</th><th class="t-center">Days</th></tr></thead>
              <tbody>${del.length ? del.map(s => `<tr>
                <td class="t-strong">${esc(s.invoiceNo)}</td><td>${esc(Biz.customerName(s.customerId))}</td>
                <td class="t-nowrap">${fmtDate(s.entryDate)}</td><td class="t-nowrap">${fmtDate(s.deliveryDate)}</td>
                <td class="t-right">${fmtKg(s.deliveredKg || s.kgTotal)}</td>
                <td class="t-center">${daysBetween(s.entryDate, s.deliveryDate)}</td></tr>`).join('') : emptyRow(6, 'Is period mein koi delivery nahi', '📭')}</tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>🏭 Currently Pending (${pend.length})</h3></div>
          <div class="tbl-wrap">
            <table class="tbl" style="min-width:420px">
              <thead><tr><th>Invoice</th><th>Customer</th><th class="t-right">Pending KG</th><th class="t-center">Age</th></tr></thead>
              <tbody>${pend.length ? pend.map(s => `<tr><td class="t-strong">${esc(s.invoiceNo)}</td><td class="tiny">${esc(Biz.customerName(s.customerId))}</td>
                <td class="t-right">${fmtKg(Biz.pendingKg(s))}</td>
                <td class="t-center"><span class="pill ${s.ageDays > 7 ? 'pill-due' : 'pill-muted'}">${s.ageDays}d</span></td></tr>`).join('')
        : emptyRow(4, 'Factory khali hai 🎉', '🎉')}</tbody>
            </table>
          </div>
        </div>
      </div>`;
    $('#dlCsv').onclick = () => exportCSV('deliveries-' + Period.shortLabel().replace(/\s/g, '') + '.csv',
      ['Invoice', 'Customer', 'Received', 'Delivered', 'KG', 'Days'],
      del.map(s => [s.invoiceNo, Biz.customerName(s.customerId), s.entryDate, s.deliveryDate, s.deliveredKg || s.kgTotal, daysBetween(s.entryDate, s.deliveryDate)]));
  }

  if (RepUI.tab === 'pay') {
    const pays = Biz.paymentsIn(Period).sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const total = round2(pays.reduce((a, p) => a + num(p.amount), 0));
    const byMode = {};
    pays.forEach(p => { byMode[p.mode || 'Cash'] = round2((byMode[p.mode || 'Cash'] || 0) + num(p.amount)); });
    pane.innerHTML = `${sumCards}
      <div class="grid g-2-1">
        <div class="card">
          <div class="card-head"><h3>💵 Collection Report — ${esc(Period.label())}</h3><div class="sp"></div>
            <button class="btn btn-ghost btn-sm" id="pyCsv">⬇️ CSV</button></div>
          <div class="tbl-wrap">
            <table class="tbl" style="min-width:720px">
              <thead><tr><th>Date</th><th>Voucher</th><th>Customer</th><th>Against</th><th>Mode</th>
                <th class="t-right">Amount</th><th class="t-right">KG Covered</th><th>Note</th></tr></thead>
              <tbody>${pays.length ? pays.map(p => `<tr>
                <td class="t-nowrap">${fmtDate(p.date)}</td><td class="tiny">${esc(p.no || '')}</td>
                <td>${esc(Biz.customerName(p.customerId))}</td>
                <td class="tiny">${p.saleId ? esc((DB.get('sales', p.saleId) || {}).invoiceNo || '') : (p.isAdvance ? '<span class="pill pill-info">Advance</span>' : '—')}</td>
                <td class="tiny">${esc(p.mode || '')}</td>
                <td class="t-right t-ok"><b>${fmtMoney(p.amount)}</b></td>
                <td class="t-right">${fmtKg(p.kgCovered)}</td>
                <td class="tiny">${esc(p.note || '')}</td></tr>`).join('') : emptyRow(8, 'Is period mein koi payment nahi', '💤')}</tbody>
              <tfoot><tr><td colspan="5">TOTAL</td><td class="t-right">${fmtMoney(total)}</td>
                <td class="t-right">${fmtKg(round1(pays.reduce((a, p) => a + num(p.kgCovered), 0)))}</td><td></td></tr></tfoot>
            </table>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>🏦 Mode-wise Collection</h3></div>
          <div class="card-body">${Object.keys(byMode).length ? UI.progressRows(Object.keys(byMode).sort((a, b) => byMode[b] - byMode[a]).map(k => ({
      label: k, value: byMode[k], color: '#16a34a', note: fmtMoney(byMode[k])
    }))) : '<div class="empty"><div class="empty-ico">💵</div><div>Koi collection nahi</div></div>'}
          <div class="divider"></div>
          <div class="kv"><span>Total Collected</span><b class="t-ok">${fmtMoney(total)}</b></div>
          <div class="kv"><span>Equivalent KG (payments ke record se)</span><b>${fmtKg(round1(pays.reduce((a, p) => a + num(p.kgCovered), 0)))}</b></div>
          </div>
        </div>
      </div>`;
    $('#pyCsv').onclick = () => exportCSV('collections-' + Period.shortLabel().replace(/\s/g, '') + '.csv',
      ['Date', 'Voucher', 'Customer', 'Against Invoice', 'Mode', 'Amount', 'KG Covered', 'Note'],
      pays.map(p => [p.date, p.no, Biz.customerName(p.customerId), p.saleId ? (DB.get('sales', p.saleId) || {}).invoiceNo : 'Advance', p.mode, p.amount, p.kgCovered, p.note]));
  }
}

</script>

<script>
/* ============================================================
   USERS — staff logins, roles & permissions + audit log
   ============================================================ */

let UserUI = { tab: 'list' };

function renderUsers() {
  UI.renderLayout('users', `<div id="usrBody"></div>`);
  usersPaint();
}

const PERM_GROUPS = [
  { g: 'Operations', ids: ['dashboard', 'newsales', 'sales', 'delivery'] },
  { g: 'Clients & Money', ids: ['customers', 'ledger'] },
  { g: 'Business', ids: ['products', 'expenses', 'purchases', 'vendorlist', 'employees', 'drawings', 'branches'] },
  { g: 'Admin', ids: ['reports', 'users', 'settings'] }
];

function usersPaint() {
  const el = $('#usrBody');
  if (!el) return;
  const users = DB.all('users').sort((a, b) => String(a.role).localeCompare(String(b.role)));
  const me = DB.currentUser();
  const log = DB.all('auditLog').slice(0, 200);

  el.innerHTML = `
    <div class="tabs" id="uTabs">
      <button class="tab ${UserUI.tab === 'list' ? 'on' : ''}" data-ut="list">🔐 Users (${users.length})</button>
      <button class="tab ${UserUI.tab === 'log' ? 'on' : ''}" data-ut="log">📜 Activity Log (${DB.all('auditLog').length})</button>
    </div>
    <div id="uPane"></div>`;

  $$('[data-ut]', el).forEach(b => b.onclick = () => { UserUI.tab = b.dataset.ut; usersPaint(); });
  const pane = $('#uPane');

  if (UserUI.tab === 'list') {
    pane.innerHTML = `
      <div class="card">
        <div class="card-head"><h3>🔐 Staff Accounts</h3><div class="sp"></div>
          <button class="btn btn-primary btn-sm" id="uNew">➕ New User</button></div>
        <div class="tbl-wrap">
          <table class="tbl" style="min-width:880px">
            <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Permissions</th><th class="t-center">Status</th>
              <th>Created</th><th class="t-center">Actions</th></tr></thead>
            <tbody>${users.map(u => `<tr>
              <td class="t-strong">${esc(u.name)} ${me && me.id === u.id ? '<span class="pill pill-info">You</span>' : ''}</td>
              <td class="mono">${esc(u.username)}</td>
              <td><span class="tag">${esc(titleCase(u.role))}</span></td>
              <td class="tiny">${DB.isOwner(u) ? 'Sab pages (full access)' : (u.permissions || []).map(p => esc(friendlyPage(p))).join(', ') || '—'}</td>
              <td class="t-center">${u.active === false ? '<span class="pill pill-muted">Inactive</span>' : '<span class="pill pill-ok">Active</span>'}</td>
              <td class="tiny t-nowrap">${fmtDate(u.createdAt)}</td>
              <td class="t-center t-nowrap">
                <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-uedit="${u.id}" title="Edit">✏️</button>
                ${me && me.id === u.id ? '' : `<button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-udel="${u.id}" title="Delete">🗑️</button>`}
              </td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>

      <div class="card"><div class="card-body">
        <div class="grid g3">
          <div class="note-box info tiny"><b>👑 Owner</b><br>Sab kuch — settings, users, reports, cloud, backup.</div>
          <div class="note-box tiny"><b>🧑‍💼 Manager</b><br>Operations + business pages, lekin users/settings nahi. Permissions custom set kar sakte hain.</div>
          <div class="note-box tiny"><b>🧾 Cashier</b><br>Sirf New Sales, Sales, Customers, Ledger — daily entry ke liye.</div>
        </div>
      </div></div>`;
    $('#uNew').onclick = () => userForm();
    $$('[data-uedit]', pane).forEach(b => b.onclick = () => userForm(b.dataset.uedit));
    $$('[data-udel]', pane).forEach(b => b.onclick = async () => {
      const u = DB.get('users', b.dataset.udel);
      const yes = await confirmDialog('“' + u.name + '” ka account delete karein?', { danger: true, yes: 'Delete' });
      if (!yes) return;
      DB.remove('users', u.id);
      DB.audit('user-delete', 'User delete: ' + u.name);
      toast('User delete ho gaya', 'warn');
      usersPaint();
    });
  } else {
    pane.innerHTML = `
      <div class="card">
        <div class="card-head"><h3>📜 Activity Log (latest 200)</h3><div class="sp"></div>
          <button class="btn btn-ghost btn-sm" id="logCsv">⬇️ CSV</button>
          <button class="btn btn-ghost btn-sm" id="logClear">🗑️ Clear</button></div>
        <div class="tbl-wrap">
          <table class="tbl" style="min-width:760px">
            <thead><tr><th>When</th><th>User</th><th>Action</th><th>Detail</th><th>Ref</th></tr></thead>
            <tbody>${log.length ? log.map(l => `<tr>
              <td class="tiny t-nowrap">${new Date(l.at).toLocaleString()}</td>
              <td class="tiny">${esc(l.userName || '')}</td>
              <td><span class="tag">${esc(l.action || '')}</span></td>
              <td class="tiny">${esc(l.detail || '')}</td>
              <td class="tiny">${esc(l.ref || '')}</td>
            </tr>`).join('') : emptyRow(5, 'Koi activity nahi', '📜')}</tbody>
          </table>
        </div>
      </div>`;
    $('#logCsv').onclick = () => exportCSV('activity-log.csv', ['When', 'User', 'Action', 'Detail', 'Ref'],
      log.map(l => [new Date(l.at).toLocaleString(), l.userName, l.action, l.detail, l.ref]));
    $('#logClear').onclick = async () => {
      const yes = await confirmDialog('Poora activity log clear karein?', { danger: true, yes: 'Clear log' });
      if (!yes) return;
      DB._data.auditLog = [];
      DB.save();
      usersPaint();
    };
  }
}

function friendlyPage(id) { const n = NAV.find(x => x.id === id); return n ? n.label : id; }

function userForm(id) {
  const u = id ? DB.get('users', id) : null;
  const isOwnerUser = u && DB.isOwner(u);
  const body = `
    <div class="grid g2">
      <label class="fld"><span>Full Name <b class="req">*</b></span><input class="inp" id="ufName" value="${esc(u ? u.name : '')}"/></label>
      <label class="fld"><span>Role</span>
        <select class="inp" id="ufRole" ${isOwnerUser ? 'disabled' : ''}>
          <option value="cashier" ${u && u.role === 'cashier' ? 'selected' : ''}>Cashier</option>
          <option value="manager" ${u && u.role === 'manager' ? 'selected' : ''}>Manager</option>
          <option value="owner" ${!u || (u && u.role === 'owner') ? 'selected' : ''}>Owner (full access)</option>
        </select></label>
    </div>
    <div class="grid g3">
      <label class="fld"><span>Username <b class="req">*</b></span><input class="inp" id="ufUser" value="${esc(u ? u.username : '')}" autocomplete="off"/></label>
      <label class="fld"><span>Password <b class="req">*</b></span><input class="inp" id="ufPass" value="${esc(u ? u.password : '')}" autocomplete="new-password"/></label>
      <label class="fld"><span>Phone</span><input class="inp" id="ufPhone" value="${esc(u ? u.phone : '')}"/></label>
    </div>
    <label class="fld"><span>Status</span>
      <select class="inp" id="ufActive"><option value="1" ${!u || u.active !== false ? 'selected' : ''}>Active</option>
        <option value="0" ${u && u.active === false ? 'selected' : ''}>Inactive</option></select></label>
    <div class="fld"><span>Permissions (Owner ke liye zaroori nahi)</span>
      ${PERM_GROUPS.map(gr => `<div class="note-box tiny mb6">
        <b>${gr.g}</b><div class="row" style="gap:12px;margin-top:6px">
          ${gr.ids.map(pid => `<label class="row tiny" style="gap:5px;font-weight:700">
            <input type="checkbox" data-perm="${pid}" ${u && (u.permissions || []).indexOf(pid) >= 0 ? 'checked' : ''}/> ${esc(friendlyPage(pid))}</label>`).join('')}
        </div></div>`).join('')}
    </div>`;

  const w = openModal({
    title: u ? '✏️ Edit User' : '➕ New User', size: 'lg', body,
    footer: `<button class="btn btn-ghost" data-close="1">Cancel</button><button class="btn btn-primary" id="ufSave">💾 Save</button>`
  });
  $('#ufSave', w).onclick = () => {
    const name = $('#ufName', w).value.trim();
    const username = $('#ufUser', w).value.trim().toLowerCase();
    const pass = $('#ufPass', w).value;
    if (!name || !username || !pass) return toast('Name, username aur password zaroori hain', 'error');
    const dup = DB.all('users').find(x => x.username.toLowerCase() === username && (!u || x.id !== u.id));
    if (dup) return toast('Yeh username pehle se maujood hai', 'error');
    const perms = $$('[data-perm]', w).filter(c => c.checked).map(c => c.dataset.perm);
    const rec = {
      id: u ? u.id : uid('u'), name, username, password: pass,
      role: u ? (u.role === 'owner' ? 'owner' : $('#ufRole', w).value) : $('#ufRole', w).value,
      phone: $('#ufPhone', w).value, active: $('#ufActive', w).value === '1',
      permissions: perms, createdAt: u ? u.createdAt : new Date().toISOString()
    };
    DB.upsert('users', rec);
    DB.audit(u ? 'user-edit' : 'user', (u ? 'User edit: ' : 'Naya user: ') + name + ' (' + rec.role + ')');
    toast('✔ User save ho gaya', 'success');
    closeModal(w);
    usersPaint();
  };
}

</script>

    $('#stSavePrint').onclick = () => {
      DB.saveSettings({
        slipPaper: $('#stPaper', pane).value,
        slipLogoHeight: Math.max(20, Math.min(64, num($('#stLogoH', pane).value) || 40)),
        slipLogo: $('#stSlipLogo', pane).checked,
        logoMono: $('#stMonoLogo', pane).checked,
        slipPhone: $('#stSlipPhone', pane).checked,
        slipAddress: $('#stSlipAddr', pane).checked
      });
      DB.audit('settings', 'Thermal print settings update: ' + $('#stPaper', pane).value);
      toast('Print settings save ho gayi', 'success');
      settingsPaint();
    };
    $('#stTestSlip').onclick = () => {
      DB.saveSettings({
        slipPaper: $('#stPaper', pane).value,
        slipLogoHeight: Math.max(20, Math.min(64, num($('#stLogoH', pane).value) || 40)),
        slipLogo: $('#stSlipLogo', pane).checked,

      });
      printTestSlip();
    };

<!-- assets/js/app.js -->
<script>
/* ============================================================
   MR LAUNDRY FACTORY PORTAL — APP ROUTER + BOOT
   ============================================================ */

const app = {
  current: '',

  go(page) {
    const user = DB.currentUser();
    if (page !== 'login' && !user) { this.current = 'login'; return renderLogin(); }

    // "page?key=value" support
    let param = null;
    if (page && page.indexOf('?') >= 0) {
      const parts = page.split('?');
      page = parts[0];
      param = {};
      new URLSearchParams(parts[1]).forEach((v, k) => param[k] = v);
    }

    if (page !== 'login' && !DB.can(page)) {
      toast('Aap ko is page ki permission nahi hai', 'error');
      const allowed = NAV.filter(n => n.id && DB.can(n.id)).map(n => n.id);
      page = allowed.indexOf('dashboard') >= 0 ? 'dashboard' : (allowed[0] || 'login');
    }

    this.current = page;
    try { location.hash = page; } catch (e) {}
    UI.sidebarOpen = false;

    switch (page) {
      case 'login': return renderLogin();
      case 'dashboard': return renderDashboard();
      case 'newsales': return renderNewSales(param);
      case 'sales': return renderSales(param);
      case 'delivery': return renderDelivery();
      case 'customers': return renderCustomers(param);
      case 'ledger': return renderLedger(param);
      case 'products': return renderProducts();
      case 'expenses': return renderExpenses();
      case 'purchases': return renderPurchases();
      case 'vendorlist': return renderVendors();
      case 'employees': return renderEmployees();
      case 'drawings': return renderDrawings();
      case 'branches': return renderBranches();
      case 'reports': return renderReports();
      case 'users': return renderUsers();
      case 'settings': return renderSettings();
      default: return renderDashboard();
    }
  }
};

/* ---------- BOOT ---------- */
window.addEventListener('DOMContentLoaded', () => {
  document.documentElement.dataset.theme = UI.theme();
  DB.load();
  const boot = Cloud.init();              // config + pehla sync (background)
  const hash = (location.hash || '').replace('#', '');
  const start = (hash && hash !== 'login') ? hash : null;
  const u = DB.currentUser();
  if (u) app.go(start && DB.can(start) ? start : 'dashboard');
  else renderLogin();
  /* naye system par: cloud se data aane ke baad screen khud refresh */
  if (boot && boot.then) boot.then(() => { if (DB.currentUser()) app.go(app.current || 'dashboard'); else renderLogin(); }).catch(() => {});
});

window.addEventListener('hashchange', () => {
  const h = (location.hash || '').replace('#', '');
  if (h && h !== app.current && DB.currentUser()) app.go(h);
});

/* keyboard shortcuts */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); if (DB.can('newsales')) app.go('newsales'); }
  if (e.altKey && e.key.toLowerCase() === 'd') { e.preventDefault(); if (DB.can('dashboard')) app.go('dashboard'); }
  if (e.key === 'Escape') { if (app.current === 'newsales') app.go('sales'); }
});

</script>
