  const sel = $('#ldCust'); if (sel) sel.onchange = e => { LedgerUI.customerId = e.target.value; ledgerPaint(); };
  const pe = $('#ldPay'); if (pe) pe.onclick = () => openPaymentForm(cid);
  const ex = $('#ldExport'); if (ex) ex.onclick = () => exportCSV('ledger-' + DB.get('customers', cid).name.replace(/\s+/g, '-') + '.csv',
    ['Date', 'Type', 'Ref', 'Details', 'KG +', 'KG -', 'Balance KG', 'Amount', 'Balance'],
    acc.ledger.map(r => [r.date, r.type, r.ref, r.desc, r.kgAdd, r.kgCut, r.kgBal, r.amount, r.amtBal]));
  const wk = $('#ldWeek'); if (wk) wk.onclick = () => openWeeklyInvoice(cid);
  const stm = $('#ldStmt'); if (stm) stm.onclick = () => printCustomerStatement(cid);
  const wa = $('#ldWa'); if (wa) wa.onclick = () => {
    const c = DB.get('customers', cid);
    whatsappShare(c.phone, 'Assalam-o-Alaikum ' + c.name + ',\nAap ke account ka hisaab:\n' +
      'Total Wash: ' + fmtKg(acc.kgTotal) + '\nTotal Amount: ' + fmtMoney(acc.amount) +
      '\nReceived: ' + fmtMoney(acc.paid) + '\nBalance Due: ' + fmtMoney(acc.balance) + ' (' + fmtKg(acc.kgBalance) + ')' +
      '\n\nShukriya — ' + DB.settings().shopName);
    toast('WhatsApp khul raha hai…', 'info');
  };
  $$('[data-pay]', el).forEach(b => b.onclick = () => openPaymentForm(b.dataset.pay));
  $('#recvExport').onclick = () => exportCSV('receivables-' + todayISO() + '.csv',
    ['Customer', 'Phone', 'Total KG', 'Billed', 'Paid', 'Balance', 'Balance KG', 'Advance'],
    dueList.map(x => [x.c.name, x.c.phone, x.a.kgTotal, x.a.amount, x.a.paid, x.a.balance, x.a.kgBalance, x.a.advance]));
  $('#recvPrint').onclick = () => {
    const body = `${printHeader(DB.settings(), 'RECEIVABLE REPORT')}
      <div class="pr-title">CUSTOMER-WISE BALANCE REPORT — ${esc(fmtDateLong(todayISO()))}</div>
      <table class="pr-tbl"><thead><tr><th>#</th><th>Customer</th><th class="r">Total KG</th><th class="r">Billed</th>
        <th class="r">Paid</th><th class="r">Balance</th><th class="r">Bal KG</th></tr></thead>
      <tbody>${dueList.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.c.name)}</td><td class="r">${fmtNum(x.a.kgTotal, 1)}</td>
        <td class="r">${fmtNum(x.a.amount)}</td><td class="r">${fmtNum(x.a.paid)}</td><td class="r"><b>${fmtNum(x.a.balance)}</b></td>
        <td class="r">${fmtNum(x.a.kgBalance, 1)}</td></tr>`).join('')}
      <tr><td colspan="5"><b>TOTAL</b></td><td class="r"><b>${fmtNum(round2(dueList.reduce((a, x) => a + x.a.balance, 0)))}</b></td>
        <td class="r"><b>${fmtNum(round1(dueList.reduce((a, x) => a + x.a.kgBalance, 0)), 1)}</b></td></tr></tbody></table>
      <div class="pr-foot"><div class="small">${esc(DB.settings().shopName)}</div><div class="sign">Authorised Signature</div></div>`;
    printHTML('Receivables', body, { size: 'a4' });
  };
}

/* ============================================================
   PAYMENT FORM — Amount ya KG se (FIFO allocation)
   ============================================================ */
function openPaymentForm(customerId, opts) {
  const o = opts || {};
  const cid = customerId || LedgerUI.customerId;
  if (!cid) { toast('Pehle customer select karein', 'error'); return; }
  const c = DB.get('customers', cid);
  let acc = Biz.customerAccount(cid);
  let mode = 'amount'; // amount | kg
  const dueList = Biz.dueSales(cid);
  const mix = acc.rateMix || [];
  // default rate = sab se purane pending bill ka rate (FIFO mein pehle wahi lagta hai)
  const defRate = dueList.length ? (num(dueList[0].rate) || Biz.rate()) : Biz.rate();

  const body = `
    <div class="note-box info tiny mb10">
      <b>${esc(c.name)}</b> · ${mix.length
        ? 'Bills ka rate: ' + mix.map(m => '<b>' + fmtMoney(m.rate) + '</b>').join(' + ') + ' /kg'
        : 'Rate <b>' + fmtMoney(Biz.rate()) + '/kg</b>'}<br>
      Total received: <b>${fmtKg(acc.kgTotal)}</b> (${fmtMoney(acc.amount)}) ·
      Paid: <b>${fmtMoney(acc.paid)}</b> (${fmtKg(acc.kgPaid)}) ·
      <b class="${acc.balance > 0.009 ? 't-bad' : 't-ok'}">Balance: ${fmtMoney(acc.balance)} (${fmtKg(acc.kgBalance)})</b>
      ${acc.advance > 0 ? ' · Advance: <b>' + fmtMoney(acc.advance) + '</b>' : ''}
      ${mix.length > 1 ? '<div style="margin-top:4px">⚠️ Pending bills <b>2 alag rate</b> par hain (' +
          mix.map(m => fmtMoney(m.rate) + ' × ' + fmtKg(m.kg)).join(' · ') + ') — neeche <b>rate</b> khud check kar lein.</div>' : ''}
    </div>

    <div class="grid g3" style="align-items:end">
      <label class="fld mb0"><span>Payment Date</span><input type="date" class="inp" id="pfDate" value="${todayISO()}"/></label>
      <label class="fld mb0"><span>Mode</span><select class="inp" id="pfMode">
        ${['Cash', 'Bank Transfer', 'JazzCash', 'EasyPaisa', 'Cheque'].map(m => `<option>${m}</option>`).join('')}</select></label>
      <label class="fld mb0"><span>Ref / Cheque No.</span><input class="inp" id="pfRef" placeholder="optional"/></label>
    </div>

    <div class="row mt14" style="gap:8px">
      <button class="seg-btn on" id="pmAmount" data-pm="amount">💵 Amount se</button>
      <button class="seg-btn" id="pmKg" data-pm="kg">⚖️ KG se (kitne KG delivered)</button>
    </div>

    <div class="tiny muted" style="margin-top:-6px">Purani payment record kar rahe hain? <b>Date</b> bhi asli (purani) rakhein.</div>

    <div class="grid g3 mt10" style="gap:10px;align-items:end">
      <label class="fld mb0"><span id="pfAmtLbl">Amount Received (Rs) <b class="req">*</b></span>
        <input type="number" step="1" class="inp" id="pfAmount" placeholder="0"/></label>
      <label class="fld mb0"><span>Kis rate par? (Rs / kg) <b class="req">*</b></span>
        <input type="number" step="1" min="1" class="inp t-right" id="pfRate" value="${num(defRate)}"/></label>
      <label class="fld mb0"><span id="pfKgLbl">Equivalent KG (auto)</span>
        <input type="number" step="0.1" class="inp" id="pfKg" placeholder="0.0"/></label>
    </div>
    <div class="row" style="gap:8px;margin-top:-6px">
      <button class="btn btn-ghost btn-xs" data-quick="balance">Poora balance (${fmtMoney(acc.balance)})</button>
      <button class="btn btn-ghost btn-xs" data-quick="half">Aadha (50%)</button>
      <button class="btn btn-ghost btn-xs" data-quick="kg">Baaki KG (${fmtKg(acc.kgBalance)})</button>
    </div>
    <div class="tiny muted" id="pfRateHint" style="margin-top:6px"></div>
    ${mix.length ? `<div class="row" style="gap:6px;flex-wrap:wrap;margin-top:4px" id="pfRateChips">
      <span class="tiny muted" style="align-self:center">Pending bill ka rate:</span>
      ${mix.map(m => `<button class="btn btn-ghost btn-xs" data-prate="${num(m.rate)}">Rs. ${num(m.rate)} · ${fmtKg(m.kg)} baqi${m.count > 1 ? ' (' + m.count + ' bill)' : ''}</button>`).join('')}
    </div>` : ''}

    <label class="fld mt10"><span>Note</span>
      <textarea class="inp" id="pfNote" placeholder="e.g. Half payment received — baqi agle bill mein">${o.note || ''}</textarea></label>

    <div class="card card-flat"><div class="card-head"><h3>🔎 Allocation Preview (FIFO — pehle purane bill)</h3></div>
      <div class="tbl-wrap"><table class="tbl" style="min-width:560px">
        <thead><tr><th>Invoice</th><th>Date</th><th class="t-right">Bill</th><th class="t-right">Pending</th>
          <th class="t-right">Ye payment lagegi</th><th class="t-right">Baqi rahega</th></tr></thead>
        <tbody id="pfPreview"></tbody>
      </table></div>
      <div class="card-body tiny dim" id="pfPreviewNote"></div>
    </div>`;

  const w = openModal({
    title: '💵 Receive Payment — ' + c.name, size: 'lg', body,
    footer: `<button class="btn btn-ghost" data-close="1">Cancel</button>
             <button class="btn btn-ghost" id="pfSavePrint">💾 Save + Print Receipt</button>
             <button class="btn btn-success" id="pfSave">💾 Save Payment</button>`
  });

  const amtEl = $('#pfAmount', w), kgEl = $('#pfKg', w), rateEl = $('#pfRate', w);
  const payRate = () => num(rateEl && rateEl.value) || Biz.rate();
  let lastEdit = 'amount';   // rate badalne par wahi field sync hoti hai jo user ne bhara tha

  const rateHint = () => {
    const el = $('#pfRateHint', w); if (!el) return;
    const r = round2(payRate());
    if (!dueList.length) { el.innerHTML = 'Is customer ka koi pending bill nahi — yeh payment <b>advance</b> banegi.'; return; }
    const old = dueList[0];
    const oldRate = round2(num(old.rate) || Biz.rate());
    const same = dueList.filter(s => round2(num(s.rate) || Biz.rate()) === r).length;
    el.innerHTML = (r === oldRate
      ? '✓ Sahi rate — sab se purana pending bill <b>' + esc(old.invoiceNo) + '</b> (' + fmtDate(old.entryDate) + ') isi rate par hai.'
      : '⚠️ Sab se purana pending bill <b>' + esc(old.invoiceNo) + '</b> (' + fmtDate(old.entryDate) + ') ka rate <b>' + fmtMoney(oldRate) + '/kg</b> hai — payment usi rate se convert honi chahiye.')
      + (same ? ' · Is rate par <b>' + same + '</b> bill pending.' : '');
  };

  function preview() {
    const amount = round2(num(amtEl.value));
    const due = Biz.dueSales(cid);
    let left = amount, kgTaken = 0;
    const rows = due.map(s => {
      const take = round2(Math.min(left, s._due));
      left = round2(left - take);
      kgTaken = round1(kgTaken + round1(take / (num(s.rate) || payRate())));
      return `<tr>
        <td class="t-strong">${esc(s.invoiceNo)}</td><td class="tiny">${fmtDate(s.entryDate)}</td>
        <td class="t-right">${fmtMoney(s._amount)}</td>
        <td class="t-right t-bad">${fmtMoney(s._due)}<div class="tiny muted">${fmtKg(s._kgDue)}</div></td>
        <td class="t-right ${take > 0 ? 't-ok' : 't-muted'}">${take > 0 ? fmtMoney(take) + '<div class="tiny">' + fmtKg(round1(take / (num(s.rate) || payRate()))) + '</div>' : '—'}</td>
        <td class="t-right">${fmtMoney(round2(s._due - take))}<div class="tiny muted">${fmtKg(round1((s._due - take) / (num(s.rate) || payRate())))}</div></td>
      </tr>`;
    }).join('');
    $('#pfPreview', w).innerHTML = rows || emptyRow(6, 'Koi pending bill nahi — yeh advance ho jayega', '✅');
    const balAfter = round2(Math.max(0, acc.balance - amount));
    const advAfter = round2(Math.max(0, amount - acc.balance));
    const kgAfter = round1(Math.max(0, acc.kgBalance - kgTaken));
    $('#pfPreviewNote', w).innerHTML = amount > 0
      ? `Is payment se <b>${fmtKg(kgTaken)}</b> cover hogi (har bill apne rate par) · ` +
      `Baqi: <b class="${balAfter > 0 ? 't-bad' : 't-ok'}">${fmtMoney(balAfter)} (${fmtKg(kgAfter)})</b>` +
      (advAfter > 0 ? ` · <b>Advance ${fmtMoney(advAfter)}</b> (next bill mein adjust hoga)` : '') +
      ` · Total paid ho jayega: <b>${fmtMoney(round2(acc.paid + amount))}</b>`
      : 'Amount ya KG likhein — allocation yahan show hoga.';
  }

  function setMode(m) {
    mode = m;
    $('#pmAmount', w).classList.toggle('on', m === 'amount');
    $('#pmKg', w).classList.toggle('on', m === 'kg');
    if (m === 'kg') {
      lastEdit = 'kg';
      amtEl.value = round2(num(kgEl.value) * payRate()) || '';
      $('#pfKgLbl', w).innerHTML = 'Kitne KG ka payment? <b class="req">*</b>';
      $('#pfAmtLbl', w).textContent = 'Equivalent Amount (auto)';
    } else {
      lastEdit = 'amount';
      kgEl.value = round1(num(amtEl.value) / payRate()) || '';
      $('#pfAmtLbl', w).innerHTML = 'Amount Received (Rs) <b class="req">*</b>';
      $('#pfKgLbl', w).textContent = 'Equivalent KG (auto)';
    }
    preview();
  }
  $$('[data-pm]', w).forEach(b => b.onclick = () => setMode(b.dataset.pm));
  amtEl.oninput = () => { lastEdit = 'amount'; kgEl.value = round1(num(amtEl.value) / payRate()) || ''; preview(); };
  kgEl.oninput = () => { lastEdit = 'kg'; amtEl.value = round2(num(kgEl.value) * payRate()) || ''; preview(); };
  const applyRate = () => {
    if (lastEdit === 'kg') amtEl.value = round2(num(kgEl.value) * payRate()) || '';
    else kgEl.value = round1(num(amtEl.value) / payRate()) || '';
    rateHint(); preview();
  };
  if (rateEl) rateEl.oninput = applyRate;
  $$('[data-prate]', w).forEach(b => b.onclick = () => { if (rateEl) rateEl.value = num(b.dataset.prate); applyRate(); });
  $$('[data-quick]', w).forEach(b => b.onclick = () => {
    const q = b.dataset.quick;
    // poora balance / baaki KG — exact values (mix rate ho to bhi theek, kyunki FIFO se aate hain)
    if (q === 'balance') { amtEl.value = round2(acc.balance); kgEl.value = round1(acc.kgBalance); }
    if (q === 'half') { amtEl.value = round2(acc.balance / 2); kgEl.value = round1(acc.kgBalance / 2); }
    if (q === 'kg') { kgEl.value = round1(acc.kgBalance); amtEl.value = round2(acc.balance); }
    preview();
  });
  rateHint();

  // if opened from a specific sale, pre-fill that sale's due
  if (o.saleId) {
    const s = DB.get('sales', o.saleId);
    const row = acc.saleRows.find(x => x.id === o.saleId);
    if (row && row._due > 0) {
      amtEl.value = row._due;
      if (rateEl) rateEl.value = num(s.rate) || Biz.rate();
      kgEl.value = round1(row._due / (num(s.rate) || payRate()));
      rateHint();
    }
  }
  preview();

  const save = (printAfter) => {
    const amount = round2(num(amtEl.value));
    const kg = round1(num(kgEl.value));
    if (amount <= 0 && kg <= 0) return toast('Amount ya KG enter karein', 'error');
    const res = Biz.collectPayment({
      customerId: cid,
      amount: mode === 'kg' ? 0 : amount,
      kg: mode === 'kg' ? kg : null,
      rate: payRate(),
      date: $('#pfDate', w).value || todayISO(),
      mode: $('#pfMode', w).value,
      ref: $('#pfRef', w).value,
      note: $('#pfNote', w).value
    });
    if (!res.ok) return toast(res.msg, 'error');
    const shownKg = mode === 'kg' ? kg : (res.totalKg || round1(amount / payRate()));
    toast('✔ ' + fmtMoney(res.totalAmount) + ' (' + fmtKg(shownKg) + ') receive ho gaya · Balance ' + fmtMoney(res.balance), 'success', 4200);
    closeModal(w);
    if (printAfter) printPaymentReceipt(res.records[0] ? res.records[0].id : null, res);
    refreshCurrent();
  };
  $('#pfSave', w).onclick = () => save(false);
  $('#pfSavePrint', w).onclick = () => save(true);
}

/* ============================================================
   PAYMENT RECEIPT PRINT
   ============================================================ */
function printPaymentReceipt(paymentId, res) {
  const shop = DB.settings();
  const p = paymentId ? DB.get('payments', paymentId) : null;
  const cid = p ? p.customerId : (res && res.records[0] ? res.records[0].customerId : '');
  const acc = Biz.customerAccount(cid);
  const payRateShown = num(p && p.rate) || num(res && res.records[0] && res.records[0].rate) || Biz.rate();
  const paper = printSizeFor('receipt');
  const body = `
    ${printSlipHeader(shop, 'PAYMENT RECEIPT')}
    <div class="pr-title">PAYMENT RECEIPT</div>
    <div class="pr-meta">
      <div><b>${esc(Biz.customerName(cid))}</b><br>${esc((DB.get('customers', cid) || {}).phone || '')}</div>
      <div style="text-align:right">Receipt No: <b>${esc(p ? (p.no || '') : '')}</b><br>Date: <b>${fmtDate(p ? p.date : todayISO())}</b><br>
        Mode: <b>${esc(p ? p.mode : '')}</b></div>
    </div>
    <table class="pr-tot">
      <tr><td>Amount Received</td><td class="r"><b>${fmtMoney(p ? p.amount : (res ? res.totalAmount : 0))}</b></td></tr>
      <tr><td>Equivalent Wash KG @ ${fmtMoney(payRateShown)}/kg</td><td class="r"><b>${fmtKg(res ? res.totalKg : (p ? p.kgCovered : 0))}</b></td></tr>
      <tr><td>Total Wash Received (all time)</td><td class="r">${fmtKg(acc.kgTotal)}</td></tr>
      <tr><td>Total Paid (all time)</td><td class="r">${fmtMoney(acc.paid)} = ${fmtKg(acc.kgPaid)}</td></tr>
      <tr class="grand"><td>BALANCE DUE (${fmtKg(acc.kgBalance)})</td><td class="r">${fmtMoney(acc.balance)}</td></tr>
      ${acc.advance > 0 ? `<tr><td>Advance / extra received</td><td class="r">${fmtMoney(acc.advance)}</td></tr>` : ''}
    </table>
    ${res && res.appliedTo && res.appliedTo.length ? `
      <table class="pr-tbl" style="margin-top:10px"><thead><tr><th>Invoice</th><th class="r">Pehle due</th><th class="r">Ye payment</th><th class="r">Baqi</th></tr></thead>
      <tbody>${res.appliedTo.map(a => `<tr><td>${esc(a.saleNo)}</td>
        <td class="r">${fmtMoney(a.prevDueAmt)} <span class="small">(${fmtKg(a.prevDueKg)})</span></td>
        <td class="r">${fmtMoney(a.amount)} <span class="small">(${fmtKg(a.kg)})</span></td>
        <td class="r">${fmtMoney(round2(a.prevDueAmt - a.amount))}</td></tr>`).join('')}</tbody></table>` : ''}
    <div class="words">Amount in words: <b>${esc(amountInWords(p ? p.amount : (res ? res.totalAmount : 0)))}</b></div>
    <div class="pr-foot"><div class="small">Shukriya! Baqi balance ka hisaab agle bill mein continue hoga.</div>
      <div class="sign">Received By</div></div>`;
  printHTML('Receipt', body, { size: paper });
}

/* ============================================================
   WEEKLY / CUSTOM-DATE CONSOLIDATED INVOICE
   ============================================================ */
function openWeeklyInvoice(customerId) {
  const c = DB.get('customers', customerId);
  const defFrom = addDays(todayISO(), -6);
  const body = `
    <div class="note-box info tiny mb10">Ek hafte (ya kisi bhi date range) ki saari wash entries ka consolidated bill — KG, rate, total aur balance ke sath.</div>
    <div class="grid g3">
      <label class="fld"><span>From</span><input type="date" class="inp" id="wkFrom" value="${defFrom}"/></label>
      <label class="fld"><span>To</span><input type="date" class="inp" id="wkTo" value="${todayISO()}"/></label>
      <label class="fld"><span>Rate / KG</span><input type="number" class="inp" id="wkRate" value="${Biz.rate()}"/></label>
    </div>
    <label class="row small" style="gap:8px"><input type="checkbox" id="wkPrev" checked/> Purana balance bhi include karein</label>
    <label class="row small mt6" style="gap:8px"><input type="checkbox" id="wkPays" checked/> Is arse ki payments bhi show karein</label>
    <div id="wkPreview" class="mt14"></div>`;

  const w = openModal({
    title: '🗓️ Weekly / Range Invoice — ' + c.name, size: 'lg', body,
    footer: `<button class="btn btn-ghost" data-close="1">Cancel</button>
             <button class="btn btn-ghost" id="wkThermal">🧾 Thermal</button>
             <button class="btn btn-primary" id="wkPrint">🖨️ Print Invoice</button>`
  });

  function compute() {
    const from = $('#wkFrom', w).value, to = $('#wkTo', w).value, rate = num($('#wkRate', w).value) || Biz.rate();
    const sales = Biz.sales().filter(s => s.customerId === customerId && s.entryDate >= from && s.entryDate <= to)
      .sort((a, b) => String(a.entryDate).localeCompare(String(b.entryDate)));
    const pays = Biz.payments().filter(p => p.customerId === customerId && p.date >= from && p.date <= to);
    const kg = round1(sales.reduce((a, s) => a + Biz.saleKg(s), 0));
    const amount = round2(kg * rate);
    const acc = Biz.customerAccount(customerId);
    const paid = round2(pays.reduce((a, p) => a + num(p.amount), 0));
    return { from, to, rate, sales, pays, kg, amount, acc, paid };
  }

  function paint() {
    const v = compute();
    $('#wkPreview', w).innerHTML = `
      <div class="kv"><span>Entries in range</span><b>${v.sales.length}</b></div>
      <div class="kv"><span>Total KG</span><b>${fmtKg(v.kg)}</b></div>
      <div class="kv"><span>Rate</span><b>${fmtMoney(v.rate)} / kg</b></div>
      <div class="kv total"><span>Range Amount</span><b>${fmtMoney(v.amount)}</b></div>
      <div class="kv"><span>Purana balance (is range se pehle)</span><b>${fmtMoney(round2(v.acc.balance - (v.acc.saleRows.filter(s => s.entryDate >= v.from && s.entryDate <= v.to).reduce((a, s) => a + s._due, 0))))}</b></div>
      <div class="kv"><span>Is range mein received</span><b class="t-ok">${fmtMoney(v.paid)}</b></div>
      <div class="kv"><span>Account balance (live)</span><b class="${v.acc.balance > 0.009 ? 't-bad' : 't-ok'}">${fmtMoney(v.acc.balance)} (${fmtKg(v.acc.kgBalance)})</b></div>
      <div class="tbl-wrap mt10"><table class="tbl" style="min-width:520px">
        <thead><tr><th>Invoice</th><th>Date</th><th class="t-right">KG</th><th class="t-right">Amount</th></tr></thead>
        <tbody>${v.sales.length ? v.sales.map(s => `<tr><td>${esc(s.invoiceNo)}</td><td>${fmtDate(s.entryDate)}</td>
          <td class="t-right">${fmtKg(s.kgTotal)}</td><td class="t-right">${fmtMoney(round2(Biz.saleKg(s) * v.rate))}</td></tr>`).join('')
        : emptyRow(4, 'Is range mein koi entry nahi', '📭')}</tbody>
      </table></div>`;
  }
  ['wkFrom', 'wkTo', 'wkRate'].forEach(id => { const e = $('#' + id, w); if (e) e.onchange = paint; });
  paint();

  const doPrint = (size) => {
    const v = compute();
    const shop = DB.settings();
    const prevBal = round2(v.acc.balance - v.acc.saleRows.filter(s => s.entryDate >= v.from && s.entryDate <= v.to).reduce((a, s) => a + s._due, 0));
    const prevKg = round1(v.acc.kgBalance - v.acc.saleRows.filter(s => s.entryDate >= v.from && s.entryDate <= v.to).reduce((a, s) => a + s._kgDue, 0));
    const includePrev = $('#wkPrev', w).checked;
    const includePays = $('#wkPays', w).checked;
    const totalPayable = round2(v.amount + (includePrev ? prevBal : 0));
    const netDue = round2(v.acc.balance);
    const bodyHtml = `
      ${printHeader(shop, 'WEEKLY INVOICE')}
      <div class="pr-title">CONSOLIDATED WASH INVOICE (PER KG)</div>
      <div class="pr-meta">
        <div><b>Bill To:</b><br>${esc(c.name)}<br>${esc(c.phone || '')}<br>${esc(c.address || '')}</div>
        <div style="text-align:right">Period: <b>${fmtDate(v.from)} → ${fmtDate(v.to)}</b><br>
          Invoice Date: <b>${fmtDate(todayISO())}</b><br>Rate: <b>${fmtMoney(v.rate)} / KG</b></div>
      </div>
      <table class="pr-tbl">
        <thead><tr><th style="width:26px">#</th><th>Invoice No</th><th class="c">Invoice Date</th><th class="c">Delivery Date</th>
          <th>Items</th><th class="r">KG</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead>
        <tbody>${v.sales.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.invoiceNo)}</td>
          <td class="c">${fmtDate(s.entryDate)}</td><td class="c">${s.deliveryDate ? fmtDate(s.deliveryDate) : '—'}</td>
          <td class="small">${esc(Biz.saleItemsSummary(s))}</td>
          <td class="r">${fmtNum(s.kgTotal, 1)}</td><td class="r">${fmtNum(v.rate)}</td>
          <td class="r">${fmtNum(round2(Biz.saleKg(s) * v.rate))}</td></tr>`).join('')}</tbody>
      </table>
      <table class="pr-tot">
        <tr><td>Total Weight (is period)</td><td class="r"><b>${fmtKg(v.kg)}</b></td></tr>
        <tr><td>Wash Charges @ ${fmtMoney(v.rate)}/KG</td><td class="r"><b>${fmtMoney(v.amount)}</b></td></tr>
        ${includePrev && prevBal > 0.009 ? `<tr><td>Previous Balance (${fmtKg(prevKg)})</td><td class="r">${fmtMoney(prevBal)}</td></tr>` : ''}
        <tr class="grand"><td>TOTAL PAYABLE</td><td class="r">${fmtMoney(totalPayable)}</td></tr>
      </table>
      ${includePays ? `<table class="pr-tbl" style="margin-top:10px"><thead><tr><th>Payments received (is period)</th><th class="c">Date</th><th class="r">Amount</th><th class="r">KG covered</th></tr></thead>
        <tbody>${v.pays.length ? v.pays.map(p => `<tr><td>${esc(p.no || '')}</td><td class="c">${fmtDate(p.date)}</td>
          <td class="r">${fmtNum(p.amount)}</td><td class="r">${fmtNum(p.kgCovered, 1)}</td></tr>`).join('')
        : '<tr><td colspan="4" class="c">Koi payment nahi aayi</td></tr>'}
        <tr><td><b>Total Received</b></td><td></td><td class="r"><b>${fmtNum(v.paid)}</b></td><td class="r"><b>${fmtNum(round1(v.paid / v.rate), 1)}</b></td></tr></tbody></table>` : ''}
      <table class="pr-tot">
        <tr><td>Total KG Received (all time)</td><td class="r">${fmtKg(v.acc.kgTotal)}</td></tr>
        <tr><td>Total Paid till date</td><td class="r">${fmtMoney(v.acc.paid)} = ${fmtKg(v.acc.kgPaid)}</td></tr>
        <tr class="grand"><td>NET BALANCE DUE — ${fmtKg(v.acc.kgBalance)} ka hisaab</td><td class="r">${fmtMoney(netDue)}</td></tr>
      </table>
      <div class="words">Amount in words: <b>${esc(amountInWords(netDue > 0 ? netDue : totalPayable))}</b></div>
      <div class="pr-foot"><div class="small">${esc(shop.invoiceTerms || '')}</div><div class="sign">Authorised Signature</div></div>`;
    printHTML('Weekly Invoice ' + c.name, bodyHtml, { size: size || 'a4' });
  };
  $('#wkPrint', w).onclick = () => doPrint('a4');
  $('#wkThermal', w).onclick = () => doPrint('thermal');
}

</script>

<!-- assets/js/pages/products.js -->
<script>
/* ============================================================
   PRODUCTS — wash items (New Sales mein yeh list click hoti hai)
   ============================================================ */

const ProdUI = { cat: 'all', q: '', showInactive: false };

function renderProducts() {
  UI.renderLayout('products', `<div id="prodBody"></div>`);
  productsPaint();
}

/** 🧩 Types editor — kisi bhi item ke types yahan se manage karein */
function productTypesForm(pid) {
  const p = DB.get('products', pid);
  if (!p) return;
  const body = `
    <div class="note-box info tiny mb10">
      <b>${esc(p.name)}</b> ke types — jaise <i>Junior Shoes, Sports Shoes, Man Shoes, CH Shoes</i>.<br>
      New Sales ke <b>Step 03</b> mein yeh types KG ke sath dikhte hain (aur cashier wahin se naye type bhi add kar sakta hai).
    </div>
    <label class="fld"><span>Types (comma se alag, ya har type nayi line mein)</span>
      <textarea class="inp" id="ptList" style="min-height:110px" placeholder="Junior Shoes, Sports Shoes, Man Shoes, CH Shoes">${esc(((p.types) || []).join(', '))}</textarea></label>
    <div class="row" style="gap:6px;flex-wrap:wrap">
      ${['Junior', 'Sports', 'Man', 'CH', 'Kids', 'Ladies', 'Gents'].map(t => `<button class="btn btn-ghost btn-xs" data-ptquick="${t}">+ ${t}</button>`).join('')}
    </div>
    <div class="fld-hint">Buttons se naam add ho jata hai — phir apne hisaab se badal sakte hain.</div>`;
  const w = openModal({
    title: '🧩 Types — ' + p.name, size: 'sm', body,
    footer: `<button class="btn btn-ghost" data-close="1">Cancel</button>
             <button class="btn btn-primary" id="ptSave">💾 Save Types</button>`
  });
  const ta = $('#ptList', w);
  $$('[data-ptquick]', w).forEach(b => b.onclick = () => {
    const cur = ta.value.split(/[,\n]/).map(x => x.trim()).filter(Boolean);
    if (cur.indexOf(b.dataset.ptquick) < 0) cur.push(b.dataset.ptquick);
    ta.value = cur.join(', ');
    ta.focus();
  });
  $('#ptSave', w).onclick = () => {
    const out = [];
    ta.value.split(/[,\n]/).map(x => x.trim()).filter(Boolean).forEach(x => { if (out.indexOf(x) < 0) out.push(x); });
    DB.upsert('products', Object.assign({}, p, { types: out }));
    DB.audit('product', 'Types update: ' + p.name + ' → ' + out.join(', '));
    toast('✔ ' + p.name + ' ke types save ho gaye (' + out.length + ')', 'success');
    closeModal(w);
    productsPaint();
  };
}

function productsPaint() {
  const el = $('#prodBody');
  if (!el) return;
  let rows = DB.all('products').filter(p => ProdUI.showInactive || p.active !== false);
  const q = ProdUI.q.trim().toLowerCase();
  if (q) rows = rows.filter(p => (p.name || '').toLowerCase().includes(q));
  rows.sort((a, b) => String(a.name).localeCompare(String(b.name)));

  const sales = Biz.sales();
  const usage = {};
  sales.forEach(s => (s.lines || []).forEach(l => {
    usage[l.productId] = usage[l.productId] || { kg: 0, count: 0 };
    usage[l.productId].kg = round1(usage[l.productId].kg + num(l.qtyKg));
    usage[l.productId].count++;
  }));

  el.innerHTML = `
    <div class="stats">
      ${UI.statCard({ icon: '🧺', label: 'Total Products', value: fmtNum(rows.length), tone: 'info' })}
      ${UI.statCard({ icon: '⚖️', label: 'Rate / KG (sab items)', value: fmtMoney(Biz.rate()), tone: 'purple', foot: 'Settings se change karein' })}
      ${UI.statCard({ icon: '✅', label: 'Active Items', value: fmtNum(rows.filter(p => p.active !== false).length), tone: 'good' })}
    </div>

    <div class="card">
      <div class="card-head">
        <h3>🧺 Product List — New Sales mein yahi items click hote hain</h3><div class="sp"></div>
        <button class="btn btn-warn btn-sm" id="pRateBtn" title="Per KG rate edit karein">⚖️ Rate: ${fmtMoney(Biz.rate())}/kg ✏️ Edit</button>
        <input class="inp inp-sm" id="pSearch" placeholder="🔍 Item ka naam" value="${esc(ProdUI.q)}" style="width:190px"/>
        <label class="row small dim" style="gap:6px;font-weight:700"><input type="checkbox" id="pInact" ${ProdUI.showInactive ? 'checked' : ''}/> Inactive bhi</label>
        <button class="btn btn-ghost btn-sm" id="pExport">⬇️ CSV</button>
        <button class="btn btn-primary btn-sm" id="pNew">➕ New Product</button>
      </div>
      <div class="tbl-wrap">
        <table class="tbl" style="min-width:820px">
          <thead><tr>
            <th>Item Name</th><th>Types (Step 03)</th><th class="t-right">Rate</th>
            <th class="t-right">Wash KG (all time)</th><th class="t-center">Times Used</th><th class="t-center">Status</th>
            <th class="t-center">Actions</th>
          </tr></thead>
          <tbody>${rows.length ? rows.map(p => `<tr>
            <td class="t-strong">${esc(p.name)}${p.note ? '<div class="tiny muted">' + esc(p.note) + '</div>' : ''}</td>
            <td class="tiny">${(p.types && p.types.length)
      ? p.types.map(t => `<span class="tag" style="margin:1px 2px">${esc(t)}</span>`).join('')
      : '<span class="muted">—</span>'}
              <button class="icon-btn" style="width:24px;height:24px;font-size:10px;vertical-align:middle" data-ptypes="${p.id}" title="Types edit karein">🧩</button></td>
            <td class="t-right">${fmtMoney(Biz.rate())}</td>
            <td class="t-right">${fmtKg((usage[p.id] || {}).kg || 0)}</td>
            <td class="t-center">${fmtNum((usage[p.id] || {}).count || 0)}</td>
            <td class="t-center">${p.active === false ? '<span class="pill pill-muted">Inactive</span>' : '<span class="pill pill-ok">Active</span>'}</td>
            <td class="t-center t-nowrap">
              <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-pedit="${p.id}" title="Edit">✏️</button>
              <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-ptoggle="${p.id}" title="Active/Inactive">${p.active === false ? '✅' : '🚫'}</button>
              <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-pdel="${p.id}" title="Delete">🗑️</button>
            </td>
          </tr>`).join('') : emptyRow(7, 'Koi product nahi — “New Product” se add karein', '🧺')}</tbody>
        </table>
      </div>
    </div>

    <div class="card"><div class="card-body">
      <div class="note-box info tiny">
        <b>Types (Step 03):</b> har item ke chhote types (jaise Shoes → <i>Junior / Sports / Man / CH</i>) yahan se set karein —
        New Sales ke <b>Step 03</b> mein yeh KG ke sath khud nazar aayenge. Cashier wahin naya type bhi add kar sakta hai
        (khud isi list mein save ho jata hai).<br>
        <b>Kaise kaam karta hai:</b> New Sales page par in tamam items ke chips ek hi jagah dikhte hain.
        Cashier item par click karta hai aur KG enter karke “Add to Slip” dabata hai — item invoice mein aa jata hai.
        Billing sab ka <b>ek hi rate</b> (${fmtMoney(Biz.rate())} per KG) hota hai, jo Settings se change karein.
      </div>
    </div></div>`;

  const sq = $('#pSearch'); if (sq) sq.oninput = debounce(e => { ProdUI.q = e.target.value; productsPaint(); }, 250);
  const si = $('#pInact'); if (si) si.onchange = e => { ProdUI.showInactive = e.target.checked; productsPaint(); };
  const rb = $('#pRateBtn'); if (rb) rb.onclick = () => openRateForm();
  $('#pNew').onclick = () => productForm();
  $('#pExport').onclick = () => exportCSV('products.csv', ['Name', 'Types', 'Rate', 'Total KG', 'Times Used', 'Active'],
    rows.map(p => [p.name, (p.types || []).join(' | '), Biz.rate(), (usage[p.id] || {}).kg || 0, (usage[p.id] || {}).count || 0, p.active !== false]));

  $$('[data-pedit]', el).forEach(b => b.onclick = () => productForm(b.dataset.pedit));
  $$('[data-ptypes]', el).forEach(b => b.onclick = () => productTypesForm(b.dataset.ptypes));
  $$('[data-ptoggle]', el).forEach(b => b.onclick = () => {
    const p = DB.get('products', b.dataset.ptoggle);
    DB.upsert('products', Object.assign({}, p, { active: p.active === false }));
    productsPaint();
  });
  $$('[data-pdel]', el).forEach(b => b.onclick = async () => {
    const p = DB.get('products', b.dataset.pdel);
    const yes = await confirmDialog('“' + p.name + '” delete karein? Purane invoices par asar nahi hoga.', { danger: true, yes: 'Delete' });
    if (!yes) return;
    DB.remove('products', p.id);
    DB.audit('product-delete', 'Product delete: ' + p.name);
    toast('Product delete ho gaya', 'warn');
    productsPaint();
  });
}

/* productForm(existingIdOrProduct) → Promise<product|null> */
function productForm(idOrProd) {
  return new Promise(resolve => {
    const p = (idOrProd && typeof idOrProd === 'object') ? idOrProd : (idOrProd ? DB.get('products', idOrProd) : null);
    const body = `
      <div class="grid g2">
        <label class="fld"><span>Item Name <b class="req">*</b></span>
          <input class="inp" id="prName" value="${esc(p ? p.name : '')}" placeholder="e.g. Wash & Fold / Bedsheet Wash"/></label>
        <label class="fld"><span>Status</span>
          <select class="inp" id="prActive">
            <option value="1" ${!p || p.active !== false ? 'selected' : ''}>Active (New Sales mein dikhega)</option>
            <option value="0" ${p && p.active === false ? 'selected' : ''}>Inactive</option>
          </select></label>
      </div>
      <label class="fld"><span>Types / Breakup (comma se alag — optional)</span>
        <input class="inp" id="prTypes" value="${esc(((p && p.types) || []).join(', '))}" placeholder="Junior Shoes, Sports Shoes, Man Shoes, CH Shoes"/>
        <div class="fld-hint">New Sales ke <b>Step 03</b> mein yeh types KG ke sath dikhte hain. Cashier wahin se bhi naya type add kar sakta hai.</div></label>
      <label class="fld"><span>Note (optional)</span><input class="inp" id="prNote" value="${esc(p ? p.note : '')}" placeholder="e.g. sirf heavy kapron ke liye"/></label>
      <div class="note-box info tiny">Billing rate sab items ke liye ek hi hai — <b>${fmtMoney(Biz.rate())} / KG</b> (Settings → Per KG Rate).</div>`;

    const w = openModal({
      title: p ? '✏️ Edit Product' : '➕ New Product', size: 'sm', body,
      footer: `<button class="btn btn-ghost" data-close="1">Cancel</button>
               <button class="btn btn-primary" id="prSave">💾 ${p ? 'Save' : 'Add Product'}</button>`,
      onMount: m => m.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => setTimeout(() => resolve(null), 10)))
    });
    setTimeout(() => { const n = $('#prName', w); if (n) n.focus(); }, 120);

    $('#prSave', w).onclick = () => {
      const name = $('#prName', w).value.trim();
      if (!name) return toast('Item ka naam likhein', 'error');
      const rec = {
        id: p ? p.id : uid('prd'),
        name, category: (p && p.category) || '', inputType: 'kg',
        types: (function (v) {
          const out = [];
          String(v || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean).forEach(x => { if (out.indexOf(x) < 0) out.push(x); });
          return out;
        })($('#prTypes', w).value),
        active: $('#prActive', w).value === '1', note: $('#prNote', w).value,
        createdAt: p ? p.createdAt : new Date().toISOString()
      };
      DB.upsert('products', rec);
      DB.audit(p ? 'product-edit' : 'product', (p ? 'Product edit: ' : 'Naya product: ') + name);
      toast('✔ ' + name + ' ' + (p ? 'update' : 'add') + ' ho gaya', 'success');
      closeModal(w);
      resolve(rec);
      if (app.current === 'products') productsPaint();
    };
  });
}

</script>

<!-- assets/js/pages/expenses.js -->
<script>
/* ============================================================
   EXPENSES — factory ke kharchay (salary, fuel, chemicals…)
   ============================================================ */

function renderExpenses() {
  UI.renderLayout('expenses', `<div id="expBody"></div>`);
  expensesPaint();
}

function expensesPaint() {
  const el = $('#expBody');
  if (!el) return;
  const rows = Biz.expensesIn(Period).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const total = round2(rows.reduce((a, e) => a + num(e.amount), 0));
  const byCat = {};
  rows.forEach(e => { byCat[e.category] = round2((byCat[e.category] || 0) + num(e.amount)); });
  const catRows = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]);

  el.innerHTML = `
    ${Period.bar()}
    <div class="stats">
      ${UI.statCard({ icon: '💸', label: 'Expenses — ' + Period.shortLabel(), value: fmtMoney(total), foot: rows.length + ' entries', tone: 'bad' })}
      ${UI.statCard({ icon: '📅', label: 'Aaj ka kharcha', value: fmtMoney(round2(Biz.expensesIn({ match: d => d === todayISO() }).reduce((a, e) => a + num(e.amount), 0))), tone: 'warn' })}
      ${UI.statCard({ icon: '📈', label: 'Is mahine ka', value: fmtMoney(round2(Biz.expensesIn({ match: d => String(d).slice(0, 7) === monthKey(todayISO()) }).reduce((a, e) => a + num(e.amount), 0))), tone: 'info' })}
      ${UI.statCard({ icon: '🏷️', label: 'Sab se bara kharcha', value: catRows.length ? esc(catRows[0]) : '—', foot: catRows.length ? fmtMoney(byCat[catRows[0]]) : '', tone: 'purple' })}
    </div>

    <div class="grid g-2-1">
      <div class="card">
        <div class="card-head"><h3>💸 Expense Records</h3><div class="sp"></div>
          <button class="btn btn-ghost btn-sm" id="eExport">⬇️ CSV</button>
          <button class="btn btn-primary btn-sm" id="eNew">➕ Add Expense</button></div>
        <div class="tbl-wrap">
          <table class="tbl" style="min-width:780px">
            <thead><tr><th>Date</th><th>Voucher</th><th>Category</th><th>Paid To</th><th>Mode</th>
              <th>Note</th><th class="t-right">Amount</th><th class="t-center">Actions</th></tr></thead>
            <tbody>${rows.length ? rows.map(e => `<tr>
              <td class="t-nowrap">${fmtDate(e.date)}</td>
              <td class="tiny">${esc(e.no || '')}</td>
              <td><span class="tag">${esc(e.category || '')}</span></td>
              <td class="tiny">${esc(e.paidTo || '—')}</td>
              <td class="tiny">${esc(e.mode || '')}</td>
              <td class="tiny">${esc(e.note || '')}</td>
              <td class="t-right t-bad"><b>${fmtMoney(e.amount)}</b></td>
              <td class="t-center t-nowrap">
                <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-eedit="${e.id}">✏️</button>
                <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-edel="${e.id}">🗑️</button></td>
            </tr>`).join('') : emptyRow(8, 'Is period mein koi kharcha nahi', '💤')}</tbody>
            ${rows.length ? `<tfoot><tr><td colspan="6">TOTAL</td><td class="t-right">${fmtMoney(total)}</td><td></td></tr></tfoot>` : ''}
          </table>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="card-head"><h3>📊 Category-wise (${esc(Period.shortLabel())})</h3></div>
          <div class="card-body">
            ${catRows.length ? UI.progressRows(catRows.map(c => ({
    label: c, value: byCat[c], color: '#ef4444',
    note: fmtMoney(byCat[c]) + ' · ' + Math.round(byCat[c] / (total || 1) * 100) + '%'
  }))) : '<div class="empty"><div class="empty-ico">📊</div><div>Koi data nahi</div></div>'}
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>⚡ Quick Add</h3></div>
          <div class="card-body">
            <div class="quick-menu">
              ${(DB.settings().expenseCategories || []).slice(0, 8).map(c => `<button class="qm-item" data-quick="${esc(c)}">➕ ${esc(c)}</button>`).join('')}
            </div>
          </div>
        </div>
      </div>
    </div>`;

  Period.bind(el, expensesPaint);
  $('#eNew').onclick = () => openExpenseForm();
  $('#eExport').onclick = () => exportCSV('expenses-' + Period.shortLabel().replace(/\s/g, '') + '.csv',
    ['Date', 'Voucher', 'Category', 'Paid To', 'Mode', 'Note', 'Amount'],
    rows.map(e => [e.date, e.no, e.category, e.paidTo, e.mode, e.note, e.amount]));
  $$('[data-quick]', el).forEach(b => b.onclick = () => openExpenseForm(null, b.dataset.quick));
  $$('[data-eedit]', el).forEach(b => b.onclick = () => openExpenseForm(b.dataset.eedit));
  $$('[data-edel]', el).forEach(b => b.onclick = async () => {
    const e = DB.get('expenses', b.dataset.edel);
    const yes = await confirmDialog('Expense ' + fmtMoney(e.amount) + ' (' + e.category + ') delete karein?', { danger: true, yes: 'Delete' });
    if (!yes) return;
    DB.remove('expenses', e.id);
    DB.audit('expense-delete', 'Expense delete: ' + e.category + ' ' + fmtMoney(e.amount));
    toast('Expense delete ho gaya', 'warn');
    expensesPaint();
  });
}

function openExpenseForm(id, defaultCat) {
  const e = id ? DB.get('expenses', id) : null;
  const cats = DB.settings().expenseCategories || [];
  const body = `
    <div class="grid g2">
      <label class="fld"><span>Date <b class="req">*</b></span><input type="date" class="inp" id="exDate" value="${esc(e ? e.date : todayISO())}"/></label>
      <label class="fld"><span>Category <b class="req">*</b></span>
        <select class="inp" id="exCat">${cats.map(c => `<option ${((e ? e.category : defaultCat) === c) ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
    </div>
    <div class="grid g3">
      <label class="fld"><span>Amount (Rs) <b class="req">*</b></span><input type="number" step="1" class="inp" id="exAmt" value="${e ? e.amount : ''}" placeholder="0"/></label>
      <label class="fld"><span>Paid To</span><input class="inp" id="exPaidTo" value="${esc(e ? e.paidTo : '')}" placeholder="Kisko diya"/></label>
      <label class="fld"><span>Mode</span>
        <select class="inp" id="exMode">${['Cash', 'Bank Transfer', 'JazzCash', 'EasyPaisa', 'Cheque', 'Credit'].map(m => `<option ${e && e.mode === m ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
    </div>
    <label class="fld"><span>Branch</span>
      <select class="inp" id="exBranch">${DB.all('branches').map(b => `<option value="${b.id}" ${e && e.branchId === b.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select></label>
    <label class="fld"><span>Note / Details</span><textarea class="inp" id="exNote">${esc(e ? e.note : '')}</textarea></label>`;

  const w = openModal({
    title: e ? '✏️ Edit Expense' : '💸 Add Expense', body,
    footer: `<button class="btn btn-ghost" data-close="1">Cancel</button>
             <button class="btn btn-primary" id="exSave">💾 ${e ? 'Save Changes' : 'Add Expense'}</button>`
  });
  setTimeout(() => { const a = $('#exAmt', w); if (a) a.focus(); }, 120);
  $('#exSave', w).onclick = () => {
    const amt = round2($('#exAmt', w).value);
    if (amt <= 0) return toast('Amount likhein', 'error');
    const rec = {
      id: e ? e.id : uid('exp'),
      no: e ? e.no : DB.nextNumber('expense'),
      date: $('#exDate', w).value || todayISO(),
      category: $('#exCat', w).value,
      amount: amt,
      paidTo: $('#exPaidTo', w).value,
      mode: $('#exMode', w).value,
      branchId: $('#exBranch', w).value,
      note: $('#exNote', w).value,
      createdBy: (DB.currentUser() || {}).name || '',
      createdAt: e ? e.createdAt : new Date().toISOString()
    };
    DB.upsert('expenses', rec);
    DB.audit(e ? 'expense-edit' : 'expense', (e ? 'Expense edit: ' : 'Expense: ') + rec.category + ' ' + fmtMoney(amt) + ' (' + rec.date + ')', { ref: rec.no });
    toast('✔ Expense save ho gaya — ' + fmtMoney(amt), 'success');
    closeModal(w);
    refreshCurrent();
  };
}

</script>

<!-- assets/js/pages/purchases.js -->
<script>
/* ============================================================
   PURCHASES — vendors se khareedari (chemicals, packaging…)
   ============================================================ */

function renderPurchases() {
  UI.renderLayout('purchases', `<div id="purBody"></div>`);
  purchasesPaint();
}

function purchasesPaint() {
  const el = $('#purBody');
  if (!el) return;
  const rows = Biz.purchasesIn(Period).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const total = round2(rows.reduce((a, p) => a + num(p.amount), 0));
  const paid = round2(rows.reduce((a, p) => a + num(p.paid), 0));
  const byVendor = {};
  rows.forEach(p => { byVendor[p.vendorName || Biz.vendorName(p.vendorId)] = round2((byVendor[p.vendorName || Biz.vendorName(p.vendorId)] || 0) + num(p.amount)); });
  const vRows = Object.keys(byVendor).sort((a, b) => byVendor[b] - byVendor[a]);

  el.innerHTML = `
    ${Period.bar()}
    <div class="stats">
      ${UI.statCard({ icon: '🛒', label: 'Purchases — ' + Period.shortLabel(), value: fmtMoney(total), foot: rows.length + ' bills', tone: 'bad' })}
      ${UI.statCard({ icon: '✅', label: 'Paid', value: fmtMoney(paid), tone: 'good' })}
      ${UI.statCard({ icon: '⏳', label: 'Payable to Vendors', value: fmtMoney(round2(total - paid)), tone: 'warn' })}
      ${UI.statCard({ icon: '🏬', label: 'Vendors involved', value: fmtNum(vRows.length), tone: 'info' })}
    </div>

    <div class="grid g-2-1">
      <div class="card">
        <div class="card-head"><h3>🛒 Purchase Bills</h3><div class="sp"></div>
          <button class="btn btn-ghost btn-sm" id="puExport">⬇️ CSV</button>
          <button class="btn btn-primary btn-sm" id="puNew">➕ New Purchase</button></div>
        <div class="tbl-wrap">
          <table class="tbl" style="min-width:840px">
            <thead><tr><th>Date</th><th>Vendor</th><th>Bill No</th><th>Items / Detail</th><th>Category</th>
              <th class="t-right">Amount</th><th class="t-right">Paid</th><th class="t-right">Balance</th><th class="t-center">Actions</th></tr></thead>
            <tbody>${rows.length ? rows.map(p => `<tr>
              <td class="t-nowrap">${fmtDate(p.date)}</td>
              <td>${esc(p.vendorName || Biz.vendorName(p.vendorId))}</td>
              <td class="tiny">${esc(p.billNo || '')}</td>
              <td class="tiny">${esc(p.details || '')}</td>
              <td><span class="tag">${esc(p.category || '')}</span></td>
              <td class="t-right"><b>${fmtMoney(p.amount)}</b></td>
              <td class="t-right t-ok">${fmtMoney(p.paid)}</td>
              <td class="t-right ${num(p.amount) - num(p.paid) > 0.009 ? 't-bad' : 't-ok'}">${fmtMoney(round2(num(p.amount) - num(p.paid)))}</td>
              <td class="t-center t-nowrap">
                <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-pedit="${p.id}">✏️</button>
                <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-pdel="${p.id}">🗑️</button></td>
            </tr>`).join('') : emptyRow(9, 'Is period mein koi purchase nahi', '🛒')}</tbody>
            ${rows.length ? `<tfoot><tr><td colspan="5">TOTAL</td><td class="t-right">${fmtMoney(total)}</td>
              <td class="t-right">${fmtMoney(paid)}</td><td class="t-right">${fmtMoney(round2(total - paid))}</td><td></td></tr></tfoot>` : ''}
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>📊 Vendor-wise (period)</h3></div>
        <div class="card-body">${vRows.length ? UI.progressRows(vRows.map(v => ({
    label: v, value: byVendor[v], color: '#0891b2', note: fmtMoney(byVendor[v])
  }))) : '<div class="empty"><div class="empty-ico">🏬</div><div>Koi data nahi</div></div>'}</div>
      </div>
    </div>`;

  Period.bind(el, purchasesPaint);
  $('#puNew').onclick = () => openPurchaseForm();
  $('#puExport').onclick = () => exportCSV('purchases-' + Period.shortLabel().replace(/\s/g, '') + '.csv',
    ['Date', 'Vendor', 'Bill No', 'Category', 'Details', 'Amount', 'Paid', 'Balance'],
    rows.map(p => [p.date, p.vendorName || Biz.vendorName(p.vendorId), p.billNo, p.category, p.details, p.amount, p.paid, round2(num(p.amount) - num(p.paid))]));
  $$('[data-pedit]', el).forEach(b => b.onclick = () => openPurchaseForm(b.dataset.pedit));
  $$('[data-pdel]', el).forEach(b => b.onclick = async () => {
    const p = DB.get('purchases', b.dataset.pdel);
    const yes = await confirmDialog('Purchase ' + fmtMoney(p.amount) + ' delete karein?', { danger: true, yes: 'Delete' });
    if (!yes) return;
    DB.remove('purchases', p.id);
    DB.audit('purchase-delete', 'Purchase delete: ' + fmtMoney(p.amount));
    toast('Purchase delete ho gaya', 'warn');
    purchasesPaint();
  });
}

function openPurchaseForm(id) {
  const p = id ? DB.get('purchases', id) : null;
  const vendors = DB.all('vendors').sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const cats = DB.settings().purchaseCategories || [];
  const body = `
    <div class="grid g2">
      <label class="fld"><span>Vendor <b class="req">*</b></span>
        <div class="picker">
          <select class="inp" id="puVendor"><option value="">— Select vendor —</option>
            ${vendors.map(v => `<option value="${v.id}" ${p && p.vendorId === v.id ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>
          <button class="btn btn-ghost btn-sm" id="puVendorAdd" title="Naya vendor">➕</button>
        </div></label>
      <label class="fld"><span>Date <b class="req">*</b></span><input type="date" class="inp" id="puDate" value="${esc(p ? p.date : todayISO())}"/></label>
    </div>
    <div class="grid g3">
      <label class="fld"><span>Category</span>
        <select class="inp" id="puCat">${cats.map(c => `<option ${p && p.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
      <label class="fld"><span>Vendor Bill No</span><input class="inp" id="puBill" value="${esc(p ? p.billNo : '')}" placeholder="optional"/></label>
      <label class="fld"><span>Total Amount (Rs) <b class="req">*</b></span><input type="number" step="1" class="inp" id="puAmt" value="${p ? p.amount : ''}"/></label>
    </div>
    <label class="fld"><span>Items / Details</span>
      <input class="inp" id="puDetails" value="${esc(p ? p.details : '')}" placeholder="e.g. 20 kg detergent, 5 litre bleach"/></label>
    <div class="grid g2">
      <label class="fld"><span>Paid Now (Rs)</span><input type="number" step="1" class="inp" id="puPaid" value="${p ? p.paid : ''}"/>
        <div class="fld-hint">Poora credit ho to 0 rakhein — payable mein chala jayega</div></label>
      <label class="fld"><span>Mode</span>
        <select class="inp" id="puMode">${['Cash', 'Bank Transfer', 'JazzCash', 'EasyPaisa', 'Cheque', 'Credit'].map(m => `<option ${p && p.mode === m ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
    </div>`;

  const w = openModal({
    title: p ? '✏️ Edit Purchase' : '🛒 New Purchase', body,
    footer: `<button class="btn btn-ghost" data-close="1">Cancel</button>
             <button class="btn btn-primary" id="puSave">💾 Save</button>`
  });
  $('#puVendorAdd', w).onclick = async () => {
    const v = await vendorForm();
    if (v) {
      const sel = $('#puVendor', w);
      sel.innerHTML = '<option value="">— Select vendor —</option>' + DB.all('vendors').map(x => `<option value="${x.id}" ${x.id === v.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
    }
  };
  $('#puSave', w).onclick = () => {
    const amt = round2($('#puAmt', w).value);
    if (amt <= 0) return toast('Amount likhein', 'error');
    const vendorId = $('#puVendor', w).value;
    const rec = {
      id: p ? p.id : uid('pur'),
      no: p ? p.no : DB.nextNumber('purchase'),
      date: $('#puDate', w).value || todayISO(),
      vendorId, vendorName: vendorId ? Biz.vendorName(vendorId) : 'Cash purchase',
      category: $('#puCat', w).value, billNo: $('#puBill', w).value, details: $('#puDetails', w).value,
      amount: amt, paid: round2($('#puPaid', w).value), mode: $('#puMode', w).value,
      createdBy: (DB.currentUser() || {}).name || '',
      createdAt: p ? p.createdAt : new Date().toISOString()
    };
    DB.upsert('purchases', rec);
    DB.audit(p ? 'purchase-edit' : 'purchase', (p ? 'Purchase edit: ' : 'Purchase: ') + rec.vendorName + ' ' + fmtMoney(amt), { ref: rec.no });
    toast('✔ Purchase save ho gaya', 'success');
    closeModal(w);
    refreshCurrent();
  };
}

</script>

<!-- assets/js/pages/vendors.js -->
<script>
/* ============================================================
   VENDORS — jin se khareedari hoti hai + unki REQUIREMENTS
   (rate quotes / new demands — factory barhne ke sath)
   ============================================================ */

function renderVendors() {
  UI.renderLayout('vendorlist', `<div id="venBody"></div>`);
  vendorsPaint();
}

function vendorsPaint() {
  const el = $('#venBody');
  if (!el) return;
  const rows = DB.all('vendors').sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const stats = rows.map(v => {
    const buys = Biz.purchases().filter(p => p.vendorId === v.id);
    const total = round2(buys.reduce((a, p) => a + num(p.amount), 0));
    const paid = round2(buys.reduce((a, p) => a + num(p.paid), 0));
    const reqs = DB.all('vendorRequests').filter(r => r.vendorId === v.id && r.status !== 'closed');
    return { v, buys: buys.length, total, paid, payable: round2(total - paid), reqs: reqs.length };
  });
  const totalPayable = round2(stats.reduce((a, s) => a + s.payable, 0));
  const openReqs = DB.all('vendorRequests').filter(r => r.status !== 'closed');

  el.innerHTML = `
    <div class="stats">
      ${UI.statCard({ icon: '🏬', label: 'Total Vendors', value: fmtNum(rows.length), tone: 'info' })}
      ${UI.statCard({ icon: '⏳', label: 'Total Payable', value: fmtMoney(totalPayable), tone: totalPayable > 0 ? 'bad' : 'good' })}
      ${UI.statCard({ icon: '📋', label: 'Open Requirements', value: fmtNum(openReqs.length), tone: 'warn', foot: 'naye demands / quotes' })}
      ${UI.statCard({ icon: '🛒', label: 'Purchases (all time)', value: fmtMoney(round2(Biz.purchases().reduce((a, p) => a + num(p.amount), 0))), tone: 'purple' })}
    </div>

    <div class="card">
      <div class="card-head"><h3>🏬 Vendors</h3><div class="sp"></div>
        <button class="btn btn-ghost btn-sm" id="vExport">⬇️ CSV</button>
        <button class="btn btn-primary btn-sm" id="vNew">➕ New Vendor</button></div>
      <div class="tbl-wrap">
        <table class="tbl" style="min-width:880px">
          <thead><tr><th>Vendor</th><th>Contact</th><th>Supplies</th><th class="t-right">Purchases</th><th class="t-right">Paid</th>
            <th class="t-right">Payable</th><th class="t-center">Reqs</th><th class="t-center">Actions</th></tr></thead>
          <tbody>${rows.length ? stats.map(s => `<tr>
            <td class="t-strong">${esc(s.v.name)}${s.v.active === false ? ' <span class="tag">inactive</span>' : ''}
              <div class="tiny muted">${esc(s.v.address || '')}</div></td>
            <td class="tiny">${esc(s.v.phone || '—')}<div class="muted">${esc(s.v.contactPerson || '')}</div></td>
            <td class="tiny">${esc(s.v.supplies || '—')}</td>
            <td class="t-right">${fmtMoney(s.total)}</td>
            <td class="t-right t-ok">${fmtMoney(s.paid)}</td>
            <td class="t-right ${s.payable > 0.009 ? 't-bad' : 't-ok'}"><b>${fmtMoney(s.payable)}</b></td>
            <td class="t-center">${s.reqs ? '<span class="pill pill-warn">' + s.reqs + '</span>' : '<span class="t-muted">—</span>'}</td>
            <td class="t-center t-nowrap">
              <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-vreq="${s.v.id}" title="Requirements">📋</button>
              <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-vbuy="${s.v.id}" title="Purchase entry">🛒</button>
              <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-vedit="${s.v.id}" title="Edit">✏️</button>
              <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-vdel="${s.v.id}" title="Delete">🗑️</button>
            </td>
          </tr>`).join('') : emptyRow(8, 'Koi vendor nahi — “New Vendor” se add karein', '🏬')}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>📋 Vendor Requirements / Rate Quotes</h3><div class="sp"></div>
        <span class="pill pill-info">${openReqs.length} open</span>
        <button class="btn btn-ghost btn-sm" id="reqNew">➕ New Requirement</button></div>
      <div class="tbl-wrap">
        <table class="tbl" style="min-width:900px">
          <thead><tr><th>Date</th><th>Vendor</th><th>Item / Requirement</th><th class="t-right">Qty</th><th class="t-right">Quoted Rate</th>
            <th class="t-right">Est. Amount</th><th class="t-center">Status</th><th>Note</th><th class="t-center">Actions</th></tr></thead>
          <tbody>${openReqs.length ? openReqs.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).map(r => `<tr>
            <td class="t-nowrap">${fmtDate(r.date)}</td>
            <td>${esc(Biz.vendorName(r.vendorId))}</td>
            <td class="t-strong">${esc(r.item || '')}</td>
            <td class="t-right">${fmtNum(r.qty, r.qty % 1 ? 2 : 0)} ${esc(r.unit || '')}</td>
            <td class="t-right">${fmtMoney(r.rate)}</td>
            <td class="t-right">${fmtMoney(round2(num(r.qty) * num(r.rate)))}</td>
            <td class="t-center"><span class="pill ${r.status === 'ordered' ? 'pill-warn' : (r.status === 'received' ? 'pill-ok' : 'pill-info')}">${esc(titleCase(r.status || 'pending'))}</span></td>
            <td class="tiny">${esc(r.note || '')}</td>
            <td class="t-center t-nowrap">
              <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-rnext="${r.id}" title="Next status">➡️</button>
              <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-redit="${r.id}" title="Edit">✏️</button>
              <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-rdel="${r.id}" title="Delete">🗑️</button></td>
          </tr>`).join('') : emptyRow(9, 'Koi open requirement nahi — “New Requirement” se vendor ki nayi demand likhein', '📋')}</tbody>
        </table>
      </div>
    </div>`;

  $('#vNew').onclick = () => vendorForm();
  $('#reqNew').onclick = () => vendorRequestForm();
  $('#vExport').onclick = () => exportCSV('vendors.csv',
    ['Vendor', 'Phone', 'Contact Person', 'Supplies', 'Purchases', 'Paid', 'Payable'],
    stats.map(s => [s.v.name, s.v.phone, s.v.contactPerson, s.v.supplies, s.total, s.paid, s.payable]));
  $$('[data-vreq]', el).forEach(b => b.onclick = () => vendorRequestForm(null, b.dataset.vreq));
  $$('[data-vbuy]', el).forEach(b => b.onclick = () => { app.go('purchases'); setTimeout(() => openPurchaseForm(), 80); });
  $$('[data-vedit]', el).forEach(b => b.onclick = () => vendorForm(b.dataset.vedit));
  $$('[data-vdel]', el).forEach(b => b.onclick = async () => {
    const v = DB.get('vendors', b.dataset.vdel);
    const yes = await confirmDialog('Vendor “' + v.name + '” delete karein?', { danger: true, yes: 'Delete' });
    if (!yes) return;
    DB.remove('vendors', v.id);
    DB.audit('vendor-delete', 'Vendor delete: ' + v.name);
    vendorsPaint();
  });
  $$('[data-redit]', el).forEach(b => b.onclick = () => vendorRequestForm(b.dataset.redit));
  $$('[data-rdel]', el).forEach(b => b.onclick = async () => {
    const r = DB.get('vendorRequests', b.dataset.rdel);
    const yes = await confirmDialog('Requirement “' + r.item + '” delete karein?', { danger: true, yes: 'Delete' });
    if (!yes) return;
    DB.remove('vendorRequests', r.id);
    vendorsPaint();
  });
  $$('[data-rnext]', el).forEach(b => b.onclick = () => {
    const r = DB.get('vendorRequests', b.dataset.rnext);
    const order = ['pending', 'quoted', 'ordered', 'received', 'closed'];
    const nx = order[(order.indexOf(r.status || 'pending') + 1) % order.length];
    DB.upsert('vendorRequests', Object.assign({}, r, { status: nx }));
    toast('Status: ' + titleCase(nx), 'info');
    vendorsPaint();
  });
}

function vendorForm(id) {
  return new Promise(resolve => {
    const v = id ? DB.get('vendors', id) : null;
    const body = `
      <div class="grid g2">
        <label class="fld"><span>Vendor Name <b class="req">*</b></span><input class="inp" id="vfName" value="${esc(v ? v.name : '')}" placeholder="e.g. Al-Karam Chemicals"/></label>
        <label class="fld"><span>Phone</span><input class="inp" id="vfPhone" value="${esc(v ? v.phone : '')}"/></label>
      </div>
      <div class="grid g2">
        <label class="fld"><span>Contact Person</span><input class="inp" id="vfPerson" value="${esc(v ? v.contactPerson : '')}"/></label>
        <label class="fld"><span>Supplies</span><input class="inp" id="vfSupplies" value="${esc(v ? v.supplies : '')}" placeholder="e.g. detergent, bleach, packaging"/></label>
      </div>
      <label class="fld"><span>Address</span><input class="inp" id="vfAddr" value="${esc(v ? v.address : '')}"/></label>
      <label class="fld"><span>Status</span>
        <select class="inp" id="vfActive"><option value="1" ${!v || v.active !== false ? 'selected' : ''}>Active</option>
          <option value="0" ${v && v.active === false ? 'selected' : ''}>Inactive</option></select></label>
      <label class="fld"><span>Note</span><textarea class="inp" id="vfNote">${esc(v ? v.note : '')}</textarea></label>`;
    const w = openModal({
      title: v ? '✏️ Edit Vendor' : '➕ New Vendor', size: 'sm', body,
      footer: `<button class="btn btn-ghost" data-close="1">Cancel</button><button class="btn btn-primary" id="vfSave">💾 Save</button>`,
      onMount: m => m.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => setTimeout(() => resolve(null), 10)))
    });
    $('#vfSave', w).onclick = () => {
      const name = $('#vfName', w).value.trim();
      if (!name) return toast('Vendor ka naam likhein', 'error');
      const rec = {
        id: v ? v.id : uid('ven'), code: v ? v.code : DB.nextNumber('vendor'),
        name, phone: $('#vfPhone', w).value, contactPerson: $('#vfPerson', w).value,
        supplies: $('#vfSupplies', w).value, address: $('#vfAddr', w).value,
        active: $('#vfActive', w).value === '1', note: $('#vfNote', w).value,
        createdAt: v ? v.createdAt : new Date().toISOString()
      };
      DB.upsert('vendors', rec);
      DB.audit(v ? 'vendor-edit' : 'vendor', (v ? 'Vendor edit: ' : 'Naya vendor: ') + name);
      toast('✔ Vendor save ho gaya', 'success');
      closeModal(w);
      resolve(rec);
      if (app.current === 'vendorlist') vendorsPaint();
    };
  });
}

function vendorRequestForm(id, vendorId) {
  const r = id ? DB.get('vendorRequests', id) : null;
  const vendors = DB.all('vendors').sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const body = `
    <div class="grid g2">
      <label class="fld"><span>Vendor <b class="req">*</b></span>
        <select class="inp" id="vrVendor"><option value="">— Select —</option>
          ${vendors.map(v => `<option value="${v.id}" ${((r ? r.vendorId : vendorId) === v.id) ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select></label>
      <label class="fld"><span>Date</span><input type="date" class="inp" id="vrDate" value="${esc(r ? r.date : todayISO())}"/></label>
    </div>
    <label class="fld"><span>Item / Requirement <b class="req">*</b></span>
      <input class="inp" id="vrItem" value="${esc(r ? r.item : '')}" placeholder="e.g. Liquid detergent 20 litre drum"/></label>
    <div class="grid g3">
      <label class="fld"><span>Qty</span><input type="number" step="0.01" class="inp" id="vrQty" value="${r ? r.qty : ''}"/></label>
      <label class="fld"><span>Unit</span><input class="inp" id="vrUnit" value="${esc(r ? r.unit : 'pcs')}" placeholder="kg / litre / pcs"/></label>
      <label class="fld"><span>Quoted Rate</span><input type="number" step="0.01" class="inp" id="vrRate" value="${r ? r.rate : ''}"/></label>
    </div>
    <div class="grid g2">
      <label class="fld"><span>Status</span>
        <select class="inp" id="vrStatus">${['pending', 'quoted', 'ordered', 'received', 'closed'].map(x => `<option ${r && r.status === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
      <label class="fld"><span>Expected Date</span><input type="date" class="inp" id="vrExp" value="${esc(r ? r.expected : '')}"/></label>
    </div>
    <label class="fld"><span>Note</span><textarea class="inp" id="vrNote">${esc(r ? r.note : '')}</textarea></label>`;
  const w = openModal({
    title: r ? '✏️ Edit Requirement' : '📋 Vendor Requirement', body,
    footer: `<button class="btn btn-ghost" data-close="1">Cancel</button><button class="btn btn-primary" id="vrSave">💾 Save</button>`
  });
  $('#vrSave', w).onclick = () => {
    const item = $('#vrItem', w).value.trim();
    if (!item) return toast('Requirement likhein', 'error');
    const rec = {
      id: r ? r.id : uid('req'),
      vendorId: $('#vrVendor', w).value, date: $('#vrDate', w).value || todayISO(),
      item, qty: num($('#vrQty', w).value), unit: $('#vrUnit', w).value, rate: num($('#vrRate', w).value),
      status: $('#vrStatus', w).value, expected: $('#vrExp', w).value, note: $('#vrNote', w).value,
      createdAt: r ? r.createdAt : new Date().toISOString()
    };
    DB.upsert('vendorRequests', rec);
    DB.audit('vendor-req', 'Vendor requirement: ' + item);
    toast('✔ Requirement save ho gayi', 'success');
    closeModal(w);
    if (app.current === 'vendorlist') vendorsPaint();
    // vendor requirements ko cloud/local me rakhne ke liye table ensure
    DB._data.vendorRequests = DB._data.vendorRequests || [];
  };
}

</script>

<!-- assets/js/pages/employees.js -->
<script>
/* ============================================================
   EMPLOYEES & SALARY — factory staff
   ============================================================ */

function renderEmployees() {
  UI.renderLayout('employees', `<div id="empBody"></div>`);
  employeesPaint();
}

function employeesPaint() {
  const el = $('#empBody');
  if (!el) return;
  const emps = DB.all('employees').sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const salaries = DB.all('salaries');
  const mk = monthKey(todayISO());
  const paidThisMonth = round2(salaries.filter(s => monthKey(s.date) === mk).reduce((a, s) => a + num(s.amount), 0));
  const monthlyPayroll = round2(emps.filter(e => e.active !== false).reduce((a, e) => a + num(e.salary), 0));
  const paidIds = salaries.filter(s => s.month === mk).map(s => s.employeeId);

  el.innerHTML = `
    <div class="stats">
      ${UI.statCard({ icon: '👷', label: 'Active Employees', value: fmtNum(emps.filter(e => e.active !== false).length), tone: 'info' })}
      ${UI.statCard({ icon: '💼', label: 'Monthly Payroll', value: fmtMoney(monthlyPayroll), tone: 'purple' })}
      ${UI.statCard({ icon: '✅', label: 'Salary Paid — ' + monthLabel(mk), value: fmtMoney(paidThisMonth), foot: salaries.filter(s => s.month === mk).length + ' employees', tone: 'good' })}
      ${UI.statCard({ icon: '⏳', label: 'Pending — ' + monthLabel(mk), value: fmtNum(emps.filter(e => e.active !== false && paidIds.indexOf(e.id) < 0).length), foot: 'salary baqi', tone: 'warn' })}
    </div>

    <div class="card">
      <div class="card-head"><h3>👷 Employees</h3><div class="sp"></div>
        <button class="btn btn-ghost btn-sm" id="emExport">⬇️ CSV</button>
        <button class="btn btn-primary btn-sm" id="emNew">➕ New Employee</button></div>
      <div class="tbl-wrap">
        <table class="tbl" style="min-width:860px">
          <thead><tr><th>Name</th><th>Role</th><th>Phone</th><th class="t-right">Monthly Salary</th><th>Joined</th>
            <th class="t-center">Is mahine</th><th class="t-center">Status</th><th class="t-center">Actions</th></tr></thead>
          <tbody>${emps.length ? emps.map(e => {
    const paid = salaries.filter(s => s.employeeId === e.id);
    const totalPaid = round2(paid.reduce((a, s) => a + num(s.amount), 0));
    const isPaid = paidIds.indexOf(e.id) >= 0;
    return `<tr>
              <td class="t-strong">${esc(e.name)}<div class="tiny muted">${esc(e.code || '')} · total paid ${fmtMoney(totalPaid)}</div></td>
              <td>${esc(e.role || '')}</td>
              <td class="tiny">${esc(e.phone || '—')}</td>
              <td class="t-right"><b>${fmtMoney(e.salary)}</b></td>
              <td class="t-nowrap tiny">${e.joinDate ? fmtDate(e.joinDate) : '—'}</td>
              <td class="t-center">${isPaid ? '<span class="pill pill-ok">Paid ✔</span>' : '<span class="pill pill-warn">Pending</span>'}</td>
              <td class="t-center">${e.active === false ? '<span class="pill pill-muted">Inactive</span>' : '<span class="pill pill-info">Active</span>'}</td>
              <td class="t-center t-nowrap">
                <button class="btn btn-success btn-xs" data-sal="${e.id}">💵 Salary</button>
                <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-eedit="${e.id}">✏️</button>
                <button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-edel="${e.id}">🗑️</button>
              </td>
            </tr>`;
  }).join('') : emptyRow(8, 'Koi employee nahi — “New Employee” se add karein', '👷')}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>💵 Salary Payment History</h3><div class="sp"></div>
        <button class="btn btn-ghost btn-sm" id="salExport">⬇️ CSV</button></div>
      <div class="tbl-wrap">
        <table class="tbl" style="min-width:820px">
          <thead><tr><th>Date</th><th>Employee</th><th>Month</th><th class="t-right">Salary</th><th class="t-right">Bonus</th>
            <th class="t-right">Deduction</th><th class="t-right">Paid</th><th>Mode</th><th>Note</th><th class="t-center">Actions</th></tr></thead>
          <tbody>${salaries.length ? salaries.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).map(s => `<tr>
            <td class="t-nowrap">${fmtDate(s.date)}</td>
            <td class="t-strong">${esc(Biz.employeeName(s.employeeId))}</td>
            <td class="tiny">${monthLabel(s.month)}</td>
            <td class="t-right">${fmtMoney(s.salary)}</td>
            <td class="t-right t-ok">${s.bonus ? '+' + fmtMoney(s.bonus) : '—'}</td>
            <td class="t-right t-bad">${s.deduction ? '−' + fmtMoney(s.deduction) : '—'}</td>
            <td class="t-right"><b>${fmtMoney(s.amount)}</b></td>
            <td class="tiny">${esc(s.mode || '')}</td>
            <td class="tiny">${esc(s.note || '')}</td>
            <td class="t-center"><button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-saldel="${s.id}">🗑️</button></td>
          </tr>`).join('') : emptyRow(10, 'Abhi koi salary pay nahi hui', '💤')}</tbody>
        </table>
      </div>
    </div>`;

  $('#emNew').onclick = () => employeeForm();
  $('#emExport').onclick = () => exportCSV('employees.csv', ['Code', 'Name', 'Role', 'Phone', 'Salary', 'Join Date', 'Active'],
    emps.map(e => [e.code, e.name, e.role, e.phone, e.salary, e.joinDate, e.active !== false]));
  $('#salExport').onclick = () => exportCSV('salary-payments.csv',
    ['Date', 'Employee', 'Month', 'Salary', 'Bonus', 'Deduction', 'Paid', 'Mode', 'Note'],
    salaries.map(s => [s.date, Biz.employeeName(s.employeeId), s.month, s.salary, s.bonus, s.deduction, s.amount, s.mode, s.note]));
  $$('[data-sal]', el).forEach(b => b.onclick = () => salaryForm(b.dataset.sal));
  $$('[data-eedit]', el).forEach(b => b.onclick = () => employeeForm(b.dataset.eedit));
  $$('[data-edel]', el).forEach(b => b.onclick = async () => {
    const e = DB.get('employees', b.dataset.edel);
    const yes = await confirmDialog('“' + e.name + '” delete karein?', { danger: true, yes: 'Delete' });
    if (!yes) return;
    DB.remove('employees', e.id);
    DB.audit('employee-delete', 'Employee delete: ' + e.name);
    employeesPaint();
  });
  $$('[data-saldel]', el).forEach(b => b.onclick = async () => {
    const s = DB.get('salaries', b.dataset.saldel);
    const yes = await confirmDialog('Salary payment ' + fmtMoney(s.amount) + ' delete karein?', { danger: true, yes: 'Delete' });
    if (!yes) return;
    DB.remove('salaries', s.id);
    toast('Salary record delete ho gaya', 'warn');
    employeesPaint();
  });
}

function employeeForm(id) {
  const e = id ? DB.get('employees', id) : null;
  const body = `
    <div class="grid g2">
      <label class="fld"><span>Name <b class="req">*</b></span><input class="inp" id="efName" value="${esc(e ? e.name : '')}"/></label>
      <label class="fld"><span>Role / Kaam</span><input class="inp" id="efRole" value="${esc(e ? e.role : '')}" placeholder="Washing / Ironing / Packing / Driver"/></label>
    </div>
    <div class="grid g3">
      <label class="fld"><span>Monthly Salary (Rs)</span><input type="number" step="1" class="inp" id="efSalary" value="${e ? e.salary : ''}"/></label>
      <label class="fld"><span>Phone</span><input class="inp" id="efPhone" value="${esc(e ? e.phone : '')}"/></label>
      <label class="fld"><span>Join Date</span><input type="date" class="inp" id="efJoin" value="${esc(e ? e.joinDate : todayISO())}"/></label>
    </div>
    <label class="fld"><span>Status</span>
      <select class="inp" id="efActive"><option value="1" ${!e || e.active !== false ? 'selected' : ''}>Active</option>
        <option value="0" ${e && e.active === false ? 'selected' : ''}>Inactive</option></select></label>
    <label class="fld"><span>Note</span><textarea class="inp" id="efNote">${esc(e ? e.note : '')}</textarea></label>`;
  const w = openModal({
    title: e ? '✏️ Edit Employee' : '➕ New Employee', size: 'sm', body,
    footer: `<button class="btn btn-ghost" data-close="1">Cancel</button><button class="btn btn-primary" id="efSave">💾 Save</button>`
  });
  $('#efSave', w).onclick = () => {
    const name = $('#efName', w).value.trim();
    if (!name) return toast('Naam likhein', 'error');
    const rec = {
      id: e ? e.id : uid('emp'), code: e ? e.code : DB.nextNumber('employee'),
      name, role: $('#efRole', w).value, salary: round2($('#efSalary', w).value), phone: $('#efPhone', w).value,
      joinDate: $('#efJoin', w).value, active: $('#efActive', w).value === '1', note: $('#efNote', w).value,
      createdAt: e ? e.createdAt : new Date().toISOString()
    };
    DB.upsert('employees', rec);
    DB.audit(e ? 'employee-edit' : 'employee', (e ? 'Employee edit: ' : 'Naya employee: ') + name);
    toast('✔ Employee save ho gaya', 'success');
    closeModal(w);
    employeesPaint();
  };
}

function salaryForm(employeeId) {
  const e = DB.get('employees', employeeId);
  if (!e) return;
  const mk = monthKey(todayISO());
  const body = `
    <div class="note-box info tiny mb10"><b>${esc(e.name)}</b> · ${esc(e.role || '')} · Monthly salary <b>${fmtMoney(e.salary)}</b></div>
    <div class="grid g2">
      <label class="fld"><span>Payment Date</span><input type="date" class="inp" id="sfDate" value="${todayISO()}"/></label>
      <label class="fld"><span>Month</span>
        <select class="inp" id="sfMonth">${lastMonths(12).map(m => `<option value="${m}" ${m === mk ? 'selected' : ''}>${monthLabel(m)}</option>`).join('')}</select></label>
    </div>
    <div class="grid g3">
      <label class="fld"><span>Basic Salary</span><input type="number" step="1" class="inp" id="sfSalary" value="${num(e.salary)}"/></label>
      <label class="fld"><span>Bonus</span><input type="number" step="1" class="inp" id="sfBonus" value="0"/></label>
      <label class="fld"><span>Deduction / Advance</span><input type="number" step="1" class="inp" id="sfDed" value="0"/></label>
    </div>
    <div class="kv total"><span>Net Payable</span><b id="sfNet">${fmtMoney(e.salary)}</b></div>
    <div class="grid g2 mt10">
      <label class="fld"><span>Mode</span><select class="inp" id="sfMode">${['Cash', 'Bank Transfer', 'JazzCash', 'EasyPaisa'].map(m => `<option>${m}</option>`).join('')}</select></label>
      <label class="fld"><span>Note</span><input class="inp" id="sfNote" placeholder="optional"/></label>
    </div>`;
  const w = openModal({
    title: '💵 Pay Salary — ' + e.name, size: 'sm', body,
    footer: `<button class="btn btn-ghost" data-close="1">Cancel</button><button class="btn btn-success" id="sfSave">💾 Save Salary Payment</button>`
  });
  const net = () => round2(num($('#sfSalary', w).value) + num($('#sfBonus', w).value) - num($('#sfDed', w).value));
  ['sfSalary', 'sfBonus', 'sfDed'].forEach(id => { $('#' + id, w).oninput = () => { $('#sfNet', w).textContent = fmtMoney(net()); }; });
  $('#sfSave', w).onclick = () => {
    const amt = net();
    if (amt <= 0) return toast('Amount theek karein', 'error');
    const rec = {
      id: uid('sal'), no: DB.nextNumber('salary'), employeeId: e.id, employeeName: e.name,
      date: $('#sfDate', w).value || todayISO(), month: $('#sfMonth', w).value,
      salary: round2($('#sfSalary', w).value), bonus: round2($('#sfBonus', w).value), deduction: round2($('#sfDed', w).value),
      amount: amt, mode: $('#sfMode', w).value, note: $('#sfNote', w).value,
      createdBy: (DB.currentUser() || {}).name || '', createdAt: new Date().toISOString()
    };
    DB.upsert('salaries', rec);
    DB.audit('salary', 'Salary paid: ' + e.name + ' ' + fmtMoney(amt) + ' (' + monthLabel(rec.month) + ')', { ref: rec.no });
    toast('✔ Salary pay ho gayi — ' + fmtMoney(amt), 'success');
    closeModal(w);
    employeesPaint();
  };
}

</script>
