<script>
/* ============================================================
   MR LAUNDRY FACTORY PORTAL — BUSINESS LOGIC
   ------------------------------------------------------------
   • Per-KG wash billing engine
   • Ledger + FIFO payment allocation (kg-wise & amount-wise)
   • Dashboard metrics (received / delivered / in factory / income
     / expenses / profit-loss) for today, month, custom range
   • Reports & series helpers
   ============================================================ */

const Biz = {

  /* ---------- basics ---------- */
  rate() { return num(DB.settings().ratePerKg) || 200; },
  categories() { return DB.settings().categories || DEFAULT_CATEGORIES; },
  catLabel(k) { const c = this.categories().find(x => x.key === k); return c ? c.label : (k || '—') + ' Category'; },
  catColor(k) { const c = this.categories().find(x => x.key === k); return c ? c.color : '#64748b'; },
  catKeys() { return this.categories().map(c => c.key); },

  customer(id) { return DB.get('customers', id); },
  customerName(id) { const c = DB.get('customers', id); return c ? c.name : '—'; },
  branchName(id) { const b = DB.get('branches', id); return b ? b.name : '—'; },
  vendorName(id) { const v = DB.get('vendors', id); return v ? v.name : '—'; },
  employeeName(id) { const e = DB.get('employees', id); return e ? e.name : (id || '—'); },
  product(id) { return DB.get('products', id); },

  /** Amount of a sale = kg total × rate (sale-level rate override allowed) */
  saleRate(s) { return num(s && s.rate) || this.rate(); },
  saleAmount(s) {
    if (s && s.amountManual != null && s.amountManual !== '') return round2(s.amountManual);
    return round2(num(s && s.kgTotal) * this.saleRate(s));
  },
  saleKg(s) { return round1(s && s.kgTotal); },

  /** total KG of one line */
  lineKg(l) { return round1(num(l && l.qtyKg)); },

  /** kitna KG deliver ho chuka hai (partial delivery support) */
  saleDeliveredKg(s) {
    if (!s) return 0;
    const total = num(s.kgTotal);
    if (s.status === 'delivered') return round1(num(s.deliveredKg) || total);
    if (s.status === 'partial') return round1(num(s.deliveredKg));
    return 0;
  },
  pendingKg(s) { return round1(Math.max(0, num(s && s.kgTotal) - this.saleDeliveredKg(s))); },
  pendingPcs(s) { return Math.max(0, num(s && s.piecesTotal) - num(s && s.deliveredPcs)); },

  /** All non-deleted sales */
  sales() { return DB.all('sales').filter(s => s.status !== 'cancelled'); },
  payments() { return DB.all('payments'); },
  expenses() { return DB.all('expenses'); },
  salaries() { return DB.all('salaries'); },
  purchases() { return DB.all('purchases'); },
  drawings() { return DB.all('drawings'); },

  /* ============================================================
     CUSTOMER ACCOUNT — sales, FIFO allocation, ledger rows
     ============================================================ */
  customerAccount(customerId, opt) {
    const o = opt || {};
    const rate = this.rate();
    const sales = this.sales().filter(s => s.customerId === customerId)
      .sort((a, b) => String(a.entryDate).localeCompare(String(b.entryDate)) || String(a.invoiceNo).localeCompare(String(b.invoiceNo)));
    const pays = this.payments().filter(p => p.customerId === customerId)
      .sort((a, b) => String(a.date).localeCompare(String(b.date)));

    // FIFO: payments pool pehle purane sale par lagta hai
    let pool = pays.reduce((s, p) => s + num(p.amount), 0);
    sales.forEach(s => {
      const amt = this.saleAmount(s);
      s._amount = amt;
      s._applied = round2(Math.min(pool, amt));
      pool = round2(pool - s._applied);
      s._due = round2(amt - s._applied);
      const r = this.saleRate(s);
      s._kgApplied = r ? round1(s._applied / r) : 0;
      s._kgDue = r ? round1(s._due / r) : 0;
    });
    const advance = round2(Math.max(0, pool));

    const stats = {
      customerId,
      sales,
      payments: pays,
      count: sales.length,
      kgTotal: round1(sales.reduce((s, x) => s + this.saleKg(x), 0)),
      kgDelivered: round1(sales.reduce((s, x) => s + this.saleDeliveredKg(x), 0)),
      kgInFactory: round1(sales.reduce((s, x) => s + this.pendingKg(x), 0)),
      piecesTotal: sales.reduce((s, x) => s + num(x.piecesTotal), 0),
      piecesDelivered: sales.reduce((s, x) => s + num(x.deliveredPcs), 0),
      amount: round2(sales.reduce((s, x) => s + x._amount, 0)),
      paid: round2(pays.reduce((s, p) => s + num(p.amount), 0)),
      balance: round2(sales.reduce((s, x) => s + x._due, 0)),
      advance,
      kgPaid: 0, kgBalance: 0, rateMix: [], avgRate: 0
    };
    /* KG accounting RATE-AWARE: har bill apne rate par convert hota hai.
       Purane bill Rs.200/kg par, naye Rs.320/kg par — mix ho to bhi theek. */
    stats.kgPaid = round1(sales.reduce((a, x) => a + num(x._kgApplied), 0));
    stats.kgBalance = round1(sales.reduce((a, x) => a + num(x._kgDue), 0));
    const mixMap = {};
    sales.forEach(x => {
      if (num(x._due) <= 0.009) return;
      const r = round2(this.saleRate(x));
      const k = String(r);
      if (!mixMap[k]) mixMap[k] = { rate: r, kg: 0, amount: 0, count: 0, invoiceNo: x.invoiceNo, date: x.entryDate };
      mixMap[k].kg = round1(mixMap[k].kg + num(x._kgDue));
      mixMap[k].amount = round2(mixMap[k].amount + num(x._due));
      mixMap[k].count++;
    });
    stats.rateMix = Object.keys(mixMap).map(k => mixMap[k]).sort((a, b) => b.rate - a.rate);
    stats.avgRate = stats.kgTotal ? round2(stats.amount / stats.kgTotal) : rate;
    stats.outstandingInvoices = sales.filter(x => x._due > 0.009).length;

    // ---- per-sale view for display (uses cached computed fields) ----
    stats.saleRows = sales.map(s => Object.assign({}, s, {
      _applied: s._applied, _due: s._due, _kgApplied: s._kgApplied, _kgDue: s._kgDue, _amount: s._amount
    }));

    // ---- chronological statement (ledger) ----
    const rows = [];
    let kgBal = 0, amtBal = 0;
    const events = [];
    sales.forEach(s => events.push({ d: s.entryDate, t: 'sale', s }));
    pays.forEach(p => events.push({ d: p.date, t: 'pay', p }));
    events.sort((a, b) => String(a.d).localeCompare(String(b.d)) || (a.t === 'sale' ? -1 : 1));

    events.forEach(e => {
      if (e.t === 'sale') {
        const s = e.s;
        const kg = this.saleKg(s), amt = s._amount, r = this.saleRate(s);
        kgBal = round1(kgBal + kg);
        amtBal = round2(amtBal + amt);
        rows.push({
          date: s.entryDate, type: 'sale', ref: s.invoiceNo, kind: 'Wash Received',
          desc: this.saleLinesText(s), kgAdd: kg, kgCut: 0, amount: amt, rate: r,
          kgBal, amtBal, saleId: s.id, deliveryDate: s.deliveryDate || ''
        });
      } else {
        const p = e.p;
        const amt = num(p.amount), r = num(p.rate) || rate;
        /* KG cut: payment record par jo KG cover hui (FIFO, rate-aware) — purana rate ho to wahi */
        const kgCut = amtBal > 0 ? round1(Math.min(kgBal, num(p.kgCovered) || (amt / r))) : 0;
        kgBal = round1(Math.max(0, kgBal - kgCut));
        amtBal = round2(amtBal - amt);
        rows.push({
          date: p.date, type: 'payment', ref: p.no || p.voucherNo || '', kind: 'Payment Received',
          desc: (p.note || '') + (p.mode ? ' · ' + p.mode : ''), kgAdd: 0, kgCut, amount: -amt, rate: r,
          kgBal, amtBal, paymentId: p.id, allocTo: p.saleId || '', advance: p.isAdvance
        });
      }
    });
    stats.ledger = rows;
    return stats;
  },

  /** line ka poora naam: "SHOES — Junior Shoes" (type ho to) */
  lineName(l) {
    const p = l && l.productId ? this.product(l.productId) : null;
    const n = (p ? p.name : (l && l.productName)) || 'Item';
    return (l && l.type) ? n + ' — ' + l.type : n;
  },
  /** ek item ke types (product par saved) */
  productTypes(productId) {
    const p = this.product(productId);
    return (p && Array.isArray(p.types)) ? p.types.filter(Boolean) : [];
  },
  /** naya type naam item par SAVE karein (agli dafa khud nazar aayega). true = naya tha */
  saveProductType(productId, name) {
    name = String(name || '').trim();
    if (!productId || !name) return false;
    const p = this.product(productId);
    if (!p) return false;
    const list = Array.isArray(p.types) ? p.types.slice() : [];
    if (list.indexOf(name) >= 0) return false;
    list.push(name);
    DB.upsert('products', Object.assign({}, p, { types: list }), { silent: true });
    DB.save();
    return true;
  },

  saleLinesText(s) {
    return (s.lines || []).map(l => this.lineName(l) + ' ' + fmtKg(l.qtyKg)).join(' • ');
  },
  saleLinesShort(s) {
    const byCat = {};
    (s.lines || []).forEach(l => { const k = l.category || '-'; byCat[k] = round1((byCat[k] || 0) + num(l.qtyKg)); });
    return Object.keys(byCat).sort().map(k => k + ': ' + fmtKg(byCat[k])).join(' · ') || '—';
  },
  saleItemsSummary(s) {
    const names = [];
    (s.lines || []).forEach(l => {
      const n = this.lineName(l);
      if (names.indexOf(n) < 0) names.push(n);
    });
    return names.join(', ') || '—';
  },
  saleCatKg(s, catKey) {
    return round1((s.lines || []).filter(l => l.category === catKey).reduce((a, l) => a + num(l.qtyKg), 0));
  },

  /* ============================================================
     PAYMENT / COLLECTION
     ============================================================ */
  /** Due sales (oldest first) with computed dues */
  dueSales(customerId) {
    return this.customerAccount(customerId).saleRows.filter(s => s._due > 0.009);
  },

  /**
   * Receive payment. Amount FIFO distribute hota hai:
   *  • ya amount diya jaye  → kg khud calculate hoga (amount / rate)
   *  • ya kg diya jaye      → amount = kg × rate, aur woh kg us sale
   *                            se cut hote hain (partial).
   * Return: {records:[...], appliedTo:[{saleNo,kg,amount}], advance, balance}
   */
  collectPayment(opts) {
    const o = opts || {};
    const cid = o.customerId;
    const rate = num(o.rate) || this.rate();
    const date = o.date || todayISO();
    let amount = round2(o.amount);
    let kg = o.kg != null && o.kg !== '' ? round1(o.kg) : null;
    if (kg != null && !amount) amount = round2(kg * rate);
    if (!cid || amount <= 0) return { ok: false, msg: 'Customer aur amount zaroori hai' };

    const due = this.dueSales(cid);
    const appliedTo = [];
    let left = amount;
    const records = [];
    let seq = 0;

    due.forEach(s => {
      if (left <= 0.009) return;
      const take = round2(Math.min(left, s._due));
      left = round2(left - take);
      const r = num(s.rate) || rate;
      const takeKg = round1(take / r);
      appliedTo.push({ saleId: s.id, saleNo: s.invoiceNo, kg: takeKg, amount: take, rate: r, prevDueKg: s._kgDue, prevDueAmt: s._due });
      records.push({
        id: uid('pay'), no: DB.nextNumber('payment'), customerId: cid, saleId: s.id,
        date, amount: take, kgCovered: takeKg, rate: r, mode: o.mode || 'Cash',
        note: o.note || '', ref: o.ref || '', isAdvance: false, batchId: o.batchId || '',
        createdAt: new Date().toISOString()
      });
    });

    // extra amount → advance (poora kg cover ho gaya, bacha hua paisa aage ke bill mein)
    if (left > 0.009) {
      records.push({
        id: uid('pay'), no: DB.nextNumber('payment'), customerId: cid, saleId: null,
        date, amount: left, kgCovered: round1(left / rate), rate, mode: o.mode || 'Cash',
        note: (o.note ? o.note + ' · ' : '') + 'Advance (aage ke bill mein adjust)',
        ref: o.ref || '', isAdvance: true, batchId: o.batchId || '', createdAt: new Date().toISOString()
      });
    }

    records.forEach(r => DB.upsert('payments', r, { silent: true }));
    DB.save();
    DB.audit('payment', 'Payment ' + fmtMoney(amount) + ' received from ' + this.customerName(cid) +
      (kg != null ? ' (' + fmtKg(kg) + ')' : '') + ' on ' + fmtDate(date), { ref: records.map(r => r.no).join(',') });

    const acc = this.customerAccount(cid);
    return {
      ok: true, records, appliedTo,
      advance: acc.advance, balance: acc.balance,
      totalAmount: amount,
      totalKg: kg != null ? kg : round1(appliedTo.reduce((a, x) => a + num(x.kg), 0) + (Math.max(0, left) / rate))
    };
  },

  /** Payment directly against one sale (custom invoice bill) */
  payAgainstSale(saleId, amount, meta) {
    const m = meta || {};
    const s = DB.get('sales', saleId);
    if (!s) return { ok: false, msg: 'Sale nahi mili' };
    const rate = this.saleRate(s);
    const amt = round2(amount);
    if (amt <= 0) return { ok: false, msg: 'Amount zaroori hai' };
    const rec = {
      id: uid('pay'), no: DB.nextNumber('payment'), customerId: s.customerId, saleId: s.id,
      date: m.date || todayISO(), amount: amt, kgCovered: round1(amt / rate), rate,
      mode: m.mode || 'Cash', note: m.note || ('Bill ' + s.invoiceNo + ' ke against'), ref: m.ref || '',
      isAdvance: false, createdAt: new Date().toISOString()
    };
    DB.upsert('payments', rec);
    DB.audit('payment', 'Bill ' + s.invoiceNo + ' par ' + fmtMoney(amt) + ' receive hua', { ref: rec.no });
    return { ok: true, record: rec };
  },

  /* ============================================================
     SALES / OPERATIONS
     ============================================================ */
  salesIn(range) { return this.sales().filter(s => range.match(s.entryDate)); },
  deliveredIn(range) {
    return this.sales().filter(s => s.deliveryDate && (s.status === 'delivered' || s.status === 'partial') && range.match(s.deliveryDate));
  },
  paymentsIn(range) { return this.payments().filter(p => range.match(p.date)); },
  expensesIn(range) { return this.expenses().filter(e => range.match(e.date)); },
  salariesIn(range) { return this.salaries().filter(e => range.match(e.date)); },
  purchasesIn(range) { return this.purchases().filter(e => range.match(e.date)); },
  drawingsIn(range) { return this.drawings().filter(e => range.match(e.date)); },

  /** Pending = received but not yet delivered (all time, what's in the factory) */
  inFactory() { return this.sales().filter(s => this.pendingKg(s) > 0.05); },
  inFactoryKg() { return round1(this.inFactory().reduce((a, s) => a + this.pendingKg(s), 0)); },
  inFactoryPieces() { return this.inFactory().reduce((a, s) => a + this.pendingPcs(s), 0); },

  /** Receivables across all customers */
  receivables() {
    let bal = 0, adv = 0, kgBal = 0;
    DB.all('customers').forEach(c => {
      const a = this.customerAccount(c.id);
      bal = round2(bal + a.balance); adv = round2(adv + a.advance); kgBal = round1(kgBal + a.kgBalance);
    });
    return { balance: bal, advance: adv, kgBalance: kgBal };
  },

  /* ============================================================
     DASHBOARD METRICS for a period
     ============================================================ */
  metrics(range) {
    const r = range || Period;
    const sales = this.salesIn(r);
    const receivedKg = round1(sales.reduce((a, s) => a + this.saleKg(s), 0));
    const receivedPcs = sales.reduce((a, s) => a + num(s.piecesTotal), 0);
    const delivered = this.deliveredIn(r);
    const deliveredKg = round1(delivered.reduce((a, s) => a + this.saleDeliveredKg(s), 0));
    const deliveredPcs = delivered.reduce((a, s) => a + num(s.deliveredPcs), 0);
    const income = round2(sales.reduce((a, s) => a + this.saleAmount(s), 0));
    const collected = round2(this.paymentsIn(r).reduce((a, p) => a + num(p.amount), 0));
    const expenses = round2(this.expensesIn(r).reduce((a, e) => a + num(e.amount), 0));
    const salaries = round2(this.salariesIn(r).reduce((a, e) => a + num(e.amount), 0));
    const purchases = round2(this.purchasesIn(r).reduce((a, e) => a + num(e.amount), 0));
    const drawings = round2(this.drawingsIn(r).reduce((a, e) => a + num(e.amount), 0));
    const totalExpenses = round2(expenses + salaries + purchases);
    const profit = round2(income - totalExpenses);
    const catKg = {};
    this.catKeys().forEach(k => catKg[k] = 0);
    sales.forEach(s => (s.lines || []).forEach(l => { catKg[l.category || 'A'] = round1((catKg[l.category || 'A'] || 0) + num(l.qtyKg)); }));
    return {
      label: (typeof r.label === 'function') ? r.label() : (r.name || 'Period'), range: r,
      newEntries: sales.length, receivedKg, receivedPcs,
      deliveredCount: delivered.length, deliveredKg, deliveredPcs,
      inFactoryKg: this.inFactoryKg(), inFactoryCount: this.inFactory().length, inFactoryPcs: this.inFactoryPieces(),
      pendingKg: this.inFactoryKg(),
      income, collected, expenses, salaries, purchases, drawings, totalExpenses, profit,
      avgRate: receivedKg > 0 ? round2(income / receivedKg) : 0,
      catKg,
      cashInHand: round2(collected - expenses - salaries - purchases - drawings)
    };
  },

  /** Monthly series for last n months — income / expense / kg */
  monthlySeries(n) {
    const out = [];
    const d = new Date(); d.setDate(1);
    for (let i = (n || 6) - 1; i >= 0; i--) {
      const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
      const ym = isoDay(dt).slice(0, 7);
      const rg = { match: dd => String(dd || '').slice(0, 7) === ym };
      const m = this.metrics(rg);
      out.push({ ym, label: monthLabel(ym), income: m.income, expenses: m.totalExpenses, profit: m.profit, kg: m.receivedKg });
    }
    return out;
  },

  /** Daily series inside a period (for sparkline) */
  dailySeries(range) {
    const r = range || Period;
    const from = r.range === 'today' ? todayISO() : (r.range === 'custom' ? (r.from || todayISO()) : monthStart(r.month));
    const to = r.range === 'today' ? todayISO() : (r.range === 'custom' ? (r.to || todayISO()) : (r.month === monthKey(todayISO()) ? todayISO() : monthEnd(r.month)));
    const days = [];
    let cur = from;
    let guard = 0;
    while (cur <= to && guard++ < 400) {
      const rg = { match: dd => String(dd || '').slice(0, 10) === cur };
      days.push({
        date: cur, kg: round1(this.salesIn(rg).reduce((a, s) => a + this.saleKg(s), 0)),
        income: round2(this.salesIn(rg).reduce((a, s) => a + this.saleAmount(s), 0)),
        expenses: round2(this.expensesIn(rg).concat(this.salariesIn(rg), this.purchasesIn(rg)).reduce((a, e) => a + num(e.amount), 0))
      });
      cur = addDays(cur, 1);
    }
    return days;
  },

  /* ============================================================
     DEMO DATA (Settings → Demo data) — testing ke liye
     ============================================================ */
  loadDemo() {
    const now = new Date().toISOString();
    const names = [
      ['Al-Habib Hotel', '0300-1112233'], ['Karachi Guest House', '0301-4455667'],
      ['Sindh Restaurant', '0333-9988776'], ['Bismillah Catering', '0345-6677889'],
      ['Sea View Apartments', '0322-3344556'], ['Green Valley Hostel', '0311-2233445'],
      ['Zamzam Dry Cleaner', '0308-5566778'], ['City Salon & Spa', '0313-7788990']
    ];
    const custIds = names.map((n, i) => {
      const id = uid('cus');
      DB.upsert('customers', { id, code: 'CUS-' + String(i + 1).padStart(4, '0'), name: n[0], phone: n[1], address: 'Karachi', type: 'Vendor', openingBalance: 0, creditLimit: 0, active: true, createdAt: now }, { silent: true });
      return id;
    });
    const prods = DB.all('products');
    const cats = ['A', 'B', 'C'];
    let inv = DB._data._counters.invoice;
    for (let d = 45; d >= 0; d--) {
      const date = addDays(todayISO(), -d);
      const dayCount = Math.floor(Math.random() * 3);
      for (let k = 0; k < dayCount; k++) {
        const cid = custIds[Math.floor(Math.random() * custIds.length)];
        const lines = [];
        const nLines = 1 + Math.floor(Math.random() * 2);
        for (let l = 0; l < nLines; l++) {
          const cat = cats[Math.floor(Math.random() * 3)];
          const pool = prods.filter(p => p.category === cat);
          const p = pool[Math.floor(Math.random() * pool.length)] || prods[0];
          lines.push({ id: uid('ln'), productId: p.id, category: cat, qtyKg: round1(2 + Math.random() * 25), pcs: 0, note: '' });
        }
        inv++;
        const kg = round1(lines.reduce((a, l) => a + num(l.qtyKg), 0));
        const rate = num(DB.settings().ratePerKg) || 200;
        const delivered = d > 3;
        DB.upsert('sales', {
          id: uid('sal'), invoiceNo: 'INV-' + String(inv).padStart(4, '0'), branchId: (DB.all('branches')[0] || {}).id,
          customerId: cid, entryDate: date, deliveryDate: delivered ? addDays(date, 1 + Math.floor(Math.random() * 3)) : '',
          status: delivered ? 'delivered' : 'open', lines, kgTotal: kg,
          piecesTotal: 0, rate, amount: round2(kg * rate),
          paymentMode: Math.random() > 0.5 ? 'Cash' : 'Credit', amountPaidAtEntry: 0, note: '',
          createdBy: 'Demo', createdAt: new Date().toISOString()
        }, { silent: true });
      }
      if (Math.random() > 0.75) {
        DB.upsert('expenses', { id: uid('exp'), no: DB.nextNumber('expense'), date, branchId: (DB.all('branches')[0] || {}).id, category: ['Fuel', 'Chemicals & Detergent', 'Electricity', 'Transport', 'Maintenance & Repair'][Math.floor(Math.random() * 5)], amount: round2(500 + Math.random() * 6000), paidTo: 'Local vendor', mode: 'Cash', note: 'Demo expense', createdAt: new Date().toISOString() }, { silent: true });
      }
    }
    DB._data._counters.invoice = Math.max(inv, num(DB._data._counters.invoice));
    // payments — 70% customers se collection
    custIds.forEach(cid => {
      const acc = this.customerAccount(cid);
      const target = round2(acc.amount * (0.45 + Math.random() * 0.5));
      if (target > 0) {
        this.collectPayment({ customerId: cid, amount: target, date: addDays(todayISO(), -Math.floor(Math.random() * 10)), mode: 'Cash', note: 'Demo payment' });
      }
    });
    DB.upsert('employees', { id: uid('emp'), code: 'EMP-0001', name: 'Rashid (Washing Master)', role: 'Washing', salary: 45000, phone: '0300-0000000', joinDate: addDays(todayISO(), -200), active: true, createdAt: now }, { silent: true });
    DB.upsert('employees', { id: uid('emp'), code: 'EMP-0002', name: 'Imran (Iron Man)', role: 'Ironing', salary: 35000, phone: '0300-0000001', joinDate: addDays(todayISO(), -120), active: true, createdAt: now }, { silent: true });
    DB.save();
    DB.audit('demo', 'Demo data load kiya gaya');
  },

  clearTransactions() {
    ['sales', 'payments', 'expenses', 'purchases', 'salaries', 'drawings', 'auditLog'].forEach(t => DB._data[t] = []);
    DB._data._counters.invoice = 1000;
    DB.save();
    DB.audit('reset', 'Saara transaction data clear kiya gaya (customers/products safe hain)');
  },

  /* ============================================================
     PENDING DELIVERY AGEING
     ============================================================ */
  pendingWithAge() {
    const t = todayISO();
    return this.inFactory().map(s => Object.assign({}, s, {
      ageDays: s.entryDate ? daysBetween(s.entryDate, t) : 0
    })).sort((a, b) => b.ageDays - a.ageDays);
  }
};

</script>

  /* ---------------- LAYOUT ---------------- */

    const items = NAV.map(n => {
      if (n.sec) return '<div class="nav-sec">' + n.sec + '</div>';
      if (!DB.can(n.id) && !o.forceAll) return '';

        const c = Biz.inFactory().length;
        if (c) badge = '<span class="nav-badge">' + c + '</span>';

  bindLayout(page) {
    const self = this;
    $$('.nav-item').forEach(a => a.onclick = e => {
      e.preventDefault();
      self.sidebarOpen = false;
      const sb = $('#sidebar'); if (sb) sb.classList.remove('open');
      app.go(a.dataset.page);
    });
    const mb = $('#menuBtn'); if (mb) mb.onclick = () => { this.sidebarOpen = !this.sidebarOpen; $('#sidebar').classList.toggle('open', this.sidebarOpen); $('#sideOverlay').classList.toggle('show', this.sidebarOpen); };
    const so = $('#sideOverlay'); if (so) so.onclick = () => { this.sidebarOpen = false; $('#sidebar').classList.remove('open'); so.classList.remove('show'); };
    const lb = $('#logoutBtn'); if (lb) lb.onclick = async () => {
      const yes = await confirmDialog('Logout karna hai?', { title: 'Logout', yes: 'Yes, logout' });
      if (yes) { DB.logout(); app.go('login'); }
    };
    const tb = $('#themeBtn'); if (tb) tb.onclick = () => this.toggleTheme();
    const cc = $('#cloudChip');
    if (cc) {
      cc.onclick = async () => {
        if (!Cloud.ready) { app.go('settings'); setTimeout(() => { const b = document.querySelector('[data-st="cloud"]'); if (b) b.click(); }, 250); return; }
        await Cloud.syncNow();
        this.bindLayout(page);
      };
      Cloud.updateDot();
    }
    const qn = $('#quickNew'); if (qn) {
      if (!DB.can('newsales')) qn.style.display = 'none';
      else qn.onclick = () => app.go('newsales');
    }
    const mb2 = $('#moreBtn'); if (mb2) mb2.onclick = () => this.quickMenu();
    this.bindSearch(page);
  },

  bindSearch(page) {
    const inp = $('#globalSearch'), drop = $('#gsDrop');
    if (!inp) return;
    const run = () => {
      const q = inp.value.trim().toLowerCase();
      if (q.length < 2) { drop.classList.remove('show'); return; }
      const custs = DB.all('customers').filter(c => (c.name || '').toLowerCase().includes(q) || String(c.phone || '').includes(q) || String(c.code || '').toLowerCase().includes(q)).slice(0, 6);
      const sales = DB.all('sales').filter(s => String(s.invoiceNo || '').toLowerCase().includes(q)).slice(0, 5);
      let html = '';
      if (custs.length) html += '<div class="gs-sec">Customers</div>' + custs.map(c =>
        `<div class="gs-item" data-cust="${c.id}"><span>👤</span><div><b>${esc(c.name)}</b><i>${esc(c.phone || '')} · Bal ${fmtMoney(Biz.customerAccount(c.id).balance)}</i></div></div>`).join('');
      if (sales.length) html += '<div class="gs-sec">Invoices</div>' + sales.map(s =>
        `<div class="gs-item" data-sale="${s.id}"><span>🧾</span><div><b>${esc(s.invoiceNo)}</b><i>${esc(Biz.customerName(s.customerId))} · ${fmtKg(s.kgTotal)} · ${fmtDate(s.entryDate)}</i></div></div>`).join('');
      if (!html) html = '<div class="gs-empty">Kuch nahi mila</div>';
      drop.innerHTML = html;
      drop.classList.add('show');
      $$('.gs-item', drop).forEach(it => it.onclick = () => {
        drop.classList.remove('show'); inp.value = '';
        if (it.dataset.cust) openCustomerProfile(it.dataset.cust);
        else app.go('sales?sale=' + it.dataset.sale);
      });
    };
    inp.oninput = debounce(run, 220);
    inp.onblur = () => setTimeout(() => drop.classList.remove('show'), 220);
    inp.onfocus = run;
  },

  quickMenu() {
    const rows = [
      ['➕ New Sale (Wash Entry)', 'newsales'],
      ['🧾 All Invoices / Sales', 'sales'],
      ['🚚 Delivery Queue', 'delivery'],
      ['📒 Payment Ledger', 'ledger'],
      ['👥 Customers', 'customers'],
      ['🧺 Products', 'products'],
      ['💸 Expenses', 'expenses'],
      ['🛒 Purchases', 'purchases'],
      ['🏬 Vendors', 'vendorlist'],
      ['👷 Employees', 'employees'],
      ['🏧 Owner Drawings', 'drawings'],
      ['🏢 Branches', 'branches'],
      ['📈 Reports', 'reports'],
      ['🔐 Users', 'users'],
      ['⚙️ Settings', 'settings']
    ].filter(r => DB.can(r[1]));
    const w = openModal({
      title: 'Quick Navigation',
      size: 'sm',
      body: '<div class="quick-menu">' + rows.map(r => `<button class="qm-item" data-go="${r[1]}">${r[0]}</button>`).join('') + '</div>'
    });
    $$('[data-go]', w).forEach(b => b.onclick = () => { closeModal(w); app.go(b.dataset.go); });
  },

  setPageTitle(title, sub) {
    const t = $('#pageBody');
    const h = document.querySelector('.tb-title h1');
    const p = document.querySelector('.tb-title p');
    if (h && title) h.textContent = title;
    if (p && sub !== undefined) p.textContent = sub;
  },

  /* ---------------- SHARED WIDGETS ---------------- */
  statCard(o) {
    return `<div class="stat ${o.tone || ''} ${o.clickable ? 'stat-click' : ''}" ${o.attrs || ''}>
      <div class="stat-top"><span class="stat-ic">${o.icon || '•'}</span>
        <span class="stat-lbl">${esc(o.label)}</span></div>
      <div class="stat-val">${o.value}</div>
      ${o.foot ? '<div class="stat-foot">' + o.foot + '</div>' : ''}
    </div>`;
  },

  /** simple inline SVG bar chart: [{label, a, b}] */
  barChart(series, opts) {
    const o = opts || {};
    const max = Math.max(1, ...series.map(s => Math.max(num(s.income), num(s.expenses))));
    const w = 100 / series.length;
    const bars = series.map((s, i) => {
      const ih = Math.max(1.5, (num(s.income) / max) * 100);
      const eh = Math.max(1.5, (num(s.expenses) / max) * 100);
      const x = i * w;
      return `<g>
        <rect x="${x + w * 0.10}%" y="${100 - ih}%" width="${w * 0.34}%" height="${ih}%" rx="1.4" fill="url(#gInc)" class="bar-tip" data-tip="${esc(s.label)} · Income ${fmtMoney(s.income)}"/>
        <rect x="${x + w * 0.53}%" y="${100 - eh}%" width="${w * 0.34}%" height="${eh}%" rx="1.4" fill="url(#gExp)" class="bar-tip" data-tip="${esc(s.label)} · Expense ${fmtMoney(s.expenses)}"/>
        <text x="${x + w / 2}%" y="99%" text-anchor="middle" font-size="3.1" fill="currentColor" opacity=".7">${esc(s.label.split(' ')[0])}</text>
      </g>`;
    }).join('');
    return `<div class="chart-wrap">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="bar-chart" style="height:${o.height || 170}px">
        <defs>
          <linearGradient id="gInc" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4f7cff"/><stop offset="100%" stop-color="#7c5cff"/></linearGradient>
          <linearGradient id="gExp" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
        </defs>
        ${bars}
      </svg>
      <div class="chart-legend"><span><i class="dot inc"></i> Income</span><span><i class="dot exp"></i> Expenses</span></div>
    </div>`;
  },

  /** horizontal progress rows: [{label, value, max, color, note}] */
  progressRows(rows) {
    const max = Math.max(1, ...rows.map(r => num(r.value)));
    return rows.map(r => `<div class="prow">
      <div class="prow-top"><span>${esc(r.label)}</span><b>${r.note || (fmtKg(r.value))}</b></div>
      <div class="pbar"><i style="width:${Math.max(2, (num(r.value) / max) * 100)}%;background:${r.color || '#4f7cff'}"></i></div>
    </div>`).join('');
  },

  /** donut of category kg */
  catDonut(catKg) {
    const cats = Biz.categories();
    const entries = cats.map(c => ({ key: c.key, label: c.label, color: c.color, v: num(catKg[c.key]) }));
    const total = entries.reduce((a, e) => a + e.v, 0);
    let acc = 0, stops = [];
    if (total <= 0) stops.push('#e5e9f2 0 100%');
    else entries.forEach(e => {
      const pct = (e.v / total) * 100;
      stops.push(e.color + ' ' + acc.toFixed(2) + '% ' + (acc + pct).toFixed(2) + '%');
      acc += pct;
    });
    return `<div class="donut-wrap">
      <div class="donut" style="background:conic-gradient(${stops.join(',')})">
        <div class="donut-hole"><b>${fmtNum(total, total % 1 ? 1 : 0)}</b><span>KG</span></div>
      </div>
      <div class="donut-legend">
        ${entries.map(e => `<div class="dl-row"><i style="background:${e.color}"></i>
          <span class="dl-lbl">${esc(e.label)}</span>
          <b>${fmtKg(e.v)}</b>
          <em>${total ? Math.round((e.v / total) * 100) : 0}%</em></div>`).join('')}
      </div>
    </div>`;
  },

  statusPill(status) {
    if (status === 'delivered') return '<span class="pill pill-ok">✔ Delivered</span>';
    if (status === 'cancelled') return '<span class="pill pill-muted">Cancelled</span>';
    return '<span class="pill pill-warn">⏳ In Factory</span>';
  },
  payPill(sale) {
    const due = num(sale._due);
    if (due <= 0.009) return '<span class="pill pill-ok">Paid</span>';
    if (num(sale._applied) > 0) return '<span class="pill pill-warn">Partial</span>';
    return '<span class="pill pill-due">Unpaid</span>';
  },

  /** Customer select options with add-new button */
  customerPicker(id, selectedId, opts) {
    const o = opts || {};
    const list = DB.all('customers').filter(c => c.active !== false).sort((a, b) => String(a.name).localeCompare(String(b.name)));
    return `<div class="picker">
      <select class="inp" id="${id}">
        <option value="">— Select customer —</option>
        ${list.map(c => `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${esc(c.name)}${c.code ? ' (' + esc(c.code) + ')' : ''}</option>`).join('')}
      </select>
      ${o.addBtn === false ? '' : `<button class="btn btn-ghost btn-sm" id="${id}_add" title="Naya customer">➕</button>`}
    </div>`;
  },

  bindCustomerPicker(id, onPick, afterAdd) {
    const sel = $('#' + id), add = $('#' + id + '_add');
    if (sel && onPick) sel.onchange = e => onPick(e.target.value);
    if (add) add.onclick = async () => {
      const nc = await customerForm(null);
      if (nc && nc.id) {
        UI.refreshCustomerSelect(id, nc.id);
        onPick && onPick(nc.id);
      }
    };
  },
  refreshCustomerSelect(id, selected) {
    const sel = $('#' + id);
    if (!sel) return;
    const list = DB.all('customers').filter(c => c.active !== false).sort((a, b) => String(a.name).localeCompare(String(b.name)));
    sel.innerHTML = '<option value="">— Select customer —</option>' + list.map(c =>
      `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${esc(c.name)}${c.code ? ' (' + esc(c.code) + ')' : ''}</option>`).join('');
  }
};

</script>

          <input class="inp" id="lgPass" type="password" placeholder="••••••••" autocomplete="current-password"/>

          <label class="row tiny dim" style="gap:6px"><input type="checkbox" id="lgShow"/> Show password</label>
          <span class="tiny muted">${users.length} user${users.length === 1 ? '' : 's'} registered</span>
        </div>
        <button class="btn btn-primary btn-lg btn-block" id="lgBtn">🔓 Login to Portal</button>

          <b>Default logins:</b><br>

          Manager → <b>manager</b> / <b>manager123</b><br>
          Cashier → <b>cashier</b> / <b>cashier123</b><br>

        </div>

    </div>`;

  const user = $('#lgUser'), pass = $('#lgPass');
  const doLogin = () => {
    const r = DB.login(user.value, pass.value);
    if (!r.ok) { toast(r.msg, 'error'); pass.select(); return; }
    toast('Welcome, ' + r.user.name + '!', 'success');
    app.current = '';
    app.go('dashboard');
    if (typeof Cloud !== 'undefined') Cloud.onLogin();   // login par foran sync
  };
  $('#lgBtn').onclick = doLogin;
  $('#lgShow').onchange = e => { pass.type = e.target.checked ? 'text' : 'password'; };
  user.onkeydown = e => { if (e.key === 'Enter') pass.focus(); };
  pass.onkeydown = e => { if (e.key === 'Enter') doLogin(); };
  setTimeout(() => user.focus(), 100);
}

<!-- assets/js/pages/dashboard.js -->
<script>
/* ============================================================
   DASHBOARD — Main KPI Cards + Period switcher
   Total Received · Total Delivered · Clothes in Factory ·
   Total Income · Total Expenses · Profit / Loss
   ============================================================ */

function renderDashboard() {
  const html = `<div id="dashBody"></div>`;
  UI.renderLayout('dashboard', html);
  dashPaint();
}

function dashPaint() {
  const el = $('#dashBody');
  if (!el) return;
  const m = Biz.metrics(Period);
  const recv = Biz.receivables();
  const profitTone = m.profit >= 0 ? 'good' : 'bad';
  const pend = Biz.pendingWithAge();

  /* -------- KPI cards -------- */
  const cards = `
    <div class="stats">
      ${UI.statCard({
    icon: '⚖️', label: 'Total Received — ' + Period.shortLabel(), value: fmtKg(m.receivedKg),
    foot: m.newEntries + ' entries', tone: 'info',
    clickable: true, attrs: 'data-goto="sales"'
  })}
      ${UI.statCard({
    icon: '📦', label: 'Total Delivered — ' + Period.shortLabel(), value: fmtKg(m.deliveredKg),
    foot: m.deliveredCount + ' orders delivered', tone: 'good',
    clickable: true, attrs: 'data-goto="sales"'
  })}
      ${UI.statCard({
    icon: '🏭', label: 'Clothes in Factory Now', value: fmtKg(m.inFactoryKg),
    foot: m.inFactoryCount + ' open orders', tone: m.inFactoryKg > 0 ? 'warn' : 'good',
    clickable: true, attrs: 'data-goto="delivery"'
  })}
      ${UI.statCard({
    icon: '💰', label: 'Total Income — ' + Period.shortLabel(), value: fmtMoney(m.income),
    foot: 'Avg rate ' + fmtMoney(m.avgRate) + '/kg', tone: 'good'
  })}
      ${UI.statCard({
    icon: '💸', label: 'Total Expenses — ' + Period.shortLabel(), value: fmtMoney(m.totalExpenses),
    foot: 'Kharchay ' + fmtMoney(m.expenses) + ' · Purch ' + fmtMoney(m.purchases) + ' · Sal ' + fmtMoney(m.salaries),
    tone: 'bad', clickable: true, attrs: 'data-goto="expenses"'
  })}
      ${UI.statCard({
    icon: m.profit >= 0 ? '📈' : '📉', label: 'Profit / Loss — ' + Period.shortLabel(), value: fmtMoney(m.profit),
    foot: 'Income − Expenses' + (m.drawings > 0 ? ' · Drawings ' + fmtMoney(m.drawings) : ''), tone: profitTone
  })}
    </div>`;

  /* -------- P&L + collection summary -------- */
  const plCard = `
    <div class="card">
      <div class="card-head"><h3>🧮 Profit &amp; Loss — ${esc(Period.label())}</h3><div class="sp"></div>
        <span class="pill pill-brand" id="dashRate" style="cursor:pointer" title="Rate edit karein">Per KG rate ${fmtMoney(Biz.rate())} ✏️</span></div>
      <div class="card-body">
        <div class="kv"><span>Wash Income (billed)</span><b class="t-ok">${fmtMoney(m.income)}</b></div>
        <div class="kv"><span>− Factory Expenses</span><b class="t-bad">${fmtMoney(m.expenses)}</b></div>
        <div class="kv"><span>− Purchases from Vendors</span><b class="t-bad">${fmtMoney(m.purchases)}</b></div>
        <div class="kv"><span>− Staff Salaries</span><b class="t-bad">${fmtMoney(m.salaries)}</b></div>
        <div class="kv total"><span>${m.profit >= 0 ? '= Net Profit ✅' : '= Net Loss ⚠️'}</span>
          <b class="${m.profit >= 0 ? 't-ok' : 't-bad'}">${fmtMoney(m.profit)}</b></div>
        <div class="divider"></div>
        <div class="kv"><span>Cash Received (collections)</span><b>${fmtMoney(m.collected)}</b></div>
        <div class="kv"><span>Cash Out (expenses + salary + purchase + drawings)</span>
          <b class="t-bad">${fmtMoney(round2(m.totalExpenses + m.drawings))}</b></div>
        <div class="kv"><span>Owner Drawings (personal nikaal — expense nahi)</span><b>${fmtMoney(m.drawings)}</b></div>
        <div class="kv"><span>Net cash movement</span><b class="${m.collected - m.totalExpenses - m.drawings >= 0 ? 't-ok' : 't-bad'}">
          ${fmtMoney(round2(m.collected - m.totalExpenses - m.drawings))}</b></div>
      </div>
    </div>`;

  /* -------- receivables / advance -------- */
  const recvCard = `
    <div class="card">
      <div class="card-head"><h3>📒 Receivables &amp; Advance</h3><div class="sp"></div>
        <button class="btn btn-ghost btn-sm" data-goto="ledger">Payment Ledger →</button></div>
      <div class="card-body">
        <div class="grid g2" style="gap:10px">
          <div class="note-box bad" style="text-align:center">
            <div class="tiny" style="font-weight:800;text-transform:uppercase;letter-spacing:.4px">Balance Due (all customers)</div>
            <div class="big" style="margin-top:4px">${fmtMoney(recv.balance)}</div>
            <div class="tiny">≈ ${fmtKg(recv.kgBalance)} wash ka hisaab</div>
          </div>
          <div class="note-box ok" style="text-align:center">
            <div class="tiny" style="font-weight:800;text-transform:uppercase;letter-spacing:.4px">Advance / Extra Received</div>
            <div class="big" style="margin-top:4px">${fmtMoney(recv.advance)}</div>
            <div class="tiny">aage ke bill mein adjust hoga</div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="kv"><span>Total KG received (all time)</span><b>${fmtKg(Biz.sales().reduce((a, s) => a + Biz.saleKg(s), 0))}</b></div>
        <div class="kv"><span>Total billed (all time)</span><b>${fmtMoney(Biz.sales().reduce((a, s) => a + Biz.saleAmount(s), 0))}</b></div>
        <div class="kv"><span>Total collected (all time)</span><b>${fmtMoney(Biz.payments().reduce((a, p) => a + num(p.amount), 0))}</b></div>
      </div>
    </div>`;

  const chartCard = `
    <div class="card">
      <div class="card-head"><h3>📈 Last 6 Months — Income vs Expenses</h3></div>
      <div class="card-body">
        ${UI.barChart(Biz.monthlySeries(6))}
        <div class="divider"></div>
        <div class="tbl-wrap">
          <table class="tbl" style="min-width:520px">
            <thead><tr><th>Month</th><th class="t-right">KG Received</th><th class="t-right">Income</th><th class="t-right">Expenses</th><th class="t-right">Profit</th></tr></thead>
            <tbody>${Biz.monthlySeries(6).reverse().map(r => `<tr>
              <td class="t-strong">${esc(r.label)}</td>
              <td class="t-right">${fmtKg(r.kg)}</td>
              <td class="t-right t-ok">${fmtMoney(r.income)}</td>
              <td class="t-right t-bad">${fmtMoney(r.expenses)}</td>
              <td class="t-right ${r.profit >= 0 ? 't-ok' : 't-bad'}">${fmtMoney(r.profit)}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
    </div>`;

  /* -------- pending deliveries -------- */
  const pendRows = pend.slice(0, 7);
  const pendCard = `
    <div class="card">
      <div class="card-head"><h3>🚚 Delivery Pending (factory mein)</h3><div class="sp"></div>
        <span class="pill ${pend.length ? 'pill-warn' : 'pill-ok'}">${pend.length} orders · ${fmtKg(m.inFactoryKg)}</span>
        <button class="btn btn-ghost btn-sm" data-goto="delivery">Sab dekhein</button></div>
      <div class="tbl-wrap">
        <table class="tbl" style="min-width:560px">
          <thead><tr><th>Invoice</th><th>Customer</th><th>Received</th><th class="t-right">KG</th><th class="t-center">Age</th><th></th></tr></thead>
          <tbody>${pendRows.length ? pendRows.map(s => `<tr>
            <td class="t-strong">${esc(s.invoiceNo)}</td>
            <td>${esc(Biz.customerName(s.customerId))}</td>
            <td class="t-muted tiny">${fmtDate(s.entryDate)}</td>
            <td class="t-right t-strong">${fmtKg(s.kgTotal)}</td>
            <td class="t-center"><span class="pill ${s.ageDays > 7 ? 'pill-due' : (s.ageDays > 3 ? 'pill-warn' : 'pill-muted')}">${s.ageDays} din</span></td>
            <td><button class="btn btn-success btn-xs" data-deliver="${s.id}">✔ Deliver</button></td>
          </tr>`).join('') : emptyRow(6, 'Koi delivery pending nahi — sab clear hai ✔', '🎉')}</tbody>
        </table>
      </div>
    </div>`;

  /* -------- top customers -------- */
  const custs = DB.all('customers').map(c => {
    const a = Biz.customerAccount(c.id);
    return { name: c.name, id: c.id, kg: a.kgTotal, balance: a.balance, amount: a.amount, kgMonth: 0 };
  });
  custs.forEach(c => {
    const mo = Biz.salesIn({ match: d => String(d).slice(0, 7) === monthKey(todayISO()) }).filter(s => s.customerId === c.id);
    c.kgMonth = round1(mo.reduce((a, s) => a + Biz.saleKg(s), 0));
  });
  const top = custs.filter(c => c.kgMonth > 0).sort((a, b) => b.kgMonth - a.kgMonth).slice(0, 6);
  const topCard = `
    <div class="card">
      <div class="card-head"><h3>🏆 Top Customers — is mahine</h3><div class="sp"></div>
        <button class="btn btn-ghost btn-sm" data-goto="customers">All customers</button></div>
      <div class="card-body">
        ${top.length ? UI.progressRows(top.map(c => ({
    label: c.name, value: c.kgMonth, note: fmtKg(c.kgMonth) + (c.balance > 0 ? ' · due ' + fmtMoneyShort(c.balance) : ''),
    color: '#4f7cff'
  }))) : '<div class="empty"><div class="empty-ico">👥</div><div>Is mahine abhi koi entry nahi hui</div></div>'}
      </div>
    </div>`;

  /* -------- quick actions -------- */
  const quick = `
    <div class="card">
      <div class="card-head"><h3>⚡ Quick Actions</h3></div>
      <div class="card-body">
        <div class="qgrid">
          <button class="qa qa-brand" data-act="new"><span>➕</span><b>New Wash Entry</b><i>Daily clients se kapre receive karein</i></button>
          <button class="qa qa-ok" data-act="collect"><span>💵</span><b>Payment Receive</b><i>Amount ya KG ke hisaab se</i></button>

        </div>

      <div>${quick}${recvCard}${topCard}</div>
    </div>`;

  $$('[data-goto]', el).forEach(b => b.onclick = () => app.go(b.dataset.goto));
  $$('[data-deliver]', el).forEach(b => b.onclick = () => openDeliveryForm(b.dataset.deliver));

  /* quick action handlers */
  $$('[data-act]', el).forEach(b => b.onclick = async () => {
    const a = b.dataset.act;
    if (a === 'new') return app.go('newsales');
    if (a === 'expense') return openExpenseForm();
    if (a === 'customer') return customerForm();
    if (a === 'collect') {
      const w = openModal({
        title: '💵 Payment Receive', size: 'sm',
        body: `<label class="fld"><span>Customer</span>${UI.customerPicker('qaCust')}</label>

/* ============================================================
   STEP 03 — ITEM TYPES (jaise Shoes → Junior / Sports / Man / CH)
   Type ka naam cashier khud likh sakta hai; naya naam product par
   save ho jata hai, agli dafa khud aa jata hai.
   ============================================================ */
const NS_NONE = '__none__';
function nsKey(l) { return l.productId || NS_NONE; }
function nsProductName(pid) {
  if (pid === NS_NONE) return 'Wash (general)';
  const p = Biz.product(pid);
  if (p && p.name) return p.name;
  const l = NS.lines.find(x => nsKey(x) === pid);
  return (l && l.productName) || 'Item';
}
/** is item ke types: product par saved + slip mein use hue */
function nsTypes(pid) {
  const out = Biz.productTypes(pid).slice();
  NS.lines.forEach(l => { if (nsKey(l) === pid && l.type && out.indexOf(l.type) < 0) out.push(l.type); });
  return out.filter(Boolean);
}
function nsTypedLines(pid) { return NS.lines.filter(l => nsKey(l) === pid && !!l.type); }
function nsBaseLines(pid) { return NS.lines.filter(l => nsKey(l) === pid && !l.type); }
function nsBaseKgInSlip(pid) { return round1(nsBaseLines(pid).reduce((a, l) => a + num(l.kg), 0)); }
function nsTypeKgSum(pid) { return round1(nsTypedLines(pid).reduce((a, l) => a + num(l.kg), 0)); }
function nsSlipKg(pid) { return round1(nsBaseKgInSlip(pid) + nsTypeKgSum(pid)); }
/** Step 02 ka original KG (types mein baantne se pehle wala) */
function nsOrigKg(pid) {
  const rem = round1(num((NS._base || {})[pid]) || 0);
  return round1(Math.max(rem, nsSlipKg(pid)));
}
function nsLeftKg(pid) { return round1(Math.max(0, nsOrigKg(pid) - nsSlipKg(pid))); }
function nsSlipProductIds() {
  const ids = [];
  NS.lines.forEach(l => { const k = nsKey(l); if (ids.indexOf(k) < 0) ids.push(k); });
  return ids;
}
/** type ka naam product par save karein (customize — agli dafa khud aayega) */
function nsSaveTypeName(pid, name) {
  if (!name || pid === NS_NONE) return false;
  return Biz.saveProductType(pid, name);
}
/** pehla type banane se pehle item ka original (general) KG yaad rakhein */
function nsEnsureBaseStored(pid) {
  NS._base = NS._base || {};
  const base = nsBaseLines(pid);
  if (base.length) {
    const kg = round1(base.reduce((a, l) => a + num(l.kg), 0));
    NS._base[pid] = round1(num(NS._base[pid]) + kg);
    NS.lines = NS.lines.filter(l => !(nsKey(l) === pid && !l.type));
  }
}
/** ek type ki KG set karein (row = ek line) */
function nsSetTypeKg(pid, type, kg) {
  type = String(type || '').trim();
  if (!type) return toast('Type ka naam likhein', 'warn');
  if (kg > 0) nsEnsureBaseStored(pid);
  let ln = NS.lines.find(l => nsKey(l) === pid && l.type === type);
  const isNew = !ln;
  if (!ln) {
    const p = Biz.product(pid) || {};
    ln = { id: uid('ln'), productId: pid === NS_NONE ? null : pid, productName: nsProductName(pid), category: p.category || '', type, kg: 0, pcs: 0, note: '' };
    NS.lines.push(ln);
  }
  ln.kg = round1(Math.max(0, kg));
  if (!ln.kg) NS.lines = NS.lines.filter(l => l !== ln);      // KG khali → line hata dein
  const saved = nsSaveTypeName(pid, type);
  nsPaint();
  if (isNew && saved) toast('“' + type + '” ' + nsProductName(pid) + ' ke types mein save ho gaya ✔', 'success', 2200);
  else if (isNew) toast('“' + type + '” add ho gaya — KG ' + fmtKg(ln ? ln.kg : kg), 'success', 1800);
}
function nsRenameType(pid, oldT, newT) {
  newT = String(newT || '').trim();
  if (!newT) { nsPaint(); return; }
  if (newT === oldT) return;
  NS.lines.filter(l => nsKey(l) === pid && l.type === oldT).forEach(l => { l.type = newT; });
  const p = Biz.product(pid);
  if (p && Array.isArray(p.types)) {
    const list = p.types.filter(t => t !== oldT);
    if (list.indexOf(newT) < 0) list.push(newT);
    DB.upsert('products', Object.assign({}, p, { types: list }), { silent: true });
    DB.save();
  } else nsSaveTypeName(pid, newT);
  nsPaint();
  toast('Type ka naam badal kar “' + newT + '” kar diya', 'success', 1800);
}
function nsRestoreBase(pid) {
  const rem = round1(num((NS._base || {})[pid]) || 0);
  if (rem <= 0) return;
  const need = round1(rem - nsBaseKgInSlip(pid));
  if (need > 0.05) {
    const p = Biz.product(pid) || {};
    NS.lines.push({ id: uid('ln'), productId: pid === NS_NONE ? null : pid, productName: nsProductName(pid), category: p.category || '', type: '', kg: need, pcs: 0, note: '' });
  }
}
function nsDeleteType(pid, type) {
  NS.lines = NS.lines.filter(l => !(nsKey(l) === pid && l.type === type));
  if (!nsTypedLines(pid).length) nsRestoreBase(pid);      // saare types hat gaye → original KG wapis
  nsPaint();
  toast('“' + type + '” hata diya', 'info', 1600);
}
function nsAddLeftover(pid) {
  const left = nsLeftKg(pid);
  if (left <= 0) return toast('Koi baaki KG nahi — sab types mein baant di gayi hai ✔', 'info', 1800);
  const p = Biz.product(pid) || {};
  NS.lines.push({ id: uid('ln'), productId: pid === NS_NONE ? null : pid, productName: nsProductName(pid), category: p.category || '', type: '', kg: left, pcs: 0, note: '' });
  nsPaint();
  toast(fmtKg(left) + ' “' + nsProductName(pid) + '” (general) mein daal di gayi', 'success', 2200);
}

/** Step 03 ka poora panel */
function nsStep3HTML() {
  if (!NS.lines.length) return '';
  const blocks = nsSlipProductIds().map(pid => {
    const name = nsProductName(pid);
    const types = nsTypes(pid);
    const typed = nsTypedLines(pid);
    const typeKg = nsTypeKgSum(pid);
    const origKg = nsOrigKg(pid);
    const left = nsLeftKg(pid);
    const rowsHtml = types.length ? types.map(t => {
      const ln = typed.find(l => l.type === t);
      return `<div class="row mb6" style="gap:8px;align-items:center">
        <input class="inp inp-xs" style="flex:1;min-width:130px" value="${esc(t)}" data-tname="${esc(t)}" data-tp="${esc(pid)}" title="Naam badalne ke liye likhein — item ke sath save ho jayega"/>
        <input type="number" step="0.1" min="0" class="inp inp-xs t-right" style="width:96px" value="${ln ? ln.kg : ''}" placeholder="0.0" data-tkg="${esc(t)}" data-tp="${esc(pid)}"/>
        <span class="tiny muted" style="width:22px">kg</span>
        ${ln ? `<button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-tdel="${esc(t)}" data-tp="${esc(pid)}" title="Hata dein">✕</button>` : '<span style="width:28px"></span>'}
      </div>`;
    }).join('') : '<div class="tiny muted mb6">Abhi koi type nahi — neeche naya type likh kar KG daalein (jaise Junior Shoes).</div>';
    return `
      <div class="card card-flat mb10" data-tblock="${esc(pid)}">
        <div class="card-head" style="gap:8px;flex-wrap:wrap">
          <h3 style="font-size:13.5px">🧩 ${esc(name)}</h3>
          <div class="sp"></div>
          <span class="pill pill-info">Slip: ${fmtKg(nsSlipKg(pid))}</span>
          <span class="pill ${typeKg > 0 ? 'pill-ok' : 'pill-muted'}">Types: ${fmtKg(typeKg)}</span>
          ${left > 0.05 ? `<span class="pill pill-warn">Baaki: ${fmtKg(left)}</span>` : ''}
        </div>
        <div class="card-body" style="padding-top:8px">
          ${rowsHtml}
          <div class="row" style="gap:8px;align-items:center;margin-top:6px">
            <input class="inp inp-xs" style="flex:1;min-width:130px" id="nsNewTypeName_${esc(pid)}" placeholder="➕ Naya type ka naam (jaise Junior Shoes)"/>
            <input type="number" step="0.1" min="0" class="inp inp-xs t-right" style="width:96px" id="nsNewTypeKg_${esc(pid)}" placeholder="0.0"/>
            <span class="tiny muted" style="width:22px">kg</span>
            <button class="btn btn-ghost btn-xs" data-tadd="${esc(pid)}">➕ Add</button>
          </div>
          ${left > 0.05 ? `<button class="btn btn-ghost btn-xs mt6" data-tleft="${esc(pid)}">⬅️ Baaki ${fmtKg(left)} type ke bina (“${esc(name)}” general) daal dein</button>` : ''}
          <div class="fld-hint">Type ka naam + KG likh kar Enter/Add dabayein → slip mein <b>${esc(name)} — (type)</b> ban jata hai. Naya naam item ke sath <b>save</b> hota hai, agli dafa khud nazar aayega (naam badalna ho to likh kar bahar click karein).</div>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="card mb14">
      <div class="card-head" style="gap:8px;flex-wrap:wrap">
        <h3 style="font-size:14.5px;font-weight:800">🧩 Step 03 — Types / KG Breakup</h3>
        <span class="tiny muted">optional — item ko chhote types mein baant dein (jaise Shoes → Junior / Sports / Man / CH)</span>
      </div>
      <div class="card-body">${blocks}</div>
    </div>`;
}

/* ---------- helpers ---------- */
function nsCatKg(cat) { return round1(NS.lines.filter(l => l.category === cat).reduce((a, l) => a + num(l.kg), 0)); }
/* items selection — ek hi list (category nahi) */
function nsSelectedItems() { return NS._sel && NS._sel.all ? NS._sel.all : (NS._sel = NS._sel || {}, NS._sel.all = NS._sel.all || []); }

function nsBind() {
  const el = $('#nsBody');
  /* customer */
  UI.bindCustomerPicker('nsCust', cid => { NS.customerId = cid; nsPaint(); });

  /* header fields */
  const ed = $('#nsEntryDate'); if (ed) ed.onchange = e => { NS.entryDate = e.target.value; };
  const ex = $('#nsExpected'); if (ex) ex.onchange = e => { NS.expected = e.target.value; };
  const br = $('#nsBranch'); if (br) br.onchange = e => { NS.branchId = e.target.value; };
  const nt = $('#nsNote'); if (nt) nt.oninput = e => { NS.note = e.target.value; };
  const ad = $('#nsAdvance'); if (ad) ad.oninput = e => { NS.advance = e.target.value; };
  const md = $('#nsMode'); if (md) md.onchange = e => { NS.paymentMode = e.target.value; };

  /* item chips */
  $$('[data-nsitem]', el).forEach(b => b.onclick = () => {
    const list = nsSelectedItems(), id = b.dataset.nsitem;
    const i = list.indexOf(id);
    if (i >= 0) list.splice(i, 1); else list.push(id);
    b.classList.toggle('on');
  });

  /* add to slip */
  const add = $('#nsAdd');
  const kgIn = $('#nsKg');
  if (kgIn) {
    kgIn.focus();
    kgIn.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); nsAddLine(); } };
  }
  if (add) add.onclick = nsAddLine;

  /* new item in product list */
  const ni = $('#nsNewItem');
  if (ni) ni.onclick = async () => {
    const p = await productForm(null);
    if (p) { toast('Item add ho gaya — ab click karke select karein', 'success'); nsPaint(); }
  };

  /* line edits */
  $$('[data-linekg]', el).forEach(i => i.onchange = e => {
    const l = NS.lines.find(x => x.id === e.target.dataset.linekg);
    if (l) { l.kg = round1(e.target.value); nsPaint(); }
  });
  $$('[data-linenote]', el).forEach(i => i.oninput = e => {
    const l = NS.lines.find(x => x.id === e.target.dataset.linenote);
    if (l) l.note = e.target.value;
  });
  $$('[data-linedel]', el).forEach(b => b.onclick = () => {
    NS.lines = NS.lines.filter(l => l.id !== b.dataset.linedel); nsPaint();
  });
  /* ---- STEP 03 bindings ---- */
  $$('[data-tkg]', el).forEach(inp => {
    inp.onchange = e => {
      const pid = e.target.dataset.tp, t = e.target.dataset.tkg;
      nsSetTypeKg(pid, t, round1(e.target.value));
    };
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };
  });
  $$('[data-tname]', el).forEach(inp => {
    inp.onchange = e => nsRenameType(e.target.dataset.tp, e.target.dataset.tname, e.target.value);
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };
  });
  $$('[data-tdel]', el).forEach(b => b.onclick = () => nsDeleteType(b.dataset.tp, b.dataset.tdel));
  $$('[data-tleft]', el).forEach(b => b.onclick = () => nsAddLeftover(b.dataset.tleft));
  $$('[data-tadd]', el).forEach(b => {
    const addType = () => {
      const pid = b.dataset.tadd;
      const nEl = $('#nsNewTypeName_' + pid), kEl = $('#nsNewTypeKg_' + pid);
      const name = (nEl && nEl.value || '').trim();
      const kg = round1(kEl && kEl.value || 0);
      if (!name) { toast('Type ka naam likhein (jaise Junior Shoes)', 'warn'); if (nEl) nEl.focus(); return; }
      nsSetTypeKg(pid, name, kg);
    };
    b.onclick = addType;
    const nEl = $('#nsNewTypeName_' + b.dataset.tadd);
    const kEl = $('#nsNewTypeKg_' + b.dataset.tadd);
    if (nEl) nEl.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); if (kEl) kEl.focus(); } };
    if (kEl) kEl.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addType(); } };
  });

  const cl = $('#nsClearLines'); if (cl) cl.onclick = async () => {
    if (await confirmDialog('Saare items hata dein?', { title: 'Clear items', danger: true })) { NS.lines = []; NS._base = {}; nsPaint(); }
  };

  const nr = $('#nsRateEdit'); if (nr) nr.onclick = () => openRateForm();
  const ncr = $('#nsCatRate'); if (ncr) ncr.onclick = () => openRateForm();
  /* is bill ka rate — purane record (e.g. Rs.200/kg) enter karne ke liye */
  const nri = $('#nsRateInp');
  if (nri) {
    nri.onchange = e => {
      const v = num(e.target.value);
      NS.rate = v > 0 ? v : '';
      if (NS.rate && round2(NS.rate) !== round2(Biz.rate())) {
        toast('Is bill ka rate ' + fmtMoney(NS.rate) + '/kg set — sirf isi bill par lagega', 'info', 3000);
      }
      nsPaint();
    };
    nri.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };
  }

  /* save buttons */
  const sv = $('#nsSaveSlip'); if (sv) sv.onclick = () => nsSave('slip');
  const si = $('#nsSaveInvoice'); if (si) si.onclick = () => nsSave('invoice');
  const so = $('#nsSaveOnly'); if (so) so.onclick = () => nsSave('only');
  const rs = $('#nsReset'); if (rs) rs.onclick = async () => {
    if (await confirmDialog('Form reset karein?', { title: 'Reset' })) {
      NS.lines = []; NS._sel = {}; NS._base = {}; NS.advance = ''; NS.note = ''; NS.customerId = ''; NS.tab = 'A'; nsPaint();
    }
  };
}

function nsAddLine() {
  const kgIn = $('#nsKg');
  const kg = round1(kgIn ? kgIn.value : 0);
  if (kg <= 0) { toast('Pehle KG enter karein', 'warn'); if (kgIn) kgIn.focus(); return; }
  const sel = nsSelectedItems().slice();
  const products = DB.all('products').filter(p => p.active !== false);

  if (!sel.length) {
    NS.lines.push({ id: uid('ln'), productId: null, productName: 'Wash', category: '', type: NS._type ? '' : '', kg, pcs: 0, note: '' });
  } else {
    const each = round1(Math.floor((kg / sel.length) * 10) / 10);
    let used = 0;
    sel.forEach((pid, i) => {
      const lkg = (i === sel.length - 1) ? round1(kg - used) : each;
      used = round1(used + lkg);
      const pd = products.find(p => p.id === pid) || Biz.product(pid) || {};
      NS.lines.push({ id: uid('ln'), productId: pid, category: pd.category || '', type: '', kg: lkg, pcs: 0, note: '' });
    });
  }
  nsSelectedItems().length = 0;
  if (kgIn) kgIn.value = '';
  nsPaint();
  toast(fmtKg(kg) + ' slip mein add ho gaya', 'success', 1600);
}

async function nsSave(mode) {
  if (!NS.customerId) return toast('Customer select karein', 'error');
  if (!NS.lines.length) return toast('Kam az kam ek item / KG add karein', 'error');
  const rate = num(NS.rate) || Biz.rate();   // is bill ka rate
  const kgTotal = round1(NS.lines.reduce((a, l) => a + num(l.kg), 0));
  const sale = {
    id: uid('sal'),
    invoiceNo: DB.nextNumber('invoice'),
    branchId: NS.branchId || ((DB.all('branches')[0] || {}).id || ''),
    customerId: NS.customerId,
    entryDate: NS.entryDate || todayISO(),
    expectedDelivery: NS.expected || '',
    deliveryDate: '',
    status: 'open',
    lines: NS.lines.map(l => ({ id: l.id, productId: l.productId, productName: (Biz.product(l.productId) || {}).name || l.productName || 'Item', category: l.category || '', type: l.type || '', qtyKg: round1(l.kg), pcs: 0, note: l.note || '' })),
    kgTotal,
    piecesTotal: 0,
    rate,
    amount: round2(kgTotal * rate),
    paymentMode: NS.paymentMode || 'Credit',
    amountPaidAtEntry: round2(NS.advance),
    note: NS.note || '',
    createdBy: (DB.currentUser() || {}).name || '',
    createdAt: new Date().toISOString()
  };
  DB.upsert('sales', sale);
  DB.audit('sale', 'New wash entry ' + sale.invoiceNo + ' — ' + Biz.customerName(sale.customerId) + ' · ' + fmtKg(kgTotal), { ref: sale.invoiceNo });

  if (round2(NS.advance) > 0) {
    Biz.payAgainstSale(sale.id, round2(NS.advance), { mode: NS.paymentMode === 'Credit' ? 'Cash' : NS.paymentMode, note: 'Entry ke waqt received' });
  }

  toast('✔ ' + sale.invoiceNo + ' save ho gaya — ' + fmtKg(kgTotal), 'success');

  // reset cart but keep customer for fast repeat entry
  NS.lines = []; NS._sel = {}; NS._base = {}; NS.advance = ''; NS.note = '';
  NS.rate = '';   // rate override sirf usi bill ke liye tha

  if (mode === 'slip') {
    printSaleSlip(sale.id);
    nsAfterSaveDialog(sale, true);
  } else if (mode === 'invoice') {
    openCustomInvoice(sale.id, { afterSave: true });
  } else {
    nsAfterSaveDialog(sale, false);
  }
}

function nsAfterSaveDialog(sale, printed) {
  const w = openModal({
    title: '✔ ' + sale.invoiceNo + ' saved',
    size: 'sm',
    body: `<div class="note-box ok tiny mb10">Entry save ho gayi. Ab aap slip print kar sakte hain ya custom invoice bana sakte hain.</div>
      <div class="grid g2" style="gap:8px">
        <button class="btn btn-primary btn-block" id="asSlip">🖨️ Sale Slip</button>
        <button class="btn btn-success btn-block" id="asInv">💵 Custom Invoice</button>
        <button class="btn btn-ghost btn-block" id="asView">👁️ View Invoice</button>
        <button class="btn btn-ghost btn-block" id="asNew">➕ Next Entry</button>
      </div>`,
    footer: null
  });
  $('#asSlip', w).onclick = () => { printSaleSlip(sale.id); };
  $('#asInv', w).onclick = () => { closeModal(w); openCustomInvoice(sale.id); };
  $('#asView', w).onclick = () => { closeModal(w); app.go('sales?sale=' + sale.id); };
  $('#asNew', w).onclick = () => { closeModal(w); nsPaint(); };
}

</script>

<!-- assets/js/pages/sales.js -->
<script>
/* ============================================================
   ORDER INVOICES / SALES — list, detail, delivery, printing
   ============================================================ */

const SalesUI = { q: '', status: 'all', branch: '', sort: 'entry_desc', page: 1, perPage: 25 };

function renderSales(param) {
  const p = param || {};
  UI.renderLayout('sales', `<div id="salesBody"></div>`);
  salesPaint();
  if (p.sale) setTimeout(() => openSaleDetail(p.sale), 60);
}

function salesFiltered() {
  let rows = Biz.sales();
  if (SalesUI.status !== 'all') rows = rows.filter(s => (SalesUI.status === 'open' ? s.status !== 'delivered' : s.status === SalesUI.status));
  if (SalesUI.branch) rows = rows.filter(s => s.branchId === SalesUI.branch);
  rows = rows.filter(s => Period.match(s.entryDate));
  const q = SalesUI.q.trim().toLowerCase();
  if (q) rows = rows.filter(s => String(s.invoiceNo).toLowerCase().includes(q) ||
    Biz.customerName(s.customerId).toLowerCase().includes(q) ||
    Biz.saleItemsSummary(s).toLowerCase().includes(q));
  const sorters = {
    entry_desc: (a, b) => String(b.entryDate).localeCompare(String(a.entryDate)) || String(b.invoiceNo).localeCompare(String(a.invoiceNo)),
    entry_asc: (a, b) => String(a.entryDate).localeCompare(String(b.entryDate)),
    kg_desc: (a, b) => num(b.kgTotal) - num(a.kgTotal),
    amount_desc: (a, b) => Biz.saleAmount(b) - Biz.saleAmount(a),
    cust_asc: (a, b) => Biz.customerName(a.customerId).localeCompare(Biz.customerName(b.customerId))
  };
  return rows.sort(sorters[SalesUI.sort] || sorters.entry_desc);
}

function salesPaint() {
  const el = $('#salesBody');
  if (!el) return;
  const rows = salesFiltered();
  const totalKg = round1(rows.reduce((a, s) => a + Biz.saleKg(s), 0));
  const totalAmt = round2(rows.reduce((a, s) => a + Biz.saleAmount(s), 0));
  const totalPend = round1(rows.reduce((a, s) => a + Biz.pendingKg(s), 0));
  const pages = Math.max(1, Math.ceil(rows.length / SalesUI.perPage));
  if (SalesUI.page > pages) SalesUI.page = pages;
  const slice = rows.slice((SalesUI.page - 1) * SalesUI.perPage, SalesUI.page * SalesUI.perPage);

  el.innerHTML = `
    ${Period.bar()}
    <div class="stats">
      ${UI.statCard({ icon: '🧾', label: 'Entries', value: fmtNum(rows.length), tone: 'info' })}
      ${UI.statCard({ icon: '⚖️', label: 'Total KG', value: fmtKg(totalKg), tone: 'purple' })}
      ${UI.statCard({ icon: '💰', label: 'Billed Amount', value: fmtMoney(totalAmt), tone: 'good' })}
      ${UI.statCard({ icon: '🏭', label: 'Pending in Factory', value: fmtKg(totalPend), tone: 'warn' })}
    </div>

    <div class="card">
      <div class="card-head">
        <h3>🧾 Order Invoices / Sales</h3>
        <div class="sp"></div>
        <div class="row" style="gap:6px;flex-wrap:nowrap">
          <input class="inp inp-sm" id="sSearch" placeholder="🔍 Invoice / customer / item" value="${esc(SalesUI.q)}" style="width:220px"/>
          <select class="inp inp-sm" id="sStatus" style="width:130px">
            <option value="all" ${SalesUI.status === 'all' ? 'selected' : ''}>All status</option>
            <option value="open" ${SalesUI.status === 'open' ? 'selected' : ''}>In Factory</option>
            <option value="delivered" ${SalesUI.status === 'delivered' ? 'selected' : ''}>Delivered</option>
          </select>
          <select class="inp inp-sm" id="sBranch" style="width:140px">
            <option value="">All branches</option>
            ${DB.all('branches').map(b => `<option value="${b.id}" ${SalesUI.branch === b.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}
          </select>
          <select class="inp inp-sm" id="sSort" style="width:150px">
            <option value="entry_desc" ${SalesUI.sort === 'entry_desc' ? 'selected' : ''}>Newest first</option>
            <option value="entry_asc" ${SalesUI.sort === 'entry_asc' ? 'selected' : ''}>Oldest first</option>
            <option value="kg_desc" ${SalesUI.sort === 'kg_desc' ? 'selected' : ''}>KG (high→low)</option>
            <option value="amount_desc" ${SalesUI.sort === 'amount_desc' ? 'selected' : ''}>Amount (high→low)</option>
            <option value="cust_asc" ${SalesUI.sort === 'cust_asc' ? 'selected' : ''}>Customer (A→Z)</option>
          </select>
          <button class="btn btn-ghost btn-sm" id="sExport">⬇️ CSV</button>
          <button class="btn btn-primary btn-sm" id="sNew">➕ New Sale</button>
        </div>
      </div>
      <div class="tbl-wrap">
        <table class="tbl" style="min-width:1080px">
          <thead><tr>
            <th>Invoice</th><th>Customer</th><th>Invoice Date</th><th>Delivery Date</th>
            <th>Items</th><th class="t-right">KG</th><th class="t-center">Status</th>
            <th class="t-right">Amount</th><th class="t-right">Due</th><th class="t-center">Actions</th>
          </tr></thead>
          <tbody>
            ${slice.length ? slice.map(s => {
    const due = num(s._due != null ? s._due : Biz.saleAmount(s));
    return `<tr class="row-click" data-view="${s.id}">
              <td class="t-strong t-nowrap">${esc(s.invoiceNo)}</td>
              <td>${esc(Biz.customerName(s.customerId))}<div class="tiny muted">${esc(Biz.branchName(s.branchId))}</div></td>
              <td class="t-nowrap">${fmtDate(s.entryDate)}</td>
              <td class="t-nowrap">${s.deliveryDate ? '<span class="t-ok">' + fmtDate(s.deliveryDate) + '</span>' : '<span class="t-warn tiny">pending</span>'}</td>
              <td class="tiny">${esc(Biz.saleItemsSummary(s))}</td>
              <td class="t-right t-nowrap"><b>${fmtKg(s.kgTotal)}</b></td>
              <td class="t-center">${UI.statusPill(s.status)}</td>
              <td class="t-right t-nowrap">${fmtMoney(Biz.saleAmount(s))}</td>
              <td class="t-right t-nowrap">${due > 0.009 ? '<b class="t-bad">' + fmtMoney(due) + '</b>' : '<span class="t-ok tiny">paid</span>'}</td>
              <td class="t-center t-nowrap">
                <button class="icon-btn" style="width:30px;height:30px;font-size:12px" data-view="${s.id}" title="View">👁️</button>
                ${s.status !== 'delivered' ? `<button class="icon-btn" style="width:30px;height:30px;font-size:12px" data-deliver="${s.id}" title="Deliver">🚚</button>` : ''}
                <button class="icon-btn" style="width:30px;height:30px;font-size:12px" data-pay="${s.id}" title="Payment">💵</button>
                <button class="icon-btn" style="width:30px;height:30px;font-size:12px" data-slip="${s.id}" title="Print slip">🖨️</button>
              </td>
            </tr>`;
  }).join('') : emptyRow(10, 'Is period mein koi sale nahi mili — “New Sale” se entry karein', '🧾')}
          </tbody>
          <tfoot><tr>
            <td colspan="5">TOTAL (${rows.length} entries)</td>
            <td class="t-right">${fmtKg(totalKg)}</td><td></td>
            <td class="t-right">${fmtMoney(totalAmt)}</td><td colspan="2"></td>
          </tr></tfoot>
        </table>
      </div>
      ${pages > 1 ? `<div class="card-body row" style="justify-content:center">
        <button class="btn btn-ghost btn-sm" ${SalesUI.page === 1 ? 'disabled' : ''} data-pg="${SalesUI.page - 1}">← Prev</button>
        <span class="small dim">Page ${SalesUI.page} of ${pages}</span>
        <button class="btn btn-ghost btn-sm" ${SalesUI.page === pages ? 'disabled' : ''} data-pg="${SalesUI.page + 1}">Next →</button>
      </div>` : ''}
    </div>`;

  Period.bind(el, () => { SalesUI.page = 1; salesPaint(); });
  const q = $('#sSearch'); if (q) q.oninput = debounce(e => { SalesUI.q = e.target.value; SalesUI.page = 1; salesPaint(); }, 250);
  const st = $('#sStatus'); if (st) st.onchange = e => { SalesUI.status = e.target.value; salesPaint(); };
  const sb = $('#sBranch'); if (sb) sb.onchange = e => { SalesUI.branch = e.target.value; salesPaint(); };
  const so = $('#sSort'); if (so) so.onchange = e => { SalesUI.sort = e.target.value; salesPaint(); };
  $('#sNew').onclick = () => app.go('newsales');
  $('#sExport').onclick = () => exportCSV('sales-' + Period.shortLabel().replace(/\s/g, '') + '.csv',
    ['Invoice', 'Customer', 'Invoice Date', 'Delivery Date', 'Items', 'KG', 'Rate', 'Amount', 'Status'],
    rows.map(s => [s.invoiceNo, Biz.customerName(s.customerId), s.entryDate, s.deliveryDate || '',
    Biz.saleItemsSummary(s), s.kgTotal, Biz.saleRate(s), Biz.saleAmount(s), s.status]));

  $$('[data-pg]', el).forEach(b => b.onclick = () => { SalesUI.page = +b.dataset.pg; salesPaint(); });
  $$('[data-view]', el).forEach(b => b.onclick = e => { e.stopPropagation(); openSaleDetail(b.dataset.view); });
  $$('[data-deliver]', el).forEach(b => b.onclick = e => { e.stopPropagation(); openDeliveryForm(b.dataset.deliver); });
  $$('[data-pay]', el).forEach(b => b.onclick = e => {
    e.stopPropagation();
    const s = DB.get('sales', b.dataset.pay);
    openPaymentForm(s.customerId, { saleId: s.id });
  });
  $$('[data-slip]', el).forEach(b => b.onclick = e => { e.stopPropagation(); printSaleSlip(b.dataset.slip); });
  $$('.row-click', el).forEach(tr => tr.onclick = () => openSaleDetail(tr.dataset.view));
}

function editSaleForm(id) {
  const s = DB.get('sales', id);
  if (!s) return;
  const cats = Biz.categories();
  const body = `
    <div class="grid g2">
      <label class="fld"><span>Customer</span>${UI.customerPicker('edCust', s.customerId, { addBtn: false })}</label>

      <label class="fld"><span>Invoice Date</span><input type="date" class="inp" id="edEntry" value="${esc(s.entryDate)}"/></label>

      <label class="fld"><span>Rate / KG</span><input type="number" class="inp" id="edRate" value="${esc(Biz.saleRate(s))}"/></label>

      <button class="btn btn-ghost btn-sm" id="edAddLine">➕ Add row</button></div>
      <div class="tbl-wrap"><table class="tbl" style="min-width:560px">
        <thead><tr><th>Item</th><th>Type</th><th class="t-right">KG</th><th></th></tr></thead>
        <tbody id="edLines"></tbody></table></div></div>
    <label class="fld mt10"><span>Note</span><textarea class="inp" id="edNote">${esc(s.note || '')}</textarea></label>
    <datalist id="edTypeList"></datalist>`;

  const w = openModal({
    title: '✏️ Edit ' + s.invoiceNo, size: 'lg', body,
    footer: `<button class="btn btn-ghost" data-close="1">Cancel</button><button class="btn btn-primary" id="edSave">💾 Save Changes</button>`
  });

  const prods = DB.all('products').filter(p => p.active !== false);
  function lineRow(l) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><select class="inp inp-xs edProd">
        ${prods.map(p => `<option value="${p.id}" ${p.id === l.productId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
        <option value="" ${!l.productId ? 'selected' : ''}>— other —</option></select></td>
      <td><input class="inp inp-xs edType" style="width:130px" list="edTypeList" value="${esc(l.type || '')}" placeholder="type (optional)" title="Jaise Junior Shoes"/></td>
      <td class="t-right"><input type="number" step="0.1" class="inp inp-xs edKg t-right" style="width:80px" value="${l.qtyKg}"/></td>
      <td><button class="icon-btn" style="width:28px;height:28px;font-size:11px" data-rml>✕</button></td>`;
    tr.querySelector('[data-rml]').onclick = () => tr.remove();
    return tr;
  }
  const tbody = $('#edLines', w);
  (s.lines || []).forEach(l => tbody.appendChild(lineRow(l)));
  /* item ke pehle se saved types (Step 03) suggest karne ke liye */
  const dlEd = $('#edTypeList', w);
  if (dlEd) {
    const seen = [];
    prods.forEach(p => (p.types || []).forEach(t => { if (t && seen.indexOf(t) < 0) seen.push(t); }));
    (s.lines || []).forEach(l => { if (l.type && seen.indexOf(l.type) < 0) seen.push(l.type); });
    dlEd.innerHTML = seen.map(t => '<option value="' + esc(t) + '"></option>').join('');
  }
  $('#edAddLine', w).onclick = () => tbody.appendChild(lineRow({ productId: prods[0] ? prods[0].id : '', category: '', type: '', qtyKg: 0, pcs: 0 }));

  $('#edSave', w).onclick = () => {
    const lines = $$('tr', tbody).map(tr => {
      const pid = tr.querySelector('.edProd').value;
      const kg = round1(tr.querySelector('.edKg').value);
      const tyEl = tr.querySelector('.edType');
      return { id: uid('ln'), productId: pid || null, productName: (Biz.product(pid) || {}).name || 'Item', category: (Biz.product(pid) || {}).category || '', type: (tyEl ? tyEl.value.trim() : ''), qtyKg: kg, pcs: 0, note: '' };
    }).filter(l => l.qtyKg > 0);
    if (!lines.length) return toast('Kam az kam ek item rakhein', 'error');
    /* Step 03: edit mein likhe naye type naam item par yaad rakhein */
    lines.forEach(l => { if (l.type && l.productId) Biz.saveProductType(l.productId, l.type); });
    const rate = num($('#edRate', w).value) || Biz.rate();
    const kgTotal = round1(lines.reduce((a, l) => a + l.qtyKg, 0));
    const deliveryDate = $('#edDelivery', w).value || '';
    const status = deliveryDate ? (round2(num(s.deliveredKg)) >= kgTotal ? 'delivered' : 'delivered') : 'open';
    DB.upsert('sales', Object.assign({}, s, {
      customerId: $('#edCust', w).value || s.customerId,
      branchId: $('#edBranch', w).value,
      entryDate: $('#edEntry', w).value || s.entryDate,
      deliveryDate,
      status: deliveryDate ? 'delivered' : 'open',
      deliveredKg: deliveryDate ? kgTotal : 0,
      deliveredPcs: 0,
      lines, kgTotal, piecesTotal: 0,
      rate, amount: round2(kgTotal * rate), amountManual: null, note: $('#edNote', w).value || ''
    }));
    DB.audit('sale-edit', 'Invoice ' + s.invoiceNo + ' edit hui');
    toast('✔ Changes save ho gaye', 'success');
    closeModal(w);
    salesPaint();
  };
}
